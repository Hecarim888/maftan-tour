];

var STOP_TITLES = [
  'פונה ממלאת טופס', 'הפנייה בלוח', 'הזמנה לשיחה', 'פתיחת תהליך וחוזה', 'חתימה בדף האישי',
  'היום: כל המפגשים', 'הכנה למפגש', 'סיום מפגש ומחברת', 'הצעד הקטן אצל המתאמנת', 'תיק המתאמנת'
];

function firstSceneOfStop(stop) {
  for (var i = 0; i < SCENES.length; i++) if (SCENES[i].stop === stop) return i;
  return 0;
}

/* ------------------------------------------------------------------- mount */
var D = {};
var cur = -1;   /* -1 opening · 0..SCENES.length-1 scenes · SCENES.length closing */

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function mount() {
  D.device = byId('mf-device');
  D.app = byId('mf-app');
  D.proto = byId('proto');
  D.device.classList.add('tour-device');
  D.bar = el('div', 'tour-bar');
  D.bar.setAttribute('role', 'region');
  D.bar.setAttribute('aria-label', 'ההדרכה');
  D.layer = el('div', 'tour-layer');
  D.layer.hidden = true;
  D.device.appendChild(D.bar);
  D.device.appendChild(D.layer);
}

function renderBar() {
  var s = SCENES[cur], dots = '', i;
  for (i = 1; i <= STOPS; i++) {
    dots += '<li class="tour-dot' + (i < s.stop ? ' is-done' : i === s.stop ? ' is-current' : '') + '"></li>';
  }
  var extra = s.extraFn ? s.extraFn() : s.extra;
  D.bar.innerHTML =
    '<div class="tour-bar__in">' +
      '<div class="tour-bar__top">' +
        '<span class="tour-tag tour-tag--' + s.side + '">' + esc(SIDE[s.side]) + '</span>' +
        '<ol class="tour-dots" aria-label="תחנה ' + s.stop + ' מתוך ' + STOPS + '">' + dots + '</ol>' +
      '</div>' +
      '<div class="tour-bar__main">' +
        '<p class="tour-cap" aria-live="polite">' + esc(s.cap) + '</p>' +
        '<button type="button" class="btn btn--quiet tour-prev" data-tour="prev"' + (cur === 0 ? ' aria-label="חזרה למסך הפתיחה"' : '') + '>הקודם</button>' +
        '<button type="button" class="btn btn--primary tour-next" data-tour="next">הבא</button>' +
      '</div>' +
      (extra ? '<p class="tour-extra">' + esc(extra) + '</p>' : '') +
    '</div>';
}

function showLayer(html, focusSel) {
  D.layer.innerHTML = html;
  D.layer.hidden = false;
  D.layer.scrollTop = 0;
  D.bar.hidden = true;
  var f = focusSel && D.layer.querySelector(focusSel);
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}

function showOpening() {
  cur = -1;
  save();
  showLayer(
    '<section class="tour-open" aria-label="פתיחה">' +
      '<h1 class="tour-open__name">מפתן</h1>' +
      '<button type="button" class="btn btn--primary tour-open__go" data-tour="start">התחילי</button>' +
    '</section>', '.tour-open__go');
}

function tile(i) {
  var stop = i + 1;
  return '<button type="button" class="row tour-tile" data-tour="stop" data-stop="' + stop + '">' +
    '<span class="tc tc--planned" aria-hidden="true">' + stop + '</span>' +
    '<span class="row__main"><span class="row__title">' + esc(STOP_TITLES[i]) + '</span></span>' +
    '<span class="row__chev" aria-hidden="true">' + App.icon('chevron') + '</span></button>';
}

function waHref() {
  var msg = 'שלום, ראיתי את מפתן. התשובות שלי:\n\n' +
    QUESTIONS.map(function (q, i) { return (i + 1) + '. ' + q + '\n'; }).join('\n');
  return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
}

function showClosing() {
  cur = SCENES.length;
  save();
  var i, intake = '', process = '';
  for (i = 0; i < 3; i++) intake += tile(i);
  for (i = 3; i < STOPS; i++) process += tile(i);
  var desktop = proto().getAttribute('data-mode') === 'desktop';
  showLayer(
    '<section class="tour-close" aria-labelledby="tour-close-h">' +
      '<div class="tour-close__top"><button type="button" class="icon-btn" data-tour="back-from-close" aria-label="חזרה לתחנה האחרונה">' + App.icon('back', 24) + '</button></div>' +
      '<h1 class="page-title" id="tour-close-h">כל מפתן במפה אחת</h1>' +
      '<div class="stack"><h2 class="h2">איסוף פניות</h2><div class="rows">' + intake + '</div></div>' +
      '<div class="stack"><h2 class="h2">ניהול תהליכים</h2><div class="rows">' + process + '</div></div>' +
      '<button type="button" class="btn btn--secondary btn--block" data-tour="desktop">' + (desktop ? 'לחזור לתצוגת טלפון' : 'לראות במחשב') + '</button>' +
      '<div class="stack tour-q"><h2 class="h2">שלוש שאלות קטנות</h2><ol class="tour-q__list">' +
        QUESTIONS.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>' +
        '<a class="btn btn--primary btn--block" data-tour-wa href="' + esc(waHref()) + '" target="_blank" rel="noopener">' + App.icon('whatsapp') + 'לענות בוואטסאפ</a></div>' +
      '<button type="button" class="btn btn--quiet btn--block" data-tour="restart">להתחיל מההתחלה</button>' +
    '</section>', '#tour-close-h');
}

function proto() { return D.proto; }

function save() {
  try { sessionStorage.setItem(STORE, String(cur)); } catch (e) { /* storage blocked */ }
}

function goScene(i) {
  if (i < 0) { showOpening(); return; }
  if (i >= SCENES.length) { showClosing(); return; }
  cur = i;
  save();
  D.layer.hidden = true;
  D.layer.innerHTML = '';
  D.bar.hidden = false;
  var s = SCENES[i];
  reset();
  build(s.phase);
  /* a failing scene must never strand her: the bar (and [הבא]) is drawn even if the scene's own setup throws */
  try { s.enter(); } catch (e) { if (window.console) console.error('[tour scene ' + i + ']', e); }
  renderBar();
  try { if (s.after) s.after(); } catch (e2) { if (window.console) console.error('[tour scene ' + i + ' after]', e2); }
  applyHint();
  setTimeout(revealHint, 60);
}

function setProtoMode(m) {
  var b = document.querySelector('[data-chrome="mode"][data-mode="' + m + '"]');
  if (b) b.click();
}

function onTourClick(e) {
  var b = e.target.closest && e.target.closest('[data-tour]');
  if (!b) return;
  switch (b.getAttribute('data-tour')) {
    case 'start': goScene(0); break;
    case 'next': goScene(cur + 1); break;
    case 'prev': goScene(cur - 1); break;
    case 'stop': goScene(firstSceneOfStop(+b.getAttribute('data-stop'))); break;
    case 'back-from-close': goScene(SCENES.length - 1); break;
    case 'restart': setProtoMode('phone'); goScene(-1); break;
    case 'desktop':
      if (window.innerWidth >= 700) {
        var toDesktop = proto().getAttribute('data-mode') !== 'desktop';
        setProtoMode(toDesktop ? 'desktop' : 'phone');
        if (toDesktop) goScene(firstSceneOfStop(2)); else showClosing();
      } else if (window.TOUR_SHOTS) {
        showShots();
      } else {
        App.toast('במחשב זה נראה בתצוגה רחבה');
        D.bar.hidden = true;
      }
      break;
    case 'shots-close': showClosing(); break;
    case 'zoom':
      var box = b.closest('.tour-shot').querySelector('.tour-shot__scroll');
      var fit = box.classList.toggle('is-fit');
      b.textContent = fit ? 'הגדלה' : 'הקטנה';
      break;
  }
}

/* narrow screens cannot show the wide layout: ready-made pictures of it instead (generated from this same build) */
function showShots() {
  var items = window.TOUR_SHOTS.map(function (s) {
    return '<figure class="tour-shot"><figcaption class="tour-shot__head"><span class="h3">' + esc(s.title) + '</span>' +
      '<button type="button" class="btn btn--quiet btn--sm" data-tour="zoom">הגדלה</button></figcaption>' +
      '<div class="tour-shot__scroll is-fit" tabindex="0" role="group" aria-label="' + esc(s.title) + '"><img src="' + s.src + '" alt="' + esc(s.title) + ' במחשב" width="' + s.w + '" height="' + s.h + '"></div></figure>';
  }).join('');
  showLayer(
    '<section class="tour-close" aria-labelledby="tour-shots-h">' +
      '<div class="tour-close__top"><button type="button" class="icon-btn" data-tour="shots-close" aria-label="חזרה">' + App.icon('back', 24) + '</button></div>' +
      '<h1 class="page-title" id="tour-shots-h">במחשב</h1>' + items + '</section>', '#tour-shots-h');
}

/* ---------------------------------------------------- Hebrew only, patches */
var TEXT_FIX = [
  [/\.pdf\b/gi, ''],
  [/\bPDF\b/g, 'קובץ'],
  [/\bWord\b/g, 'מסמך'],
  [/\bGoogle\b/g, 'גוגל'],
  [/\bQR\b/g, 'סריקה'],
  [/\b(\d{1,2}\.\d{1,2})\.20\d\d\b/g, '$1'],
  [/לאב הטיפוס/g, 'להצגה'],
  [/האב טיפוס/g, 'ההצגה'],
  [/אב הטיפוס/g, 'ההצגה']
];
/* the contract setup: the second option is the school's contract, offered by name */
var SETUP_FIX = [
  [/^חוזה משלי$/, 'החוזה של רידמן'],
  [/^העלאת קובץ .* או .*$/, 'נוסח בית הספר']
];

function fixText(root) {
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, t, u, k;
  var inSetup = !!root.querySelector('.cset');
  while ((n = w.nextNode())) {
    t = n.nodeValue;
    if (!t || !/[A-Za-z]{2,}|20\d\d|אב ה?טיפוס|^\s*חוזה משלי\s*$/.test(t)) continue;
    u = t;
    if (inSetup && n.parentNode && n.parentNode.closest && n.parentNode.closest('.cset')) {
      for (k = 0; k < SETUP_FIX.length; k++) u = u.replace(SETUP_FIX[k][0], SETUP_FIX[k][1]);
    }
    for (k = 0; k < TEXT_FIX.length; k++) u = u.replace(TEXT_FIX[k][0], TEXT_FIX[k][1]);
    if (u !== t) n.nodeValue = u;
  }
}

function clausesHTML(withBadge) {
  var rt = App.state.route.params || {};
  var c = MD.client(App.data, rt.client) || {};
  var coach = App.data.coach || {};
  var who = MD.byGender(c.gender, 'המתאמנת', 'המתאמן', 'המתאמן/ת');
  var rows = [
    ['התהליך', 'תהליך האימון כולל מספר מפגשים שנקבע מראש, במועדים שמתואמים בין הצדדים.'],
    ['אחריות אישית', 'ההשתתפות היא מתוך בחירה חופשית, והאחריות להחלטות ולפעולות בתהליך היא של ' + who + '.'],
    ['סודיות', 'מה שנאמר במפגשים נשאר בין הצדדים, למעט מקרים שבהם החוק מחייב אחרת.'],
    ['ביטול ושינוי מועד', 'שינוי או ביטול של מפגש מודיעים מראש, ומתאמים מועד חדש.'],
    ['תשלום', 'התשלום לפי המחיר שסוכם, בתום כל מפגש.']
  ];
  if (coach.contract && coach.contract.intern) {
    rows.push(['הכשרה', 'המאמנת נמצאת בהכשרה, ולכן מפגשים עשויים להיות מוקלטים ולהיות נדונים בהדרכה, בסודיות ובהסכמה.']);
  }
  return (withBadge ? '<p class="tour-sample"><span class="chip chip--neutral">נוסח לדוגמה</span></p>' : '') +
    rows.map(function (r) { return '<section class="cp-clause"><h3>' + esc(r[0]) + '</h3><p>' + esc(r[1]) + '</p></section>'; }).join('');
}

function patchDom() {
  var ct = D.device.querySelector('.cp-ctext');
  if (ct && !ct.hasAttribute('data-tour')) {
    ct.setAttribute('data-tour', '1');
    ct.innerHTML = clausesHTML(true);
  }

  var swap = D.device.querySelector('.cset__own [data-act="ctrPick"]');
  if (swap) swap.remove();
  /* the leads menu rows that only show a toast (not built yet) are left out */
  Array.prototype.forEach.call(D.device.querySelectorAll('.lmenu [data-act="leadsToast"]'), function (r) { r.remove(); });
  fixText(D.device);
}

/* the contract setup: choosing the school's contract needs no file; reading the text opens the sample text */
(function patchContractActions() {

/* ------------------------------------------------------------ hint (pulse) */
function visible(e) { return !!(e.offsetWidth || e.offsetHeight || e.getClientRects().length); }

function applyHint() {
  Array.prototype.forEach.call(D.device.querySelectorAll('.tour-pulse'), function (e) { e.classList.remove('tour-pulse'); });
  var s = SCENES[cur];
  if (!s || !s.hint || D.bar.hidden) return;
  for (var i = 0; i < s.hint.length; i++) {
    var found = Array.prototype.filter.call(D.device.querySelectorAll(s.hint[i]), visible)[0];
    if (found) { found.classList.add('tour-pulse'); return; }
  }
}

/* once per scene: if the pulsing target is below the fold, scroll it into view (the screens' own sticky bars are left alone) */
function revealHint() {
  var e = D.device.querySelector('.tour-pulse'), sc = byId('mf-scroll');
  if (!e || !sc || !sc.contains(e)) return;
  var r = e.getBoundingClientRect(), v = sc.getBoundingClientRect();
  if (r.bottom > v.bottom - 8 || r.top < v.top + 8) sc.scrollTop += r.top - v.top - Math.max(16, (v.height - r.height) / 3);
}

function onChange() {
  patchDom();
  var s = SCENES[cur];
  if (s && s.after) s.after();
  applyHint();
}

/* -------------------------------------------------------------------- start */
function init() {
  if (!byId('mf-device') || !App.state.data || !App.state.data.leads) return;   /* the shell did not start: its own error panel shows */
  mount();
  document.addEventListener('click', onTourClick);
  new MutationObserver(onChange).observe(D.device, { childList: true, subtree: true });
  if (D.proto.getAttribute('data-mode') === 'desktop') setProtoMode('phone');
  var saved = -1;
  try { saved = parseInt(sessionStorage.getItem(STORE), 10); } catch (e) { /* storage blocked */ }
  if (isNaN(saved) || saved < 0) showOpening(); else goScene(Math.min(saved, SCENES.length));
}

window.__tour = { go: function (i) { goScene(i); }, scenes: SCENES, index: function () { return cur; } };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
