<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="מפתן">
<meta property="og:description" content="סיור קצר בתהליך העבודה של מאמנת, מהפנייה הראשונה ועד תיק המתאמנת">
<meta property="og:type" content="website">
<title>מפתן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Noto+Serif+Hebrew:wght@500&display=swap">
<style>
/* ---- 00-base.css ---- */
/* ==========================================================================
   Maftan prototype shell: tokens, base, components, prototype chrome, device,
   navigation, sheets, toasts. Light theme only. RTL. Container name: app.
   Type sizes: 14 / 16 / 18 / 28 (serif page titles 26-28). Nothing under 14px.
   ========================================================================== */

:root {
  color-scheme: light;

  /* Stone neutrals, tinted toward sage */
  --mf-bg: #F7F5F0;
  --mf-surface: #FCFBF8;
  --mf-surface-sunken: #EFEBE3;
  --mf-surface-sunken-hover: #E6E1D7;
  --mf-surface-inverse: #26302A;
  --mf-text: #26302A;
  --mf-text-muted: #5B655E;
  --mf-text-disabled: #8E948F;
  --mf-text-on-inverse: #F7F5F0;
  --mf-text-on-inverse-muted: #B8C0BA;
  --mf-border-subtle: #E3DED4;
  --mf-border-hover: #CFC9BE;
  --mf-border-control: #80877F;

  /* Sage */
  --mf-primary: #4E6E58;
  --mf-primary-hover: #435F4C;
  --mf-primary-pressed: #38503F;
  --mf-primary-strong: #3E5A47;
  --mf-on-primary: #FCFBF8;
  --mf-primary-tint: #E6EEE6;
  --mf-primary-tint-hover: #DAE5DB;
  --mf-primary-tint-pressed: #CFDDD1;
  --mf-primary-on-inverse: #A9C8B1;

  /* Terracotta: the small step and today only */
  --mf-highlight: #B8694A;
  --mf-highlight-soft: #F3E3DA;
  --mf-highlight-text: #7A3F27;
  --step-card-text: #4A2617;

  /* Semantic */
  --mf-success: #3B7A4F;
  --mf-success-soft: #E2EFE4;
  --mf-success-text: #2D6541;
  --mf-warning: #94700F;
  --mf-warning-soft: #F6ECCB;
  --mf-warning-text: #6B5110;
  --mf-error: #A61E3C;
  --mf-error-hover: #8E1A33;
  --mf-error-soft: #FBE8EC;
  --mf-error-text: #8E1A33;
  --mf-error-on-inverse: #F2A7B4;

  /* Focus and overlays */
  --mf-focus-ring: #2F4A39;
  --mf-focus-ring-on-dark: #FCFBF8;
  --mf-scrim: rgb(26 33 29 / 0.45);

  /* Elevation */
  --mf-shadow-overlay: 0 1px 2px rgb(38 48 42 / 0.06), 0 8px 24px rgb(38 48 42 / 0.10);
  --mf-shadow-drag: 0 2px 4px rgb(38 48 42 / 0.08), 0 12px 32px rgb(38 48 42 / 0.14);

  /* Motion */
  --mf-dur-fast: 120ms;
  --mf-dur-base: 200ms;
  --mf-dur-slow: 280ms;
  --mf-ease: cubic-bezier(0.2, 0, 0, 1);
  --mf-ease-exit: cubic-bezier(0.4, 0, 1, 1);

  /* Layout */
  --mf-gutter: 20px;
  --mf-topbar-h: 56px;
  --mf-bottom-nav-h: 64px;
  --mf-rail-w: 232px;
  --mf-rail-compact-w: 88px;
  --mf-drawer-w: 480px;
  --mf-reading-max: 640px;
  --mf-list-max: 720px;
  --mf-wide-max: 1040px;

  /* Spacing, radius */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-14: 56px; --space-16: 64px;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 4px; --radius-lg: 20px; --radius-full: 9999px;

  /* z-index */
  --z-sticky: 10; --z-drawer: 30; --z-scrim: 40; --z-dialog: 50; --z-toast: 60; --z-tooltip: 70;

  /* Fonts */
  --font-sans: Assistant, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Noto Serif Hebrew", Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Coach accent (default accent_1 sage; overridden by [data-coach-accent]) */
  --coach: #4E6E58;
  --coach-hover: #435F4C;
  --coach-soft: #E6EEE6;
  --coach-strong: #3E5A47;
  --coach-on: #FCFBF8;

  /* Score bands (kept for completeness; the prototype uses neutral chips + sage selected) */
  --scale-low-tint: #F3E3DA; --scale-low-border: #E2C3B3; --scale-low-text: #7A3F27; --scale-low-selected: #9C5236;
  --scale-mid-tint: #EFE8D6; --scale-mid-border: #DDCFAE; --scale-mid-text: #6B5320; --scale-mid-selected: #86692C;
  --scale-high-tint: #E6EEE6; --scale-high-border: #C3D3C6; --scale-high-text: #2F4A39; --scale-high-selected: #4E6E58;

  /* Lead phase tones: fill / border / dot */
  --ph-new-fill: #F6EFDF;     --ph-new-border: #E2D6BC;     --ph-new-dot: #86692C;
  --ph-before-fill: #FCFBF8;  --ph-before-border: #E3DED4;  --ph-before-dot: #80877F;
  --ph-after-fill: #EBF3ED;   --ph-after-border: #CFDDD1;   --ph-after-dot: #4E6E58;
  --ph-wait-fill: #EAEFF4;    --ph-wait-border: #CDD8E3;    --ph-wait-dot: #44607E;
  --ph-success-fill: #E2EFE4; --ph-success-border: #A9CBB2; --ph-success-dot: #2D6541;
  --ph-neutral-fill: #EFEBE3; --ph-neutral-border: #CFC9BE; --ph-neutral-dot: #5B655E;

  /* Prototype chrome (outside the product) */
  --proto-bg: #E9E5DC;
  --proto-bar-h: 48px;
}

[data-coach-accent="accent_1"] { --coach: #4E6E58; --coach-hover: #435F4C; --coach-soft: #E6EEE6; --coach-strong: #3E5A47; }
[data-coach-accent="accent_2"] { --coach: #2E6A68; --coach-hover: #25595A; --coach-soft: #DCEBE9; --coach-strong: #1F4D4B; }
[data-coach-accent="accent_3"] { --coach: #44607E; --coach-hover: #38506B; --coach-soft: #E1E8F0; --coach-strong: #2F4862; }
[data-coach-accent="accent_4"] { --coach: #6E4A66; --coach-hover: #5D3E56; --coach-soft: #EFE4EC; --coach-strong: #543850; }
[data-coach-accent="accent_5"] { --coach: #9C5236; --coach-hover: #86452D; --coach-soft: #F4E3D9; --coach-strong: #7A3D26; }
[data-coach-accent="accent_6"] { --coach: #76592F; --coach-hover: #644B27; --coach-soft: #F0E7D8; --coach-strong: #584224; }

@media (max-width: 360px) { :root { --mf-gutter: 16px; } }

/* ---------- Base reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--proto-bg);
  color: var(--mf-text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  word-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }
h1 { font: 500 28px/38px var(--font-display); font-synthesis: none; }
h2 { font: 700 18px/27px var(--font-sans); }
h3, h4, h5, h6 { font: 700 16px/24px var(--font-sans); }
ul[role="list"], ol[role="list"] { list-style: none; padding: 0; }
a { color: var(--mf-primary-strong); }
a:hover { color: var(--mf-focus-ring); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: normal; }
button { cursor: pointer; }
button:disabled, [aria-disabled="true"] { cursor: not-allowed; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }
bdi, .ltr { unicode-bidi: isolate; }
.ltr { direction: ltr; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; }
.on-dark :focus-visible { outline-color: var(--mf-focus-ring-on-dark); }

* { scrollbar-width: thin; scrollbar-color: var(--mf-border-hover) transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Icons ---------- */
.ico { flex: none; display: inline-block; vertical-align: middle; }
[dir="rtl"] .ico--mirror { transform: scaleX(-1); }

/* ---------- Utilities ---------- */
.muted { color: var(--mf-text-muted); }
.t-sm { font-size: 14px; line-height: 21px; }
.t-lg { font-size: 18px; line-height: 31px; }
.t-strong { font-weight: 600; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack--sm { gap: 8px; }
.stack--lg { gap: 24px; }
.stack--xl { gap: 32px; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hairline { height: 1px; background: var(--mf-border-subtle); border: 0; margin: 0; }
.h2 { font: 700 18px/27px var(--font-sans); }
.h3 { font: 700 16px/24px var(--font-sans); }

/* ---------- Page ---------- */
.screen {
  --screen-gap: 40px;
  --screen-pad-bottom: 40px;
  flex: 1 0 auto;
  width: 100%;
  margin-inline: auto;
  padding: 28px var(--mf-gutter) var(--screen-pad-bottom);
  display: flex;
  flex-direction: column;
  gap: var(--screen-gap);
  min-width: 0;
}
.screen--wizard { --screen-gap: 32px; padding-top: 24px; }
.screen--reading { max-width: calc(var(--mf-reading-max) + 2 * var(--mf-gutter)); }
.screen--wide { max-width: calc(var(--mf-wide-max) + 2 * var(--mf-gutter)); }
.screen--full { max-width: none; }
.screen--bleed { padding: 0; gap: 0; max-width: none; }
.page-title { font: 500 28px/38px var(--font-display); font-synthesis: none; }
.page-sub { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.page-head { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.page-head__eyebrow { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  border: 1px solid transparent; border-radius: var(--radius);
  background: transparent; color: var(--mf-primary-strong);
  font: 600 16px/20px var(--font-sans);
  text-decoration: none; text-align: center; white-space: nowrap;
  transition: background-color var(--mf-dur-fast) var(--mf-ease), color var(--mf-dur-fast) var(--mf-ease);
  -webkit-tap-highlight-color: transparent;
}
.btn .ico { width: 20px; height: 20px; }
.btn:hover { color: var(--mf-primary-strong); }
.btn--primary { min-height: 52px; background: var(--mf-primary); color: var(--mf-on-primary); }
.btn--primary:hover { background: var(--mf-primary-hover); color: var(--mf-on-primary); }
.btn--primary:active { background: var(--mf-primary-pressed); }
.btn--secondary { background: var(--mf-primary-tint); color: var(--mf-primary-strong); }
.btn--secondary:hover { background: var(--mf-primary-tint-hover); }
.btn--secondary:active { background: var(--mf-primary-tint-pressed); }
.btn--quiet { background: transparent; color: var(--mf-primary-strong); }
.btn--quiet:hover { background: var(--mf-surface-sunken); }
.btn--quiet:active { background: var(--mf-surface-sunken-hover); }
.btn--danger { background: var(--mf-error); color: var(--mf-on-primary); }
.btn--danger:hover { background: var(--mf-error-hover); color: var(--mf-on-primary); }
.btn--block { display: flex; width: 100%; }
.btn--sm { min-height: 44px; padding: 0 16px; }
.btn:disabled, .btn[aria-disabled="true"] {
  background: var(--mf-surface-sunken); color: var(--mf-text-disabled); border-color: transparent;
}
.btn-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.icon-btn {
  flex: none; width: 44px; height: 44px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--mf-text-muted);
  text-decoration: none;
  transition: background-color var(--mf-dur-fast) var(--mf-ease), color var(--mf-dur-fast) var(--mf-ease);
}
.icon-btn:hover { background: var(--mf-surface-sunken); color: var(--mf-text); }
.icon-btn .ico { width: 20px; height: 20px; }
.link-btn {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; margin-inline: -4px;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--mf-primary-strong); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}

/* ---------- Fields ---------- */
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > label, .field__label { font-size: 16px; line-height: 24px; font-weight: 600; }
.field__row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.field__hint { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.field__error { font-size: 14px; line-height: 21px; font-weight: 600; color: var(--mf-error); }
.field :is(input, textarea, select):not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="hidden"]),
.input {
  width: 100%; min-height: 48px; padding: 0 14px;
  background: var(--mf-surface); color: var(--mf-text);
  border: 1px solid var(--mf-border-control); border-radius: var(--radius);
  font-size: 16px; line-height: 24px;
}
/* H1: the `:not([type="hidden"])` is a no-op that lifts this rule to the specificity of the shared field rule above
   (0,2,1); it comes later, so it wins and textareas keep 12px vertical / 14px horizontal padding */
/* No drag handle (it let a text box grow past its sheet and sit under the sticky footer): the box grows with its text
   up to a cap, then scrolls inside itself. `field-sizing` is ignored by browsers without it: they keep min-height. */
.field textarea:not([type="hidden"]), textarea.input { min-height: 96px; max-height: min(45vh, 320px); padding: 12px 14px; line-height: 1.6; resize: none; field-sizing: content; }
.field :is(input, textarea, select)::placeholder, .input::placeholder { color: var(--mf-text-muted); opacity: 1; }
.field :is(input, textarea, select):focus-visible, .input:focus-visible {
  border-color: var(--mf-primary); outline: 2px solid var(--mf-focus-ring); outline-offset: 2px;
}
.field :is(input, textarea, select)[aria-invalid="true"], .input[aria-invalid="true"] {
  border-color: var(--mf-error); border-width: 1.5px;
}
.field :is(input, textarea, select):disabled, .input:disabled {
  background: var(--mf-surface-sunken); color: var(--mf-text-disabled); border-color: var(--mf-border-subtle);
}
.field input[dir="ltr"], input.input[dir="ltr"] { text-align: right; }
[dir="ltr"] .field input[dir="ltr"] { text-align: left; }
.field select:not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="hidden"]), select.input {
  -webkit-appearance: none; appearance: none; cursor: pointer; padding-inline-end: 44px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%235B655E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-size: 20px 20px;
  background-position: left 16px center;
}
[dir="ltr"] .field select:not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="hidden"]), [dir="ltr"] select.input { background-position: right 16px center; }
.field input[type="date"], .field input[type="time"] { text-align: start; }

/* Segmented control */
.seg { display: inline-flex; gap: 0; padding: 4px; background: var(--mf-surface-sunken); border-radius: var(--radius); max-width: 100%; }
.seg--block { display: flex; width: 100%; }
.seg > button {
  position: relative; flex: 1 1 auto; min-height: 40px; padding: 0 16px;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--mf-text-muted); font-size: 16px; line-height: 20px; font-weight: 400; white-space: nowrap;
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.seg > button::after { content: ""; position: absolute; inset: -2px 0; }
.seg > button:hover { color: var(--mf-text); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] {
  background: var(--mf-surface); color: var(--mf-text); font-weight: 600;
  box-shadow: 0 0 0 1px var(--mf-border-control);
}

/* Switch */
/* L9: the button box is 52x44 (the tap target); the visible 52x32 track (::before) and 24px thumb (::after) are drawn
   inside it, and the -6px block margin keeps the layout footprint at 32px, so nothing around it moves */
.switch {
  position: relative; flex: none; width: 52px; height: 44px; margin-block: -6px; padding: 0;
  border: 0; background: transparent; -webkit-tap-highlight-color: transparent;
}
.switch::before {
  content: ""; position: absolute; inset: 6px 0;
  border: 1.5px solid var(--mf-border-control); border-radius: 999px; background: var(--mf-surface-sunken);
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.switch::after {
  content: ""; position: absolute; top: 10px; inset-inline-start: 4px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--mf-surface);
  box-shadow: 0 0 0 1px var(--mf-border-control);
  transition: inset-inline-start var(--mf-dur-fast) var(--mf-ease);
}
.switch:focus-visible { outline: none; }
.switch:focus-visible::before { outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; }
.switch[aria-checked="true"]::before { background: var(--mf-primary); border-color: var(--mf-primary); }
.switch[aria-checked="true"]::after { inset-inline-start: 24px; background: var(--mf-on-primary); box-shadow: none; }
.switch-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; width: 100%;
  padding: 8px 0; text-align: start; background: transparent; border: 0;
}
.switch-row__text { min-width: 0; display: flex; flex-direction: column; }
.switch-row__title { font-weight: 600; }
.switch-row__meta { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

/* Checkbox / radio rows */
.check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 10px 0; font-size: 16px; line-height: 24px; cursor: pointer; }
.check input, .choice input {
  -webkit-appearance: none; appearance: none; flex: none; width: 20px; height: 20px; margin: 2px 0 0;
  border: 1.5px solid var(--mf-border-control); border-radius: var(--radius-xs); background-color: var(--mf-surface);
  background-repeat: no-repeat; background-position: center; background-size: 16px;
  cursor: pointer;
}
.choice input { margin: 0; }
.check input[type="radio"], .choice input[type="radio"] { border-radius: 50%; }
.check input:checked, .choice input:checked { background-color: var(--mf-primary); border-color: var(--mf-primary); }
.check input[type="checkbox"]:checked, .choice input[type="checkbox"]:checked {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FCFBF8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>");
}
.check input[type="radio"]:checked, .choice input[type="radio"]:checked { box-shadow: inset 0 0 0 4px var(--mf-surface); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-control); border-radius: var(--radius); cursor: pointer;
}
.choice:has(input:checked) { background: var(--mf-primary-tint); border-color: var(--mf-primary); font-weight: 600; }
.choice:has(input:focus-visible) { outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; }

/* ---------- Lists ---------- */
.rows { list-style: none; padding: 0; background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); overflow: hidden; }
.rows > * + * { border-top: 1px solid var(--mf-border-subtle); }
.rows--flat { background: transparent; border: 0; border-radius: 0; overflow: visible; }
.rows--flat > * { border-bottom: 1px solid var(--mf-border-subtle); }
.rows--flat > * + * { border-top: 0; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
  padding: 10px 16px 10px 20px; padding-inline: 20px 16px;
  background: transparent; border: 0; color: var(--mf-text); text-align: start; text-decoration: none;
  font-size: 16px; line-height: 24px;
}
.rows--flat .row { padding-inline: 0 8px; }
button.row, a.row { transition: background-color var(--mf-dur-fast) var(--mf-ease); }
button.row:hover, a.row:hover { background: var(--mf-surface-sunken); color: var(--mf-text); }
button.row:focus-visible, a.row:focus-visible { outline-offset: -2px; }
.row__main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row__title { font-weight: 600; font-size: 16px; line-height: 24px; overflow-wrap: anywhere; }
.row__meta { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.row__end { flex: none; display: flex; align-items: center; gap: 8px; color: var(--mf-text-muted); }
.row__chev { flex: none; display: inline-flex; color: var(--mf-text-muted); }
.row__chev .ico { width: 20px; height: 20px; }

/* ---------- Chips (read-only status badges) and interactive chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 10px;
  border-radius: 999px; background: var(--mf-primary-tint); color: var(--mf-primary-strong);
  font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; vertical-align: middle;
}
.chip .ico { width: 16px; height: 16px; }
.chip--today { background: var(--mf-highlight-soft); color: var(--mf-highlight-text); }
.chip--success { background: var(--mf-success-soft); color: var(--mf-success-text); }
.chip--warn { background: var(--mf-warning-soft); color: var(--mf-warning-text); }
.chip--neutral { background: var(--mf-surface-sunken); color: var(--mf-text-muted); }
.chip--outline { background: var(--mf-surface); color: var(--mf-text-muted); box-shadow: inset 0 0 0 1px var(--mf-border-subtle); font-weight: 400; }
.chip--count { background: var(--mf-surface-inverse); color: var(--mf-text-on-inverse); min-width: 22px; justify-content: center; padding-inline: 7px; }
.chip--ph-new, .chip--ph-before, .chip--ph-after, .chip--ph-wait, .chip--ph-success, .chip--ph-neutral {
  background: var(--tone-fill); color: var(--mf-text); box-shadow: inset 0 0 0 1px var(--tone-border);
}
.chip[class*="chip--ph-"]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone-dot); flex: none; }
.chip--ph-new { --tone-fill: var(--ph-new-fill); --tone-border: var(--ph-new-border); --tone-dot: var(--ph-new-dot); }
.chip--ph-before { --tone-fill: var(--ph-before-fill); --tone-border: var(--ph-before-border); --tone-dot: var(--ph-before-dot); }
.chip--ph-after { --tone-fill: var(--ph-after-fill); --tone-border: var(--ph-after-border); --tone-dot: var(--ph-after-dot); }
.chip--ph-wait { --tone-fill: var(--ph-wait-fill); --tone-border: var(--ph-wait-border); --tone-dot: var(--ph-wait-dot); }
.chip--ph-success { --tone-fill: var(--ph-success-fill); --tone-border: var(--ph-success-border); --tone-dot: var(--ph-success-dot); }
.chip--ph-neutral { --tone-fill: var(--ph-neutral-fill); --tone-border: var(--ph-neutral-border); --tone-dot: var(--ph-neutral-dot); }

.chip-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; min-width: 36px; padding: 0 14px;
  border: 1px solid var(--mf-border-control); border-radius: 999px; background: var(--mf-surface);
  color: var(--mf-text); font-size: 16px; line-height: 24px;
}
.chip-btn::after { content: ""; position: absolute; inset: -4px -2px; }
.chip-btn:hover { background: var(--mf-surface-sunken); }
.chip-btn[aria-pressed="true"] { background: var(--mf-primary-tint); border-color: var(--mf-primary); color: var(--mf-primary-strong); font-weight: 600; }
.chip-btn--solid[aria-pressed="true"] { background: var(--mf-primary); border-color: var(--mf-primary); color: var(--mf-on-primary); }
.chip-btn .ico { width: 16px; height: 16px; }

.lock { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; line-height: 21px; font-weight: 400; color: var(--mf-text-muted); white-space: nowrap; }
.lock .ico { width: 16px; height: 16px; }

/* ---------- Card, banner, progress, step line, empty ---------- */
.card {
  display: block; min-width: 0; padding: 20px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius);
}
a.card, button.card { color: inherit; text-decoration: none; text-align: start; width: 100%; font: inherit; }
a.card:hover, button.card:hover { border-color: var(--mf-border-hover); color: inherit; }
a.card:active, button.card:active { background: var(--mf-surface-sunken); }
.card--stack { display: flex; flex-direction: column; gap: 16px; }

.banner { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: var(--radius); background: var(--mf-primary-tint); color: var(--mf-text); }
.banner .ico { width: 20px; height: 20px; margin-top: 2px; color: var(--mf-primary-strong); }
.banner--success { background: var(--mf-success-soft); } .banner--success .ico { color: var(--mf-success); }
.banner--warn { background: var(--mf-warning-soft); } .banner--warn .ico { color: var(--mf-warning); }
.banner--error { background: var(--mf-error-soft); } .banner--error .ico { color: var(--mf-error); }
.banner__body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.progress { position: relative; height: 4px; border-radius: 999px; background: var(--mf-surface-sunken); overflow: hidden; --p: 0; }
.progress::before {
  content: ""; position: absolute; inset-block: 0; inset-inline-start: 0;
  width: calc(var(--p) * 100%); background: var(--mf-primary); border-radius: inherit;
  transition: width var(--mf-dur-base) var(--mf-ease);
}

.step-line { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 16px; line-height: 24px; }
.step-line > .ico, .step-line > svg { color: var(--mf-highlight); width: 16px; height: 16px; flex: none; }
.step-line > p, .step-line > span:not(.ico) { margin: 0; flex: 1 1 auto; min-width: 0; }
.step-line--clamp > p, .step-line--clamp > span:not(.ico) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.sticky-actions {
  position: sticky; bottom: 0; z-index: var(--z-sticky);
  margin-top: auto; margin-inline: calc(-1 * var(--mf-gutter)); margin-bottom: calc(-1 * var(--screen-pad-bottom, 40px));
  padding: 12px var(--mf-gutter) 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle);
}
.sticky-actions > .btn--primary { flex: 1 1 auto; }

.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 24px 0; }
.empty__icon { width: 48px; height: 48px; border-radius: 50%; background: var(--mf-surface-sunken); color: var(--mf-text-muted); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.empty__icon .ico { width: 24px; height: 24px; }
.empty__title { font: 700 18px/27px var(--font-sans); }
.empty__text { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.empty__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--mf-border-subtle); }
.tabs > button, .tabs > a {
  position: relative; flex: none; min-height: 44px; padding: 0 16px; border: 0; background: transparent;
  color: var(--mf-text-muted); font-size: 16px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;
}
.tabs > [aria-selected="true"], .tabs > [aria-current="page"] { color: var(--mf-text); }
.tabs > [aria-selected="true"]::after, .tabs > [aria-current="page"]::after {
  content: ""; position: absolute; inset-inline: 8px; bottom: -1px; height: 2px; background: var(--mf-primary); border-radius: 2px;
}

/* ---------- Session circle track (App.track) ---------- */
.track { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; --track-link: 14px; }
.track--compact { --track-link: 10px; }
.track__item { display: flex; align-items: center; }
.track__btn {
  width: 44px; height: 44px; margin: -6px; padding: 0; border: 0; border-radius: 50%; background: transparent;
  display: flex; align-items: center; justify-content: center; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.track__link { flex: none; width: var(--track-link); height: 2px; }
.track__link--on { background: var(--mf-primary); }
.track__more {
  min-height: 44px; margin-inline-start: 8px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--mf-primary-strong); font-size: 14px; line-height: 21px; font-weight: 600;
}
.tc {
  width: 32px; height: 32px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tc--held { background: var(--mf-primary); color: var(--mf-on-primary); }
.tc--today { border: 2px solid var(--mf-primary); background: var(--mf-primary-tint); color: var(--mf-primary-strong); }
.tc--planned, .tc--unscheduled { border: 1.5px solid var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text-muted); font-weight: 600; }
.tc--cancelled { border: 1.5px dashed var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text-muted); font-weight: 600; text-decoration: line-through; }
.tc--range { width: auto; min-width: 32px; padding-inline: 0; border-radius: 16px; letter-spacing: -0.06em; direction: ltr; unicode-bidi: isolate; }
.tc--range-held { background: var(--mf-primary); color: var(--mf-on-primary); }
.tc--range-future { border: 1px dashed var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text-muted); }
@container app (max-width: 385px) { .track { --track-link: 8px; } }
.track__btn:hover .tc--planned, .track__btn:hover .tc--unscheduled, .track__btn:hover .tc--cancelled { background: var(--mf-surface-sunken); }

/* ==========================================================================
   Prototype chrome (outside the product), device frame
   ========================================================================== */
.proto { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--proto-bg); }
.proto__bar {
  flex: none; display: flex; align-items: center; gap: 12px; min-height: var(--proto-bar-h); padding: 6px 16px;
  background: var(--mf-surface); border-bottom: 1px solid var(--mf-border-subtle); font-size: 14px; line-height: 21px;
}
.proto__brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
.proto__side { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mf-text-muted); }
.proto__spacer { flex: 1 1 auto; }
.proto__btn {
  flex: none; min-height: 36px; padding: 0 14px; border: 1px solid var(--mf-border-control); border-radius: 999px;
  background: var(--mf-surface); color: var(--mf-text); font-size: 14px; font-weight: 600; white-space: nowrap;
}
.proto__btn:hover { background: var(--mf-surface-sunken); }
.proto__bar .seg > button { min-height: 28px; padding: 0 14px; font-size: 14px; }
.proto__bar .seg { padding: 3px; }
.proto__errors { flex: none; }
.proto__errors .proto__err {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px; background: var(--mf-error-soft); color: var(--mf-error-text);
  font-size: 14px; line-height: 21px; border-bottom: 1px solid var(--mf-error);
}
.proto__errors .proto__err button { margin-inline-start: auto; border: 0; background: transparent; color: inherit; font-weight: 700; min-height: 28px; padding: 0 8px; }
.proto__stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; padding: 24px; overflow: auto; }
.device {
  position: relative; flex: none; margin: auto; background: var(--mf-bg); overflow: hidden;
  width: 390px; height: max(560px, min(844px, calc(100vh - var(--proto-bar-h) - 96px)));
  height: max(560px, min(844px, calc(100dvh - var(--proto-bar-h) - 96px)));
  border-radius: 36px; box-shadow: 0 0 0 10px #26302A, 0 20px 50px rgb(38 48 42 / 0.28);
}
.proto[data-mode="desktop"] .proto__stage, .proto[data-mode="real"] .proto__stage { padding: 0; overflow: hidden; }
.proto[data-mode="desktop"] .device, .proto[data-mode="real"] .device {
  width: 100%; height: 100%; margin: 0; border-radius: 0; box-shadow: none;
}
.proto[data-mode="real"] .proto__bar { gap: 8px; padding-inline: 12px; }
.proto[data-mode="real"] .proto__brand, .proto[data-mode="real"] .proto__bar .seg { display: none; }
.proto[data-mode="real"] .proto__side { flex: 1 1 auto; }
.proto[data-mode="real"] .proto__spacer { display: none; }
.proto[data-mode="phone"] .app__scroll, .proto[data-mode="real"] .app__scroll { scrollbar-width: none; }
.proto[data-mode="phone"] .app__scroll::-webkit-scrollbar, .proto[data-mode="real"] .app__scroll::-webkit-scrollbar { display: none; }
@media (pointer: coarse) { .proto__btn { min-height: 44px; } .proto__bar .seg > button { min-height: 36px; } }

.screenmap {
  position: fixed; z-index: 100; top: var(--proto-bar-h); bottom: 0; inset-inline-end: 0; width: 380px; max-width: 100%;
  display: flex; flex-direction: column; background: var(--mf-surface); border-inline-start: 1px solid var(--mf-border-subtle);
  box-shadow: var(--mf-shadow-overlay);
}
.screenmap__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 20px; padding-inline: 20px 8px; border-bottom: 1px solid var(--mf-border-subtle); }
.screenmap__body { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px 24px; }
.screenmap__group { margin: 16px 0 4px; padding-inline: 8px; font-size: 14px; line-height: 21px; font-weight: 700; color: var(--mf-text-muted); }
.screenmap__item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 6px 8px;
  border: 0; border-radius: var(--radius-sm); background: transparent; text-align: start; font-size: 16px; line-height: 24px;
}
.screenmap__item:hover { background: var(--mf-surface-sunken); }
.screenmap__item[aria-current="true"] { background: var(--mf-primary-tint); font-weight: 700; color: var(--mf-primary-strong); }
.screenmap__meta { flex: none; font-size: 14px; color: var(--mf-text-muted); font-weight: 400; }
.proto-fatal { margin: auto; max-width: 520px; padding: 24px; background: var(--mf-error-soft); color: var(--mf-error-text); border-radius: var(--radius); }

/* ==========================================================================
   App container (container-type: inline-size; name: app)
   ========================================================================== */
.app {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  container-type: inline-size; container-name: app;
  background: var(--mf-bg); color: var(--mf-text);
}
.app__shell { display: flex; flex-direction: column; height: 100%; }
.app__scroll {
  flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  scroll-padding-bottom: 96px; container: main / inline-size; order: 1;
}
.app__main { min-height: 100%; display: flex; flex-direction: column; outline: none; }
.app__main:focus { outline: none; }

/* Bottom navigation (narrow) */
.nav {
  order: 2; flex: none; display: flex; align-items: stretch; z-index: 20;
  background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
.app[data-nav=""] .nav { display: none; }
.nav__brand { display: none; }
.nav__item {
  position: relative; flex: 1 1 0; min-width: 0; min-height: 54px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--mf-text-muted); text-decoration: none; font-size: 14px; line-height: 20px; font-weight: 400; border-radius: var(--radius);
}
.nav__item:hover { color: var(--mf-text); }
.nav__ico { width: 56px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.nav__ico .ico { width: 24px; height: 24px; }
.nav__item[aria-current="page"] { color: var(--mf-primary-strong); font-weight: 700; }
.nav__item[aria-current="page"] .nav__ico { background: var(--mf-primary-tint); }
/* L1: phone: the badge starts 14px past the item's centre, i.e. just beyond the 24px glyph (12px each side), so the icon stays whole */
.nav__badge {
  position: absolute; top: 0; inset-inline-start: calc(50% + 14px);
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  background: var(--mf-surface-inverse); color: var(--mf-text-on-inverse); font-size: 14px; line-height: 20px; font-weight: 600;
}

/* Web layout: text rail at inline-start (right in RTL) */
@container app (min-width: 900px) {
  .app__shell { flex-direction: row; }
  .nav {
    order: 0; flex-direction: column; align-items: stretch; width: var(--mf-rail-w); gap: 4px; overflow-y: auto;
    padding: 28px 16px; border-top: 0; border-inline-end: 1px solid var(--mf-border-subtle);
  }
  .nav__brand { display: block; margin: 0 8px 28px; font: 500 26px/1.3 var(--font-display); font-synthesis: none; }
  .nav__item {
    flex: none; flex-direction: row; align-items: center; min-height: 44px; padding: 0 14px; gap: 12px;
    color: var(--mf-text); font-size: 16px; line-height: 24px;
  }
  .nav__item:hover { background: var(--mf-surface-sunken); }
  .nav__item[aria-current="page"] { background: var(--mf-primary-tint); }
  .nav__ico { display: none; }
  .nav__label { flex: 1 1 auto; }
  .nav__badge { position: static; margin-inline-start: auto; }
  /* navWide: a screen with nav:null but navWide:'x' keeps the rail (item x active) on the wide layout only */
  .app[data-nav=""][data-nav-wide] .nav { display: flex; }

  .screen { --screen-gap: 56px; --screen-pad-bottom: 64px; padding: 48px 40px var(--screen-pad-bottom); max-width: calc(var(--mf-list-max) + 80px); }
  .screen--reading { max-width: calc(var(--mf-reading-max) + 80px); }
  .screen--wide { max-width: calc(var(--mf-wide-max) + 80px); }
  .screen--full { max-width: none; }
  .screen--wizard { --screen-gap: 32px; padding-top: 48px; }
  .screen--bleed { padding: 0; max-width: none; }
  /* M8: wide: a bar across the whole content column (right of the rail): it breaks out of the centred .screen to the
     width of the scroll area (100cqw = .app__scroll), and the padding puts its content back on the screen's own column.
     margin and padding are both percentages of the .screen content box, so they always add up to the screen edge. */
  .sticky-actions { margin-inline: calc(50% - 50cqw); padding-inline: max(40px, calc(50cqw - 50%)); }
  .btn { min-height: 44px; }
  .btn--primary { min-height: 52px; }
}

/* ---------- Sheets, drawers, dialogs, popovers ---------- */
.sheet-layer { position: absolute; inset: 0; z-index: var(--z-dialog); display: none; pointer-events: none; }
.sheet-layer[data-open] { display: flex; }
.sheet-layer[data-kind="bottom"] { align-items: flex-end; justify-content: center; }
.sheet-layer[data-kind="dialog"] { align-items: center; justify-content: center; padding: 24px; }
.sheet-layer[data-kind="drawer"] { align-items: stretch; justify-content: flex-end; }
.sheet-layer[data-kind="popover"] { display: block; }
.sheet-scrim { position: absolute; inset: 0; background: var(--mf-scrim); pointer-events: auto; animation: mf-fade var(--mf-dur-base) var(--mf-ease) both; }
.sheet-layer[data-kind="popover"] .sheet-scrim { background: transparent; }
.sheet {
  position: relative; display: flex; flex-direction: column; min-height: 0; pointer-events: auto;
  background: var(--mf-surface); box-shadow: var(--mf-shadow-overlay); color: var(--mf-text); outline: none;
}
.sheet:focus, .sheet:focus-visible { outline: none; } /* L8: a sheet takes focus itself when it opens: no ring on the container */
.sheet--bottom { width: 100%; max-height: 92%; border-radius: var(--radius-lg) var(--radius-lg) 0 0; animation: mf-sheet-up var(--mf-dur-slow) var(--mf-ease) both; }
.sheet--dialog { width: min(560px, 100%); max-height: min(100%, 760px); border-radius: var(--radius); animation: mf-pop var(--mf-dur-base) var(--mf-ease) both; }
.sheet--drawer {
  width: min(var(--mf-drawer-w), 100%); height: 100%; border-radius: 0; border-inline-start: 1px solid var(--mf-border-subtle);
  animation: mf-drawer-in 240ms var(--mf-ease) both;
}
.sheet--popover {
  position: absolute; width: min(400px, calc(100% - 24px)); max-height: calc(100% - 24px);
  border-radius: var(--radius); border: 1px solid var(--mf-border-subtle); animation: mf-pop 160ms var(--mf-ease) both;
}
.sheet__x { position: absolute; top: 8px; inset-inline-end: 8px; z-index: 1; }
.sheet__grab { flex: none; width: 36px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--mf-border-control); }
.sheet--dialog .sheet__grab, .sheet--drawer .sheet__grab, .sheet--popover .sheet__grab { display: none; }
.sheet__head { flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 20px 8px; }
.sheet__title { font: 700 18px/27px var(--font-sans); min-width: 0; }
.sheet__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.sheet__body > .sheet__foot:last-child { margin-bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); }
.sheet__body { scroll-padding-block-end: 112px; }
.sheet--notitle .sheet__body { padding-top: 48px; }
.sheet__foot {
  position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); margin: 0 -20px; padding: 12px 20px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle);
}
.sheet__foot > .btn--primary { flex: 1 1 auto; }
.sheet--dialog .sheet__head, .sheet--popover .sheet__head { height: 64px; padding-inline: 24px 12px; }
.sheet--dialog .sheet__body { padding-inline: 24px; }
.sheet--dialog .sheet__foot { margin-inline: -24px; padding-inline: 24px; }

@keyframes mf-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mf-sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes mf-pop { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes mf-drawer-in { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
[dir="ltr"] .sheet--drawer { animation-name: mf-drawer-in-ltr; }
@keyframes mf-drawer-in-ltr { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .sheet--bottom, .sheet--drawer, .sheet--dialog, .sheet--popover { animation-name: mf-fade; }
}

/* ---------- Toasts ---------- */
.toast-layer {
  position: absolute; z-index: var(--z-toast); inset-inline: 16px;
  bottom: calc(16px + var(--toast-lift, 0px)); display: flex; flex-direction: column; align-items: stretch; pointer-events: none;
}
.app:not([data-nav=""]) .toast-layer { bottom: calc(var(--mf-bottom-nav-h) + 16px + env(safe-area-inset-bottom, 0px) + var(--toast-lift, 0px)); }
.app[data-sheet-open="bottom"] .toast-layer { bottom: calc(16px + var(--toast-lift, 0px)); }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius);
  background: var(--mf-surface-inverse); color: var(--mf-text-on-inverse); box-shadow: var(--mf-shadow-overlay);
  font-size: 16px; line-height: 24px; pointer-events: auto; animation: mf-toast-in var(--mf-dur-base) var(--mf-ease) both;
}
.toast.is-leaving { animation: mf-toast-out 160ms var(--mf-ease-exit) both; }
.toast .ico { width: 20px; height: 20px; color: var(--mf-primary-on-inverse); }
.toast--error .ico { color: var(--mf-error-on-inverse); }
@keyframes mf-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes mf-toast-out { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  @keyframes mf-toast-in { from { opacity: 0; } to { opacity: 1; } }
}
@container app (min-width: 900px) {
  .toast-layer, .app:not([data-nav=""]) .toast-layer { inset-inline: auto 24px; bottom: calc(24px + var(--toast-lift, 0px)); width: min(420px, calc(100% - 48px)); }
}

/* ---------- Error and placeholder panels (inside a screen) ---------- */
.mf-panel { margin: 28px var(--mf-gutter); padding: 20px; border-radius: var(--radius); background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.mf-panel--error { background: var(--mf-error-soft); border-color: var(--mf-error); color: var(--mf-error-text); }
.mf-panel pre { margin: 0; max-width: 100%; overflow: auto; direction: ltr; text-align: left; font: 14px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-word; }

/* ---- 10-entry.css ---- */
/* ==========================================================================
   10-entry.css · group 1: login, onboarding, settings, contractSetup
   Scoped under .screen--login / --onboarding / --settings / --contractSetup.
   Sizes 14 / 16 / 18 / 28 (serif 26-28). Web layout = @container app (min-width: 900px).
   ========================================================================== */

/* ---------- login ---------- */
.screen.screen--login { padding: 0; gap: 0; max-width: none; background: var(--mf-bg); }
.screen--login .lg-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 32px 24px 0; }
.screen--login .lg-brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.screen--login .lg-logo { font: 500 26px/34px var(--font-display); font-synthesis: none; }
.screen--login .lg-tag { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.screen--login .lg-about { display: none; }
.screen--login .lg-top--code { height: 56px; padding: 8px 8px 0; justify-content: flex-start; }
.screen--login .lg-top--code .lg-brand { display: none; }
.screen--login .lg-back-web { display: none; }

.screen--login .lg-main { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px 16px; }
.screen--login .lg-col { display: flex; flex-direction: column; gap: 28px; width: 100%; min-width: 0; }
.screen--login .lg-card { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.screen--login h1:focus-visible { outline: none; }
.screen--login .lg-fields { display: flex; flex-direction: column; gap: 24px; }
.screen--login .lg-google { border-color: var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text); gap: 12px; }
.screen--login .lg-google:hover { background: var(--mf-surface-sunken); color: var(--mf-text); }
.screen--login .lg-g { width: 20px; height: 20px; flex: none; }
.screen--login .field__hint, .screen--login .field__error { text-wrap: pretty; }
.screen--login .lg-or { display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--login .lg-or::before, .screen--login .lg-or::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--mf-border-subtle); }

.screen--login .lg-first { border-top: 1px solid var(--mf-border-subtle); padding-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.screen--login .lg-first h2 { font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted); }
.screen--login .lg-first ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

.screen--login .lg-legal { padding: 8px 24px 16px; display: flex; flex-direction: column; align-items: flex-start; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--login .lg-legal a { color: var(--mf-text-muted); }
/* the two inline links keep their look but get a 47px-tall hit box: padding adds the height upward (the accessibility link sits right below), the negative margin gives it back to the line */
.screen--login .lg-legal p a { display: inline-block; padding-block: 26px 0; margin-block: -26px 0; }
.screen--login .lg-a11y { display: inline-flex; align-items: center; min-height: 44px; }

/* code step */
.screen--login .lg-main--code { justify-content: flex-start; padding: 24px 24px 0; }
.screen--login .lg-main--code .lg-col { flex: 1 1 auto; }
.screen--login .lg-main--code .lg-card { flex: 1 1 auto; gap: 0; }
.screen--login .lg-sub { margin-top: 8px; font-size: 16px; line-height: 24px; color: var(--mf-text-muted); overflow-wrap: anywhere; }
.screen--login .lg-email { font-weight: 600; color: var(--mf-text); }
.screen--login .lg-code { position: relative; margin-top: 32px; }
.screen--login .lg-code__input {
  position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; padding: 0;
  border: 0; background: transparent; opacity: 0; font-size: 16px; cursor: text;
}
.screen--login .lg-boxes { display: flex; gap: 8px; direction: ltr; }
.screen--login .lg-box {
  flex: 1 1 0; min-width: 0; height: 64px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--mf-border-control); border-radius: var(--radius); background: var(--mf-surface);
  font: 600 28px/1 var(--font-sans); font-variant-numeric: tabular-nums;
}
.screen--login .lg-box.is-active { border: 2px solid var(--mf-primary); }
.screen--login .lg-code:focus-within .lg-box.is-active::after {
  content: ""; width: 2px; height: 30px; background: var(--mf-text); animation: lg-blink 1s steps(1) infinite;
}
.screen--login .lg-code:has(:focus-visible) .lg-box.is-active { outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; }
@keyframes lg-blink { 50% { opacity: 0; } }
.screen--login .lg-help, .screen--login .lg-alt { margin-top: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--login .lg-cd { font-variant-numeric: tabular-nums; }
.screen--login .lg-link {
  min-height: 44px; padding: 0 4px; margin-inline: -4px; border: 0; background: transparent;
  color: var(--mf-primary-strong); font: 600 16px/24px var(--font-sans); text-decoration: underline; text-underline-offset: 3px;
}
.screen--login .lg-bar {
  margin: auto -24px 0; padding: 12px 20px 24px; background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle);
}

@container app (min-width: 900px) {
  .screen--login .lg-top { padding: 28px 40px; }
  .screen--login .lg-tag { display: none; }
  .screen--login .lg-about {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--mf-primary-strong); font: 600 16px/24px var(--font-sans);
  }
  .screen--login .lg-top--code { height: auto; padding: 28px 40px; justify-content: space-between; }
  .screen--login .lg-top--code .lg-brand { display: flex; }
  .screen--login .lg-back-m { display: none; }
  .screen--login .lg-back-web { display: inline-flex; margin: -16px 0 8px; margin-inline-start: -12px; align-self: flex-start; }
  .screen--login .lg-main, .screen--login .lg-main--code { align-items: center; justify-content: center; padding: 24px 20px 48px; }
  .screen--login .lg-col, .screen--login .lg-main--code .lg-col { flex: 0 1 auto; max-width: 440px; }
  .screen--login .lg-card, .screen--login .lg-main--code .lg-card {
    flex: 0 1 auto; background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); padding: 40px 32px;
  }
  .screen--login .lg-main--code .lg-card { gap: 0; }
  .screen--login .lg-first { border-top: 0; padding: 0 32px; }
  .screen--login .lg-bar { margin: 32px 0 0; padding: 0; background: none; border-top: 0; }
  .screen--login .lg-legal { align-items: center; text-align: center; padding: 16px 20px 32px; }
}

.screen--onboarding .ob-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.screen--onboarding .ob-brand { font: 500 26px/34px var(--font-display); font-synthesis: none; text-align: center; }

.screen--onboarding .ob-h:focus-visible { outline: none; }
.screen--onboarding .ob-fields { display: flex; flex-direction: column; gap: 24px; }
/* .sticky-actions is also on the foot so the shell lifts toasts above it; its margins are reset here */
.screen--onboarding .ob-foot {
  position: sticky; bottom: 0; z-index: var(--z-sticky); margin: auto 0 0; padding: 12px 20px 20px;
  display: flex; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 4px;
  background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle);
}
.screen--onboarding .ob-back { display: none; }
.screen--onboarding .ob-preview { display: none; }

.screen--onboarding .ob-grp { display: flex; flex-direction: column; gap: 8px; }
.screen--onboarding .ob-url {

  border: 1px solid var(--mf-border-control); border-radius: var(--radius); cursor: text;
}
.screen--onboarding .ob-url:focus-within { border-color: var(--mf-primary); outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; }
.screen--onboarding .ob-url__pre { flex: none; font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.screen--onboarding .ob-url input {
  flex: 0 1 auto; min-width: 4ch; max-width: 100%; min-height: 46px; padding: 0; border: 0; background: transparent; color: var(--mf-text);
  font-size: 16px; line-height: 24px; text-align: left; field-sizing: content;
}
.screen--onboarding .ob-url input:focus-visible { outline: none; }

/* ready */
.screen--onboarding .ob-ready { gap: 24px; }
.screen--onboarding .ob-ok {
  width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--mf-primary-tint); color: var(--mf-primary-strong);
}
.screen--onboarding .ob-readyhead { display: flex; flex-direction: column; gap: 8px; margin-top: -8px; }
.screen--onboarding .ob-sub { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.screen--onboarding .ob-urlrow {
  display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 8px; padding-inline: 16px 8px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius);
}
.screen--onboarding .ob-urlrow__t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; font-size: 16px; line-height: 24px; }
.screen--onboarding .ob-nx .row { min-height: 64px; }

/* shared icon bubble inside rows (ready screen, contract file rows) */
:is(.screen--onboarding, .screen--contractSetup) .row__ico {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--mf-primary-tint); color: var(--mf-primary-strong);
}

/* design step (photo, background, accent) */
.screen--onboarding .ob-design { display: flex; flex-direction: column; gap: 24px; }
.screen--onboarding .ob-lbl { font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--onboarding .ob-photo { display: flex; align-items: center; gap: 20px; }
.screen--onboarding .ob-avatar {
  width: 96px; height: 96px; flex: none; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--mf-surface-sunken) center / cover no-repeat; color: var(--mf-text-muted);
}
.screen--onboarding .ob-avatar--empty { border: 1.5px dashed var(--mf-border-control); }
.screen--onboarding .ob-avatar--img { border: 2px solid var(--mf-surface); box-shadow: 0 0 0 1px var(--mf-border-subtle); }
.screen--onboarding .ob-photo__act { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex: 1 1 auto; }
.screen--onboarding .ob-photo__btns { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.screen--onboarding .ob-pick { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.screen--onboarding .ob-pick__grid { width: 100%; display: grid; gap: 8px; }
.screen--onboarding .ob-pick--photo .ob-pick__grid { grid-template-columns: repeat(3, 56px); }
.screen--onboarding .ob-pick--cover .ob-pick__grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.screen--onboarding .ob-pick .btn { margin-inline-start: -16px; }
.screen--onboarding .ob-th {
  width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: var(--mf-surface-sunken) center / cover no-repeat; box-shadow: 0 0 0 1px var(--mf-border-subtle);
}
.screen--onboarding .ob-th--cover { width: 100%; height: auto; min-height: 44px; aspect-ratio: 16 / 9; border-radius: 8px; }
.screen--onboarding .ob-th:hover { box-shadow: 0 0 0 2px var(--mf-border-control); }
.screen--onboarding .ob-drop {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 0 16px;
  border: 1.5px dashed var(--mf-border-control); border-radius: var(--radius); background: var(--mf-surface-sunken); cursor: pointer;

}

.screen--onboarding .ob-cover { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.screen--onboarding .ob-cover__th { flex: none; width: 112px; height: 63px; border-radius: 8px; background: var(--mf-surface-sunken) center / cover no-repeat; box-shadow: 0 0 0 1px var(--mf-border-subtle); }

.screen--onboarding .ob-sws { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; padding-top: 4px; }
.screen--onboarding .ob-sw {

  font-size: 14px; line-height: 21px; color: var(--mf-text-muted); text-align: center;
}
.screen--onboarding .ob-sw__dot {

  display: flex; align-items: center; justify-content: center;
}
.screen--onboarding .ob-sw__dot .ico { display: none; }
.screen--onboarding .ob-sw:has(input:checked) { font-weight: 600; color: var(--mf-text); }
.screen--onboarding .ob-sw:has(input:checked) .ob-sw__dot { outline: 2px solid var(--mf-primary-strong); outline-offset: 2px; }
.screen--onboarding .ob-sw:has(input:checked) .ob-sw__dot .ico { display: block; }
.screen--onboarding .ob-sw:has(input:focus-visible) .ob-sw__dot { outline: 2px solid var(--mf-focus-ring); outline-offset: 2px; box-shadow: 0 0 0 5px var(--mf-surface); }
.screen--onboarding .ob-sw:hover .ob-sw__dot { filter: brightness(1.08); }

/* the head of the public page, shown in the phone wizard only */
.screen--onboarding .ob-mini { display: flex; flex-direction: column; gap: 8px; }
.screen--onboarding .ob-mini__lbl { font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted); }
.screen--onboarding .ob-mini__card { margin: 0; overflow: hidden; border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); background: var(--mf-bg); }
.screen--onboarding .ob-mini__act { padding: 12px 16px 16px; }
.screen--onboarding .ob-mini .pv__cover { padding: 16px; gap: 12px; border-radius: 0; }
.screen--onboarding .ob-mini .pv__cover--img { min-height: 132px; }
.screen--onboarding .ob-mini .pv__avatar { width: 56px; height: 56px; font-size: 16px; }
.screen--onboarding .ob-mini .pv__title { display: none; }
.screen--onboarding .ob-mini .pv__send { height: 44px; }

/* live preview (web only) */
.screen--onboarding .pv { width: 100%; max-width: 760px; background: var(--mf-bg); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); overflow: hidden; }
.screen--onboarding .pv__bar { height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 16px; background: var(--mf-surface); border-bottom: 1px solid var(--mf-border-subtle); }
.screen--onboarding .pv__url {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 14px; border-radius: 999px;
  background: var(--mf-surface-sunken); color: var(--mf-text-muted); font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden;
}
.screen--onboarding .pv__url > span { overflow: hidden; text-overflow: ellipsis; }
.screen--onboarding .pv__page { padding: 32px 24px 48px; }
.screen--onboarding .pv__in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.screen--onboarding .pv__cover { position: relative; display: flex; align-items: center; gap: 16px; padding: 24px; border-radius: var(--radius); background: var(--coach-soft) center / cover no-repeat; overflow: hidden; }
.screen--onboarding .pv__cover--img { align-items: flex-end; min-height: 224px; }
.screen--onboarding .pv__cover--img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(26 33 29 / 0.72) 0%, rgb(26 33 29 / 0.5) 45%, rgb(26 33 29 / 0.12) 100%); }
.screen--onboarding .pv__cover > * { position: relative; }
.screen--onboarding .pv__cover--img :is(.pv__name, .pv__title) { color: var(--mf-surface); }
.screen--onboarding .pv__avatar {
  width: 72px; height: 72px; flex: none; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--mf-surface); background: var(--mf-surface) center / cover no-repeat;
  color: var(--coach-strong); font: 700 18px/1 var(--font-sans); display: flex; align-items: center; justify-content: center;
}
.screen--onboarding .pv__avatar--img { box-shadow: 0 0 0 1px var(--mf-border-subtle); }
.screen--onboarding .pv__who { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.screen--onboarding .pv__name { font: 500 28px/38px var(--font-display); font-synthesis: none; overflow-wrap: anywhere; }
.screen--onboarding .pv__title { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); overflow-wrap: anywhere; }
.screen--onboarding .pv__title:empty, .screen--onboarding .pv__intro:empty { display: none; }
.screen--onboarding .pv__chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--mf-surface); color: var(--mf-text);
  font: 600 14px/20px var(--font-sans);
}
.screen--onboarding .pv__chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coach); }
.screen--onboarding .pv__intro { font-size: 18px; line-height: 31px; white-space: pre-line; overflow-wrap: anywhere; }
.screen--onboarding .pv__form { display: flex; flex-direction: column; gap: 20px; padding: 24px; background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); }
.screen--onboarding .pv__ftitle { font: 700 18px/27px var(--font-sans); }
.screen--onboarding .pv__f { display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--onboarding .pv__box { display: block; height: 48px; border: 1px solid var(--mf-border-control); border-radius: var(--radius); background: var(--mf-surface); }
.screen--onboarding .pv__box--tall { height: 88px; }
.screen--onboarding .pv__send { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: var(--radius); background: var(--coach); color: var(--coach-on); font-size: 16px; font-weight: 600; }

@container app (min-width: 900px) {
  .screen.screen--onboarding { display: grid; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); align-items: stretch; }
  .screen--onboarding .ob-panel { padding: 20px 32px 32px; background: var(--mf-surface); border-inline-end: 1px solid var(--mf-border-subtle); }
  .screen--onboarding .ob-top { background: none; border: 0; }
  .screen--onboarding .ob-head { height: auto; padding: 0; margin-bottom: 20px; }
  .screen--onboarding .ob-brand { text-align: start; }
  .screen--onboarding .ob-back-ico, .screen--onboarding .ob-spacer { display: none; }
  .screen--onboarding .ob-x { margin-inline-end: -12px; }
  .screen--onboarding .ob-prog { margin: 0; }
  .screen--onboarding .ob-step { padding: 32px 0 40px; }
  .screen--onboarding .ob-foot {
    position: static; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 24px 0 0; background: none;
  }
  .screen--onboarding .ob-foot .btn { width: auto; display: inline-flex; }

  .screen--onboarding .ob-mini { display: none; }
  /* the preview never sets the screen height: it fills its own column, so the form's buttons stay in view */
  .screen--onboarding .ob-preview { display: block; position: relative; overflow: hidden; background: var(--mf-surface-sunken); min-width: 0; }
  .screen--onboarding .ob-pvin { position: absolute; inset: 24px 40px 40px; display: flex; flex-direction: column; gap: 20px; }

  }

  .screen--onboarding .ob-live { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
  .screen--onboarding .pv { flex: 1 1 auto; min-height: 0; max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; }
  .screen--onboarding .ob-preview[data-device="phone"] .pv { max-width: 390px; }
  .screen--onboarding .ob-preview[data-device="phone"] .pv__page { padding: 24px 16px 40px; }
  .screen--onboarding .pv__page { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .screen--onboarding[data-ready] { grid-template-columns: minmax(0, 1fr); }
  .screen--onboarding[data-ready] .ob-panel { width: 100%; max-width: 584px; margin-inline: auto; background: none; border: 0; }

/* ---- 20-intake.css ---- */
/* ==========================================================================
   20-intake.css: public inquiry page, thanks page, leads board (+ its sheets).
   Scoped under .screen--public / .screen--thanks / .screen--leads and the
   .sheet--leads* / .sheet--leadMenu classes. Web layout = @container app (min-width: 900px).
   Type sizes 14 / 16 / 18 / 28 only.
   ========================================================================== */

/* ---------- phase tones (shared by cards, columns, dots, sheet rows) ---------- */
.lph--new     { --c-fill: var(--ph-new-fill);     --c-bd: var(--ph-new-border);     --c-dot: var(--ph-new-dot); }
.lph--before  { --c-fill: var(--ph-before-fill);  --c-bd: var(--ph-before-border);  --c-dot: var(--ph-before-dot); }
.lph--after   { --c-fill: var(--ph-after-fill);   --c-bd: var(--ph-after-border);   --c-dot: var(--ph-after-dot); }
.lph--wait    { --c-fill: var(--ph-wait-fill);    --c-bd: var(--ph-wait-border);    --c-dot: var(--ph-wait-dot); }
.lph--success { --c-fill: var(--ph-success-fill); --c-bd: var(--ph-success-border); --c-dot: var(--ph-success-dot); }
.lph--neutral { --c-fill: var(--ph-neutral-fill); --c-bd: var(--ph-neutral-border); --c-dot: var(--ph-neutral-dot); }
.ldot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c-dot, var(--mf-text-muted)); }

/* privacy blur (names and answer text) */
.screen--leads .is-blur, .sheet--leadsTriage .is-blur, .sheet--leadsClosed .is-blur, .sheet--leadMenu .is-blur {
  filter: blur(6px); -webkit-user-select: none; user-select: none;
}
.screen--leads :is(span, bdi).is-blur, .sheet--leadsTriage :is(span, bdi).is-blur, .sheet--leadsClosed :is(span, bdi).is-blur {
  display: inline-block; max-width: 100%;
}

/* options row (chips) used by the public form and the manual-lead sheet */
.pub-opts { display: flex; flex-wrap: wrap; gap: 8px; }

/* quiet underlined footer buttons (public + thanks) */
.pub-foot__btn {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--mf-text-muted); font-size: 14px; line-height: 21px; text-decoration: underline; text-underline-offset: 3px;
}
.pub-foot__btn:hover { color: var(--mf-text); }

/* ==========================================================================
   PUBLIC: the inquiry page
   ========================================================================== */
.screen--public { background: var(--mf-bg); }
.screen--public .pub-hero {
  flex: none; height: 150px; box-sizing: border-box; padding: 10px 14px;
  background: #8FA596; background: color-mix(in srgb, var(--coach) 60%, var(--mf-bg));
  display: flex; align-items: flex-end; justify-content: flex-end;
}
.screen--public .pub-hero__label { font-size: 14px; line-height: 21px; color: var(--mf-surface); }
.screen--public .pub-wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 0 24px 40px; display: flex; flex-direction: column; }
.screen--public .pub-avatar {
  align-self: flex-start; flex: none; width: 84px; height: 84px; margin-top: -42px; border-radius: 50%;
  border: 4px solid var(--mf-bg); background: var(--coach-soft); color: var(--coach-strong);
  font: 700 28px/1 var(--font-sans); display: flex; align-items: center; justify-content: center;
}
.screen--public .pub-name { margin-top: 14px; }

.screen--public .pub-intro { margin-top: 18px; font-size: 16px; line-height: 27px; }
.screen--public .pub-form { margin-top: 32px; display: flex; flex-direction: column; gap: 24px; }
.screen--public .field__label { font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--public .field textarea { min-height: 136px; }

/* accent-aware controls */
.screen--public .chip-btn { min-height: 44px; padding: 0 18px; }
.screen--public .chip-btn[aria-pressed="true"] { background: var(--coach); border-color: var(--coach); color: var(--coach-on); }
.screen--public .chip-btn[aria-pressed="true"]:hover { background: var(--coach-hover); }
.screen--public .btn--primary { background: var(--coach); color: var(--coach-on); }

.screen--public .check input:checked { background-color: var(--coach); border-color: var(--coach); }

.screen--public a { color: var(--coach-strong); }

.screen--public .pub-legal { display: flex; flex-direction: column; gap: 2px; }

.screen--public .pub-legal__err { margin: -2px 0 6px; padding-inline-start: 32px; }
.screen--public .pub-foot { margin-top: 24px; text-align: center; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

@container app (min-width: 900px) {
  .screen--public .pub-hero { width: min(640px, calc(100% - 48px)); height: 200px; margin: 32px auto 0; border-radius: var(--radius); }
  .screen--public .pub-wrap { max-width: 640px; padding-bottom: 64px; }
}

/* ==========================================================================

   ========================================================================== */
.screen--thanks { background: var(--mf-bg); }
.screen--thanks .th-head { flex: none; background: var(--mf-surface); border-bottom: 1px solid var(--mf-border-subtle); padding: 12px var(--mf-gutter); }

  font: 700 16px/1 var(--font-sans); display: flex; align-items: center; justify-content: center;
}
.screen--thanks .th-head__text { min-width: 0; }
.screen--thanks .th-head__name { font-size: 16px; line-height: 24px; font-weight: 700; }

  border: 1.5px solid var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text-muted);
  font-size: 14px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums;
}
.screen--thanks .th-step--done .th-step__dot { background: var(--coach); border-color: var(--coach); color: var(--coach-on); }

.screen--thanks .th-step__line { flex: 1 1 auto; width: 2px; min-height: 24px; margin-block: 4px; background: var(--mf-border-hover); }

.screen--thanks .th-step__text { min-width: 0; padding-top: 2px; padding-bottom: 24px; }

.screen--thanks .th-step__title { font-size: 18px; line-height: 27px; font-weight: 600; }
.screen--thanks .th-step__sub { margin-top: 2px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); font-variant-numeric: tabular-nums; }

.screen--thanks .th-foot__nav { display: flex; flex-wrap: wrap; align-items: center; column-gap: 4px; color: var(--mf-text-muted); font-size: 14px; }
.screen--thanks .th-foot__row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 16px; }
.screen--thanks .th-coachlink {

  color: var(--mf-text-muted); font-size: 14px; line-height: 21px; text-decoration: underline; text-underline-offset: 3px;
}

@container app (min-width: 900px) {

  .screen--thanks .th-step { flex-direction: column; gap: 12px; }

.screen--leads .lc__dl dd { margin: 0; font-size: 16px; line-height: 24px; color: var(--mf-text); overflow-wrap: anywhere; }

.screen--leads .lcol .lc__acts { gap: 0; }
.screen--leads .lcol .lc__acts .btn { padding-inline: 8px; }
.screen--leads .lc__pen { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--leads .lc__pen .ico { margin-top: 2px; }
.screen--leads .lc__pen-t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen--leads .lc__status { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text); font-variant-numeric: tabular-nums; }
.screen--leads .lc__status .ico { color: var(--mf-text-muted); }

/* web: four phase columns */
@container app (min-width: 900px) {
  .screen--leads .lphone { display: none; }
  .screen--leads .lh__closed { display: flex; align-items: center; gap: 8px; margin-inline-end: 8px; }

  .screen--leads .lcol .lc__ib--more { margin-inline-end: -12px; }
}
@container main (min-width: 960px) {
  .screen--leads .lb--web { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* ==========================================================================
   LEADS: sheets
   ========================================================================== */
.lmenu { display: flex; flex-direction: column; gap: 8px; }
.lmenu__h { font: 700 14px/21px var(--font-sans); color: var(--mf-text-muted); }
.lmenu .rows--flat .row { min-height: 44px; padding-block: 6px; padding-inline: 0 4px; }
.lmenu__ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; color: var(--mf-text-muted); }

.lmenu__cur .row__title { font-weight: 700; }

.sheet--leadsClosed .lclist { margin: 0; }
.sheet--leadsClosed .lclist__row { display: flex; align-items: center; padding-inline-end: 4px; }
.sheet--leadsClosed .lclist__row .row { flex: 1 1 auto; min-width: 0; }

.sheet--leadsTriage .tri__count { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--leadsTriage .tri {

}
.sheet--leadsTriage .tri__top { display: flex; align-items: flex-start; gap: 8px; }
.sheet--leadsTriage .tri__id { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sheet--leadsTriage .tri__name { font: 600 18px/27px var(--font-sans); }
.sheet--leadsTriage .lc__meta { margin-top: 0; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--leadsTriage .lc__ret { margin-top: 4px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--leadsTriage .tri__top .icon-btn { margin: -8px -10px 0 0; margin-inline: 0 -10px; color: var(--mf-text-muted); }
.sheet--leadsTriage .tri__dl { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.sheet--leadsTriage .tri__dl dt { font-size: 14px; line-height: 21px; font-weight: 600; color: var(--mf-text-muted); }
.sheet--leadsTriage .tri__dl dd { margin: 0; font-size: 16px; line-height: 24px; color: var(--mf-text); overflow-wrap: anywhere; }
.sheet--leadsTriage .tri__full { align-self: flex-start; }
.sheet--leadsTriage .tri__done { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 24px 0 8px; }
.sheet--leadsTriage .tri__done-ic {
  width: 48px; height: 48px; margin-bottom: 8px; border-radius: 50%; background: var(--mf-success-soft); color: var(--mf-success-text);
  display: flex; align-items: center; justify-content: center;
}
.sheet--leadsTriage .tri__undo {
  display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; padding-inline: 16px 4px; border-radius: var(--radius);
  background: var(--mf-surface-inverse); color: var(--mf-text-on-inverse); font-size: 16px; line-height: 24px;
}
.sheet--leadsTriage .tri__undo .ico { flex: none; color: var(--mf-primary-on-inverse); }
.sheet--leadsTriage .tri__undo p { flex: 1 1 auto; min-width: 0; }
.sheet--leadsTriage .tri__undo-btn {
  flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--radius); background: transparent;
  color: var(--mf-primary-on-inverse); font-size: 16px; font-weight: 600;
}
.sheet--leadsTriage .tri__undo-btn:hover { background: rgb(252 251 248 / 0.1); }
.sheet--leadsTriage .tri__undo-btn:focus-visible { outline-color: var(--mf-focus-ring-on-dark); }

.sheet--leadsTriage .tri__foot .tri__fit { order: 1; flex: 1 1 100%; }
.sheet--leadsTriage .tri__foot .tri__no, .sheet--leadsTriage .tri__foot .tri__skip { order: 2; flex: 1 1 0; }

/* sticky footers inside my sheets sit flush with the bottom edge (no content peeking underneath) */
.sheet--leadsTriage .sheet__body, .sheet--leadsManual .sheet__body { padding-bottom: 0; }
.sheet--leadsTriage .sheet__body > .sheet__foot:last-child, .sheet--leadsManual .sheet__body > .sheet__foot:last-child {
  margin-bottom: 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
