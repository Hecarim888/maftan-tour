/* ---- 25-lead.css ---- */
/* ==========================================================================
   25-lead.css · lead details (.screen--lead) and the WhatsApp sheet (.sheet--whatsapp)
   Type sizes 14 / 16 / 18 / 28 only. Wide layout = container query on `app`.
   ========================================================================== */

/* ---------- Lead details ---------- */
.screen--lead { --screen-gap: 32px; }

.screen--lead .lead-top { margin-bottom: -16px; }
.screen--lead .lead-back { margin-inline-start: -12px; padding-inline: 12px 16px; }

.screen--lead .lead-head { display: flex; flex-direction: column; gap: 24px; }
.screen--lead .lead-head__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.screen--lead .lead-head__main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.screen--lead .lead-head__meta { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--lead .lead-head__acts { flex: none; display: flex; gap: 4px; margin-inline-end: -12px; }
.screen--lead .lead-wa { background: var(--mf-primary-tint); color: var(--mf-primary-strong); }
.screen--lead .lead-wa:hover { background: var(--mf-primary-tint-hover); color: var(--mf-primary-strong); }

/* Stage path: neutral nodes, the current one is outlined and bold */
.screen--lead .lead-path { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.screen--lead .lead-path > li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.screen--lead .lead-path > li + li::before {
  content: ""; position: absolute; top: 15px; height: 2px; background: var(--mf-border-hover);
  inset-inline-start: calc(-50% + 16px); inset-inline-end: calc(50% + 16px);
}
.screen--lead .lead-path > li.is-done + li.is-done::before { background: var(--mf-border-control); }
.screen--lead .lead-path__dot {
  position: relative; z-index: 1; width: 32px; height: 32px; flex: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--mf-border-hover); background: var(--mf-surface); color: var(--mf-text);
}
.screen--lead .is-done .lead-path__dot { border-color: var(--mf-border-control); background: var(--mf-surface-sunken); }
.screen--lead .is-current .lead-path__dot { border: 2px solid var(--mf-text); }
.screen--lead .is-current .lead-path__dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mf-text); }
.screen--lead .lead-path__label { font-size: 14px; line-height: 20px; font-weight: 600; }
.screen--lead .is-current .lead-path__label { font-weight: 700; }
.screen--lead .is-next .lead-path__label { font-weight: 400; color: var(--mf-text-muted); }
.screen--lead .lead-path__sub { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--lead .lead-path__sub:empty::before { content: "\00a0"; }

/* The one focus card */
.screen--lead .lead-focus { display: flex; flex-direction: column; gap: 20px; padding: 24px 20px; }
.screen--lead .lead-focus__head { display: flex; flex-direction: column; gap: 8px; }
.screen--lead .lead-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--lead .lead-note { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.screen--lead .lead-focus .btn--block { width: 100%; }

/* Decision: plain radios, the phase tone only colours the radio itself */
.screen--lead .lead-decide { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; }
.screen--lead .lead-decide > legend { padding: 0; margin-bottom: 4px; font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--lead .lead-opt { --dot: var(--mf-primary); padding-block: 10px; }
.screen--lead .lead-opt--success { --dot: var(--ph-success-dot); }
.screen--lead .lead-opt--after { --dot: var(--ph-after-dot); }
.screen--lead .lead-opt--wait { --dot: var(--ph-wait-dot); }
.screen--lead .lead-opt--neutral { --dot: var(--ph-neutral-dot); }
.screen--lead .lead-opt input { border-color: var(--dot); }
.screen--lead .lead-opt input:checked { background-color: var(--dot); border-color: var(--dot); }
.screen--lead .lead-opt:has(input:checked) .lead-opt__title { font-weight: 600; }
.screen--lead .lead-opt__title { display: block; }
.screen--lead .lead-opt__sub { display: block; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--lead .lead-opt__extra { padding-inline-start: 32px; padding-bottom: 6px; }

/* What we already know: one folded list */
.screen--lead .lead-known { display: flex; flex-direction: column; gap: 16px; }
.screen--lead .lead-fold__head { min-height: 64px; }
.screen--lead .lead-fold__head .row__title { display: flex; align-items: center; gap: 8px; }
.screen--lead .lead-clip { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen--lead .lead-fold__body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 20px; }
.screen--lead .lead-fold__body[hidden] { display: none; }
.screen--lead .lead-fold__static { min-height: 64px; }

.screen--lead .lead-answers { display: flex; flex-direction: column; gap: 20px; margin: 0; }
.screen--lead .lead-answers dt { font-size: 14px; line-height: 21px; font-weight: 600; color: var(--mf-text-muted); }
.screen--lead .lead-answers dd { margin: 4px 0 0; font-size: 16px; line-height: 24px; }
.screen--lead .lead-answers dd.lead-why { margin-top: 8px; font-size: 18px; line-height: 31px; }
.screen--lead .lead-answers--more { padding-top: 20px; border-top: 1px solid var(--mf-border-subtle); gap: 16px; }

.screen--lead .lead-rem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.screen--lead .lead-rem .check { padding-block: 8px; }
.screen--lead .lead-rem__text.is-done { color: var(--mf-text-muted); text-decoration: line-through; }
.screen--lead .lead-rem__add { display: flex; flex-direction: column; gap: 12px; }
.screen--lead .lead-rem__row { display: flex; align-items: stretch; gap: 12px; }
.screen--lead .lead-rem__row .field { flex: 1 1 auto; }
.screen--lead .lead-rem__row .btn { flex: none; }
.screen--lead .seg > button, .sheet--whatsapp .seg > button { min-height: 44px; }

@container app (min-width: 900px) {
  .screen--lead { --screen-gap: 40px; }
  .screen--lead .lead-focus { padding: 28px; }
  .screen--lead .lead-focus .btn--block { width: auto; align-self: flex-start; min-width: 240px; }
  .screen--lead .lead-fold__body { padding-inline: 24px; }
  .screen--lead .lead-answers--more { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
}

/* ---------- Lead drawer: the details over the leads board on the wide layout (no scrim) ----------
   Phone: the wrappers vanish (display: contents), the board is hidden and the details are the full screen. */
.lead-split, .lead-drawer-anchor, .lead-drawer { display: contents; }
.lead-split__board { display: none; }
.lead-close { display: none; }

@container app (min-width: 900px) {
  .lead-split__board { display: contents; }
  /* zero-height sticky anchor: the drawer stays put while the board scrolls under it */
  .lead-drawer-anchor { display: block; position: sticky; top: 0; z-index: var(--z-drawer); height: 0; flex: none; }
  .lead-drawer {
    display: block; position: absolute; top: 0; inset-inline-end: 0; box-sizing: border-box;
    width: min(var(--mf-drawer-w), 100%); height: var(--lead-drawer-h, calc(100dvh - var(--proto-bar-h, 0px)));
    overflow-y: auto; overscroll-behavior: contain; background: var(--mf-surface);
    border-inline-start: 1px solid var(--mf-border-subtle); box-shadow: var(--mf-shadow-overlay);
  }
  .lead-drawer .screen--lead { --screen-gap: 0; width: 100%; max-width: none; margin: 0; padding: 0; }
  .lead-drawer .screen--lead .lead-top { display: none; }
  .lead-drawer .screen--lead .lead-close { display: inline-flex; }
  .lead-drawer .screen--lead .lead-head { gap: 24px; padding: 20px 24px 24px; border-bottom: 1px solid var(--mf-border-subtle); }
  .lead-drawer .screen--lead .lead-focus { margin: 24px 24px 0; padding: 24px 20px; }
  .lead-drawer .screen--lead .lead-focus .btn--block { width: 100%; min-width: 0; align-self: stretch; }
  .lead-drawer .screen--lead .lead-known { margin: 32px 24px 40px; }
  .lead-drawer .screen--lead .lead-fold__body { padding-inline: 20px; }
  .lead-drawer .screen--lead .lead-answers--more { display: flex; flex-direction: column; gap: 16px; }
}

/* ---------- WhatsApp sheet ---------- */
.sheet--whatsapp .wa { display: flex; flex-direction: column; gap: 20px; }
.sheet--whatsapp .wa-pick { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; }
.sheet--whatsapp .wa-times { display: flex; flex-wrap: wrap; gap: 8px; padding-inline-start: 32px; padding-bottom: 10px; }

.sheet--whatsapp .wa-to {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; min-height: 44px;
  font-size: 16px; line-height: 24px;
}
.sheet--whatsapp .wa-to__name { font-weight: 600; }
.sheet--whatsapp .link-btn { min-width: 44px; justify-content: center; }
.sheet--whatsapp .wa-to .link-btn { margin-inline-start: 2px; }

/* The message as a calm chat bubble in Maftan colours (not WhatsApp green) */
.sheet--whatsapp .wa-bubble {
  align-self: flex-end; max-width: 92%;
  background: var(--mf-primary-tint); border: 1px solid var(--mf-primary-tint-pressed);
  border-radius: var(--radius); border-start-end-radius: var(--radius-xs);
  padding: 10px 14px;
}
.sheet--whatsapp .wa-bubble p {
  white-space: pre-line; overflow-wrap: anywhere; font-size: 16px; line-height: 26px;
}
.sheet--whatsapp .wa-link { color: var(--mf-primary-strong); text-decoration: underline; unicode-bidi: isolate; direction: ltr; }
.sheet--whatsapp .wa-copy, .sheet--whatsapp .wa-see { align-self: flex-start; }
.sheet--whatsapp .wa-tip { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--whatsapp .wa-tip .link-btn { font-size: 14px; }

@container app (min-width: 900px) {
  .sheet--whatsapp .wa-bubble { max-width: 88%; }
  .sheet--whatsapp .wa-bubble p { font-size: 18px; line-height: 30px; }
}

/* ---- 30-home.css ---- */
/* ==========================================================================
   30-home.css · screens `home` + `clients`, sheet `availability`
   Scoped under .screen--home / .screen--clients / .sheet--availability.
   Type sizes 14 / 16 / 18 / 28 only. Web layout: @container app (min-width: 900px).
   ========================================================================== */

/* ---------------------------------------------------------------- shared bits */
.screen--home .home-count,
.screen--clients .home-count {
  font-size: 14px; line-height: 21px; color: var(--mf-text-muted); font-variant-numeric: tabular-nums;
}
.screen--home .when--today,
.screen--clients .when--today { color: var(--mf-highlight-text); font-weight: 600; }

/* ---------------------------------------------------------------- home: top */
.screen--home .home-head { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.screen--home .home-avail {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 16px; line-height: 24px; color: var(--mf-text-muted);
}
.screen--home .home-avail__dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mf-primary); }
.screen--home .home-avail--closed .home-avail__dot { background: var(--mf-border-control); }
/* QA round 2: 44x44 target; the extra 4px padding per side is taken back by the negative margin, so the text stays put */
.screen--home .home-avail .link-btn { margin-block: -10px; margin-inline: -4px; padding-inline: 8px; min-width: 44px; justify-content: center; }

/* ---------------------------------------------------------------- home: sections */
.screen--home .home-sec { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.screen--home .home-sec__head { display: flex; align-items: baseline; gap: 8px; }

/* tasks: phone = one card (two lists joined), web = two cards side by side */
.screen--home .home-tasks { display: flex; flex-direction: column; min-width: 0; }
.screen--home .home-tasks > .rows:not(:only-child):first-child {
  border-bottom: 0; border-end-start-radius: 0; border-end-end-radius: 0;
}
.screen--home .home-tasks > .rows:not(:only-child):last-child {
  border-start-start-radius: 0; border-start-end-radius: 0;
}
.screen--home .task { display: flex; align-items: center; min-height: 64px; }
.screen--home .task__main {
  flex: 1 1 auto; align-self: stretch; min-width: 0; margin: 0;
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 20px; padding-inline: 20px 12px;
  color: var(--mf-text); font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none;
}
.screen--home .task__main--go { padding-inline-end: 16px; }
.screen--home a.task__main { transition: background-color var(--mf-dur-fast) var(--mf-ease); }
.screen--home a.task__main:hover { background: var(--mf-surface-sunken); color: var(--mf-text); }
.screen--home a.task__main:focus-visible { outline-offset: -2px; }
.screen--home .task__end { flex: none; margin-inline-end: 12px; }
.screen--home .task__end.icon-btn { margin-inline-start: -8px; }

/* client cards */
.screen--home .home-cards { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.screen--home .hcard { gap: 16px; min-width: 0; }
.screen--home .hcard__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.screen--home .hcard__who { min-width: 0; display: block; color: var(--mf-text); text-decoration: none; }
.screen--home .hcard__who h3 { font: 700 18px/27px var(--font-sans); overflow-wrap: anywhere; }
.screen--home a.hcard__who:hover { color: var(--mf-text); }
.screen--home a.hcard__who:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.screen--home .hcard__meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 2px;
  font-size: 14px; line-height: 21px; color: var(--mf-text-muted);
}
/* the time: terracotta chip for today, plain grey text for any other day (the status chip lives in the meta line) */
.screen--home .hcard__when {
  flex: none; padding-top: 4px; font-size: 14px; line-height: 20px; white-space: nowrap;
  color: var(--mf-text-muted); font-variant-numeric: tabular-nums;
}
.screen--home .hcard__when--today { padding: 4px 12px; color: var(--mf-highlight-text); }
.screen--home .hcard__foot {
  display: flex; align-items: center; gap: 12px; padding-top: 16px;
  border-top: 1px solid var(--mf-border-subtle);
}
.screen--home .hcard__foot--end { justify-content: flex-end; }
.screen--home .hcard__foot .step-line { flex: 1 1 auto; }
.screen--home .hcard__btn { flex: none; }

/* "הצגת כל המתאמנים (N)": a quiet text row under the cards */
.screen--home .home-more {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; padding: 0 16px;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--mf-primary-strong);
  font: 600 16px/24px var(--font-sans); cursor: pointer;
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.screen--home .home-more:hover { background: var(--mf-surface-sunken); }

/* ---------------------------------------------------------------- home: web */
@container app (min-width: 900px) {
  .screen--home { max-width: 1320px; }
  .screen--home .home-head { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .screen--home .home-tasks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .screen--home .home-tasks > .rows:not(:only-child):first-child { border-bottom: 1px solid var(--mf-border-subtle); border-radius: var(--radius); }
  .screen--home .home-tasks > .rows:not(:only-child):last-child { border-radius: var(--radius); }
  .screen--home .home-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; align-items: start; }
}

/* ---------------------------------------------------------------- clients */
.screen--clients { --screen-gap: 24px; }
.screen--clients .clients-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.screen--clients .clients-head__title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

.screen--clients .clients-search { position: relative; max-width: 440px; }
.screen--clients .clients-search__ico {
  position: absolute; top: 50%; inset-inline-start: 16px; transform: translateY(-50%);
  display: flex; color: var(--mf-text-muted); pointer-events: none;
}
.screen--clients .clients-search .input { padding-inline: 44px 14px; }

.screen--clients .clients-list { display: flex; flex-direction: column; gap: 32px; min-width: 0; }

/* one row per client: name + status, meta line, compact circles */
.screen--clients .crow {
  position: relative; display: grid; align-items: center; column-gap: 12px; row-gap: 8px;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "link chev" "track track";
  padding: 12px 16px 14px 20px; padding-inline: 20px 16px;
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.screen--clients .crow:hover { background: var(--mf-surface-sunken); }
.screen--clients .crow:has(.crow__link:focus-visible) { outline: 2px solid var(--mf-focus-ring); outline-offset: -2px; }
.screen--clients .crow__link {
  grid-area: link; min-width: 0; display: flex; flex-direction: column; color: var(--mf-text); text-decoration: none;
}
.screen--clients .crow__link:focus-visible { outline: none; }
.screen--clients .crow__link::after { content: ""; position: absolute; inset: 0; }
.screen--clients .crow__title {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
  font-size: 16px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere;
}
.screen--clients .crow__meta { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--clients .crow__track { grid-area: track; position: relative; z-index: 1; min-width: 0; }
.screen--clients .crow__chev { grid-area: chev; display: inline-flex; color: var(--mf-text-muted); }
.screen--clients .crow__chev .ico { width: 20px; height: 20px; }

/* finished: quiet */
.screen--clients .clients-done { display: flex; flex-direction: column; gap: 8px; }
.screen--clients .clients-done__h {
  display: flex; align-items: baseline; gap: 8px; font: 700 14px/21px var(--font-sans); color: var(--mf-text-muted);
}
.screen--clients .clients-done__h span { font-weight: 400; }
.screen--clients .clients-done .row__title { font-weight: 400; color: var(--mf-text-muted); }
.screen--clients .clients-none { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }

@container app (min-width: 900px) {
  .screen--clients { --screen-gap: 32px; }
  .screen--clients .crow {
    grid-template-columns: minmax(200px, 1fr) auto 20px; grid-template-areas: "link track chev";
    column-gap: 24px; padding-block: 14px;
  }
}

/* ---------------------------------------------------------------- sheet: availability */
.sheet--availability .avail { display: flex; flex-direction: column; gap: 8px; }
.sheet--availability .avail__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; }
.sheet--availability .avail__label { font-size: 16px; line-height: 24px; font-weight: 600; }
.sheet--availability .stepper { display: inline-flex; align-items: center; gap: 8px; }
.sheet--availability .stepper .icon-btn {
  border: 1px solid var(--mf-border-control); background: var(--mf-surface); color: var(--mf-text);
}
.sheet--availability .stepper .icon-btn:hover { background: var(--mf-surface-sunken); }
.sheet--availability .stepper .icon-btn:disabled {
  color: var(--mf-text-disabled); border-color: var(--mf-border-subtle); background: var(--mf-surface); cursor: not-allowed;
}
.sheet--availability .stepper__val {
  min-width: 40px; text-align: center; font: 700 18px/27px var(--font-sans); font-variant-numeric: tabular-nums;
}

/* ---- 35-process.css ---- */
/* ==========================================================================
   35-process.css · openProcess (.screen--openProcess), client (.screen--client),
   sheets contractDetails / processTrial / processGoal / processClientMenu.
   Type sizes 14 / 16 / 18 / 28 only. Surfaces --mf-surface. Container query for web.
   ========================================================================== */

/* ---------------------------------------------------------------- openProcess */
.screen--openProcess { --screen-gap: 32px; gap: 32px; padding-top: 12px; }
.screen--openProcess .op-bar { display: flex; align-items: center; gap: 8px; margin: -4px -10px 0; }
.screen--openProcess .op-bar .progress { flex: 1 1 auto; }
.screen--openProcess .op-bar--end { justify-content: flex-end; }
/* step 1 keeps a blank 44px slot where the back arrow sits on the other steps */
.screen--openProcess .op-bar__spacer { flex: none; width: 44px; height: 44px; }
/* web-only pieces: the dialog-style title and the footer "חזרה" */
.screen--openProcess .op-bar__title { display: none; }
.screen--openProcess .op-foot-back { display: none; }
.screen--openProcess .op-body { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.screen--openProcess .op-fields { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.screen--openProcess .op-pair { display: flex; gap: 12px; }
.screen--openProcess .op-pair > .field { flex: 1 1 0; }

/* segmented controls use role="radio" here */
.screen--openProcess .seg > button { min-height: 44px; }
.screen--openProcess .seg > button[aria-checked="true"] {
  background: var(--mf-surface); color: var(--mf-text); font-weight: 600;
  box-shadow: 0 0 0 1px var(--mf-border-control);
}

/* sessions stepper */
.screen--openProcess .op-stepper { display: flex; align-items: center; gap: 8px; }
.screen--openProcess .op-stepper__btn {
  flex: none; width: 44px; height: 44px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--mf-border-control); border-radius: var(--radius);
  background: var(--mf-surface); color: var(--mf-text);
}
.screen--openProcess .op-stepper__btn:hover { background: var(--mf-surface-sunken); }
.screen--openProcess .field .op-stepper input {
  flex: none; width: 64px; min-height: 48px; padding: 0;
  text-align: center; font-size: 18px; line-height: 27px; font-weight: 600;
}

/* price with the shekel sign */
.screen--openProcess .op-money { position: relative; }
.screen--openProcess .field .op-money input { padding-inline-end: 44px; }
.screen--openProcess .op-money > span {
  position: absolute; inset-inline-end: 16px; top: 12px; font-size: 16px; line-height: 24px; color: var(--mf-text-muted); pointer-events: none;
}

/* step 3 */
.screen--openProcess .op-first {
  display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 16px; padding-inline: 16px 8px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius);
}
.screen--openProcess .op-first__ico { flex: none; display: inline-flex; color: var(--mf-text-muted); }
.screen--openProcess .op-first__text { flex: 1 1 auto; min-width: 0; }
.screen--openProcess .op-first__k { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--openProcess .op-first__v { font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--openProcess .op-dates { display: flex; flex-direction: column; gap: 12px; }
.screen--openProcess .op-date-row { display: flex; align-items: flex-end; gap: 8px; }
.screen--openProcess .op-date-row__d { flex: 3 1 0; }
.screen--openProcess .op-date-row__t { flex: 2 1 0; }
.screen--openProcess .op-date-row__x { flex: none; width: 44px; height: 44px; margin-bottom: 2px; }
.screen--openProcess .op-add { align-self: flex-start; margin-inline-start: -12px; min-height: 44px; padding: 0 16px 0 12px; padding-inline: 12px 16px; }
.screen--openProcess .op-note { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--openProcess .field input[type="date"],
.screen--openProcess .field input[type="time"] { text-align: right; }
[dir="ltr"] .screen--openProcess .field input[type="date"],
[dir="ltr"] .screen--openProcess .field input[type="time"] { text-align: left; }

/* the one preview */
.screen--openProcess .op-preview { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }
.screen--openProcess .op-preview__line { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--openProcess .op-preview .track__btn { cursor: default; }

/* step 4 */
.screen--openProcess .op-sum { align-items: center; padding-block: 8px; padding-inline: 20px 8px; }
.screen--openProcess .op-sum .row__title { font-variant-numeric: tabular-nums; }
.screen--openProcess .op-trial {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  font-size: 16px; line-height: 24px; color: var(--mf-text-muted);
}

/* footer: sticky bar on the phone, plain button in the centred column on web */
.screen--openProcess .sticky-actions { gap: 4px; }

/* success */
.screen--openProcess .op-done { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.screen--openProcess .op-done__badge {
  width: 64px; height: 64px; margin-bottom: 8px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--mf-primary-tint); color: var(--mf-primary-strong);
}
.screen--openProcess .op-done__badge .ico { stroke-width: 2; }
.screen--openProcess .op-card { gap: 16px; min-width: 0; }
.screen--openProcess .op-card__head h2 { font: 700 18px/27px var(--font-sans); overflow-wrap: anywhere; }
.screen--openProcess .op-card__meta { margin-top: 2px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--openProcess .op-contract { padding: 0; display: flex; flex-direction: column; }
.screen--openProcess .op-contract .switch-row { padding: 8px 16px 0; min-height: 56px; }
.screen--openProcess .op-contract .switch-row__title { font-size: 16px; line-height: 24px; font-weight: 600; }
.screen--openProcess .op-contract__line {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 4px 16px; padding-inline: 16px 8px;
}
.screen--openProcess .op-contract__line > span { min-width: 0; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--openProcess .op-contract__edit { display: flex; align-items: flex-end; gap: 8px; padding: 4px 16px 16px; }
.screen--openProcess .op-contract__edit .field { flex: 1 1 auto; }
.screen--openProcess .op-contract__edit .btn { flex: none; margin-bottom: 2px; }
.screen--openProcess .op-done__actions { flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 4px; }
/* the second success action is a quiet text link (approved: plain sage text, no fill) */
.screen--openProcess .op-done__link {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; padding: 0 16px;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--mf-primary-strong);
  font: 600 16px/20px var(--font-sans); text-underline-offset: 3px;
}
.screen--openProcess .op-done__link:hover { background: transparent; text-decoration: underline; }

@container app (min-width: 900px) {
  .screen--openProcess { padding-top: 48px; max-width: 640px; }
  /* dialog-style header (S06 web): title at the start, close at the end, the thin bar under both */
  .screen--openProcess .op-bar--end { margin-inline: -10px; }
  .screen--openProcess .op-bar:not(.op-bar--end) {
    display: grid; grid-template-columns: minmax(0, 1fr) 44px; grid-template-areas: "title close" "bar bar";
    align-items: center; gap: 8px 8px; margin: -4px 0 0;
  }
  .screen--openProcess .op-bar__back { display: none; }
  .screen--openProcess .op-bar__title {
    display: block; grid-area: title; margin: 0; min-width: 0; overflow-wrap: anywhere;
    font: 700 18px/27px var(--font-sans); color: var(--mf-text);
  }
  .screen--openProcess .op-bar .progress { grid-area: bar; }
  .screen--openProcess .op-bar__close { grid-area: close; margin-inline-end: -10px; }
  .screen--openProcess .sticky-actions {
    position: static; margin: 8px 0 0; padding: 0; border-top: 0; background: transparent;
  }
  .screen--openProcess .op-body ~ .sticky-actions { flex-wrap: nowrap; gap: 12px; }
  .screen--openProcess .op-body ~ .sticky-actions > .btn--primary { width: auto; flex: 1 1 0; }
  .screen--openProcess .op-foot-back { display: inline-flex; flex: none; }
  .screen--openProcess .op-done__actions { margin-top: 8px; }
}

/* ---------------------------------------------------------------- client file */
.screen--client { --screen-gap: 24px; gap: 24px; padding-top: 12px; }
.screen--client .pc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 -8px; }
.screen--client .pc-back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-inline-start: -4px; padding-inline: 4px 12px;
  border-radius: var(--radius); color: var(--mf-primary-strong); font-weight: 600; text-decoration: none;
}
.screen--client .pc-back:hover { background: var(--mf-surface-sunken); color: var(--mf-primary-strong); }
.screen--client .pc-back .ico { width: 22px; height: 22px; }
.screen--client .pc-head { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.screen--client .pc-head__row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }

.screen--client .tabs { gap: 0; overflow: visible; }
.screen--client .tabs > button { padding: 0 14px; margin-bottom: -1px; }
.screen--client .tabs > [aria-selected="true"] { color: var(--mf-primary-strong); font-weight: 700; }
.screen--client .tabs > [aria-selected="true"]::after { inset-inline: 0; bottom: 0; }
.screen--client #pc-panel { min-width: 0; margin-top: 4px; }
.screen--client .pc-panel { display: flex; flex-direction: column; gap: 44px; min-width: 0; }

/* goals */
.screen--client .pc-goals { display: flex; flex-direction: column; gap: 16px; }
.screen--client .pc-og { display: flex; flex-direction: column; gap: 4px; }
.screen--client .pc-og__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.screen--client .pc-kicker { font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted); }
.screen--client .pc-edit {
  min-height: 44px; margin-block: -12px; margin-inline-end: -12px; padding: 0 12px;
  border: 0; border-radius: var(--radius); background: transparent;
  color: var(--mf-primary-strong); font-size: 14px; line-height: 21px; font-weight: 600;
}
.screen--client .pc-edit:hover { background: var(--mf-surface-sunken); }
.screen--client .pc-og__text { font-size: 18px; line-height: 31px; overflow-wrap: anywhere; }
.screen--client .pc-og__meta, .screen--client .pc-og__empty { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--client .pc-goals__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.screen--client .pc-goals__list > li {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 24px;
}
.screen--client .pc-goals__list > li > .muted { flex: none; }

/* sessions */
.screen--client .pc-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.screen--client .pc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.screen--client .pc-list > li { border-bottom: 1px solid var(--mf-border-subtle); }
.screen--client .pc-sess {
  display: flex; align-items: center; gap: 16px; width: 100%; min-height: 64px;
  padding-block: 18px; padding-inline: 0 16px;
  background: transparent; border: 0; border-radius: var(--radius); color: var(--mf-text); text-align: start; font: inherit;
}
.screen--client .pc-sess:active { background: var(--mf-surface-sunken); }
.screen--client .pc-sess .tc { flex: none; }
.screen--client .pc-sess__main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.screen--client .pc-sess__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.screen--client .pc-sess__title { font-size: 16px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.screen--client .pc-sess__title--now { font-weight: 700; }
.screen--client .pc-sess__status { flex: none; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--client .pc-sess__topic,
.screen--client .pc-sess__plain {
  display: block; font-size: 16px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.screen--client .pc-sess__topic { color: var(--mf-text-muted); }
.screen--client .pc-sess__kind { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); font-variant-numeric: tabular-nums; }
.screen--client .pc-sess__step { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 14px; line-height: 21px; min-width: 0; }
.screen--client .pc-sess__step > .ico { color: var(--mf-highlight); }
.screen--client .pc-sess__step > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen--client .pc-today { color: var(--mf-highlight-text); }
.screen--client .pc-note-ico {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--mf-surface-sunken); color: var(--mf-text-muted);
  display: flex; align-items: center; justify-content: center;
}
.screen--client .pc-row--act { padding-bottom: 20px; }
.screen--client .pc-row--act .pc-sess { padding-bottom: 12px; }
.screen--client .pc-row__act { margin-inline-start: 48px; padding-inline: 20px; }
.screen--client .pc-more .pc-more__text { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }
.screen--client .pc-dash {
  flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px dashed var(--mf-border-control); background: var(--mf-surface);
}
.screen--client .pc-list > li:last-child { border-bottom: 0; }

/* rows on the other tabs: chevrons and icons keep 16px from the end edge */
.screen--client .rows--flat .row { padding-inline: 0 16px; min-height: 64px; gap: 16px; }
.screen--client .rows--flat .pc-kv { padding-inline: 0 8px; }
.screen--client .pc-ico { flex: none; display: inline-flex; color: var(--mf-text-muted); }
.screen--client .pc-ok { display: inline-flex; align-items: center; gap: 6px; color: var(--mf-success-text); font-weight: 600; }
.screen--client .pc-cta { color: var(--mf-primary-strong); font-weight: 600; }
.screen--client .switch:disabled { opacity: 0.5; cursor: not-allowed; }
.screen--client .switch-row { padding: 8px 0; }

/* ---------------------------------------------------------------- sheets */
.sheet--contractDetails .sheet__body, .sheet--processTrial .sheet__body, .sheet--processGoal .sheet__body { gap: 16px; }
.sheet--contractDetails .pc-dl { display: flex; flex-direction: column; margin: 0; }
.sheet--contractDetails .pc-dl__row {
  min-height: 48px; padding-block: 12px; border-bottom: 1px solid var(--mf-border-subtle);
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
}
.sheet--contractDetails .pc-dl__row:last-child { border-bottom: 0; }
.sheet--contractDetails .pc-dl__row dt { flex: none; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--contractDetails .pc-dl__row dd { margin: 0; font-size: 16px; line-height: 24px; text-align: end; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sheet--processTrial p { font-size: 16px; line-height: 27px; }
.sheet--processGoal textarea { min-height: 112px; }
.sheet--processClientMenu .rows { border: 0; border-radius: 0; background: transparent; overflow: visible; }
.sheet--processClientMenu .row { padding-inline: 0 16px; gap: 16px; min-height: 56px; }
.sheet--processClientMenu .pc-ico { flex: none; display: inline-flex; color: var(--mf-text-muted); }

/* ---- 40-sessions.css ---- */
/* ==========================================================================
   40-sessions.css: brief, summary, session sheet.
   Scoped under .screen--brief / .screen--summary / .sheet--session.
   Sizes 14 / 16 / 18 / 28 only. Terracotta only on the small step and "today".
   ========================================================================== */

/* ---------- shared pieces (screens and sheet) ---------- */
.screen--brief .ses-label, .screen--summary .ses-label, .sheet--session .ses-label {
  font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted);
}
.screen--brief .ses-text, .screen--summary .ses-text {
  font-size: 18px; line-height: 31px; overflow-wrap: anywhere;
}
.sheet--session .ses-text { font-size: 16px; line-height: 24px; overflow-wrap: anywhere; }
.screen--brief .ses-sm, .screen--summary .ses-sm { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

.screen--brief .ses-thread, .screen--summary .ses-thread, .sheet--session .ses-thread {
  display: flex; flex-direction: column; gap: 20px; margin: 0;
}
.screen--brief .ses-item, .screen--summary .ses-item, .sheet--session .ses-item {
  display: flex; flex-direction: column; gap: 4px; min-width: 0; margin: 0;
}
.screen--brief .ses-step .step-line, .screen--summary .ses-step .step-line {
  align-items: flex-start; font-size: 18px; line-height: 31px;
}
.screen--brief .ses-step .step-line > .ico, .screen--summary .ses-step .step-line > .ico { margin-top: 7.5px; }
.sheet--session .ses-step .step-line { align-items: flex-start; }
.sheet--session .ses-step .step-line > .ico { margin-top: 4px; }
.sheet--session .ses-thread--sheet { gap: 16px; }
.screen--brief .ses-step p, .screen--summary .ses-step p, .sheet--session .ses-step p { overflow-wrap: anywhere; }

/* icon box used by file / summary / bare rows */
.screen--summary .ses-ico, .sheet--session .ses-ico {
  flex: none; width: 40px; height: 40px; border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--mf-surface-sunken); color: var(--mf-text-muted);
}
.sheet--session .ses-ico--bare { width: 24px; height: 24px; border-radius: 0; background: transparent; }
.screen--summary .ses-ico .ico, .sheet--session .ses-ico .ico { width: 20px; height: 20px; }

/* ---------- page chrome: top bar + header ---------- */
.screen.screen--brief, .screen.screen--summary {
  --screen-gap: 32px; padding-top: 8px;
}
.screen--brief .ses-top, .screen--summary .ses-top {
  display: flex; align-items: center; gap: 4px; min-height: 48px; margin-inline-start: -10px;
}
.screen--brief .ses-top__title, .screen--summary .ses-top__title {
  flex: 1 1 auto; min-width: 0; font: 700 16px/24px var(--font-sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.screen--brief .ses-head { display: flex; flex-direction: column; min-width: 0; }
.screen--brief .ses-head__sub { margin-top: 4px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--brief .ses-head .track { margin-top: 20px; }
.screen--brief .ses-whenrow {
  margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.screen--brief .ses-when, .sheet--session .ses-when { font-size: 16px; line-height: 24px; }
.screen--brief .ses-when--muted, .sheet--session .ses-when--muted { color: var(--mf-text-muted); }

/* a chip that is also a button: the button itself is 44px high (negative margin keeps the row height), the pill is painted by ::before */
.ses-chipbtn {
  position: relative; isolation: isolate; border: 0; cursor: pointer;
  min-height: 44px; margin-block: -10px; padding-block: 0; background: transparent;
}
.ses-chipbtn::before {
  content: ""; position: absolute; inset-inline: 0; top: 50%; height: 24px; margin-top: -12px; z-index: -1;
  border-radius: 999px; background: var(--mf-warning-soft);
}
.ses-chipbtn.chip--warn:hover::before { background: #F0E2B5; }

/* ---------- brief sections ---------- */
.screen--brief .ses-sec, .screen--summary .ses-sec {
  border-top: 1px solid var(--mf-border-subtle); padding-top: 32px;
  display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.screen--summary .ses-sec--first { border-top: 0; padding-top: 0; }
.screen--brief .ses-sec--list, .screen--summary .ses-sec--list { gap: 20px; }
.screen--brief .ses-sec h2, .screen--summary .ses-sec h2 { font: 700 18px/27px var(--font-sans); }
.screen--brief .ses-sec__head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.screen--brief .ses-sec__head:has(.btn) { min-height: 44px; margin-block: -8px; }
.screen--brief .ses-sec__head .btn--quiet { margin-inline-end: -8px; }
.screen--brief .ses-text--note { white-space: pre-line; }

.screen--brief .ses-goals { display: flex; flex-direction: column; gap: 8px; margin: 0; }
.screen--brief .ses-goal { font-size: 16px; line-height: 24px; }
.screen--brief .ses-goal__name { font-weight: 600; }
.screen--brief .ses-goal__prog { color: var(--mf-text-muted); }

.screen--brief .ses-links { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-inline-start: -16px; }
.screen--brief .ses-first { font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }

/* ---------- prep note editor (brief and sheet) ---------- */
.screen--brief .ses-edit, .sheet--session .ses-edit { display: flex; flex-direction: column; gap: 8px; }
.sheet--session .ses-edit__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.screen--brief .ses-edit__ta, .sheet--session .ses-edit__ta {
  min-height: 112px; padding: 10px 14px; line-height: 27px; resize: vertical;
}
.screen--brief .ses-edit__bar, .sheet--session .ses-edit__bar { display: flex; align-items: center; gap: 8px; }
.screen--brief .ses-count, .sheet--session .ses-count {
  margin-inline-start: auto; font-size: 14px; line-height: 21px; color: var(--mf-text-muted);
}

/* ---------- pinned action bar: phone look (wide uses the shell's .sticky-actions as it is) ---------- */
@container app (max-width: 899px) {
  .screen--brief .sticky-actions > .btn { flex: 1 1 0; min-width: 0; }
  .screen--brief .sticky-actions > .btn--secondary { min-height: 52px; }
}
.screen--brief .ses-wa { width: 52px; height: 52px; flex: none; }

/* ---------- summary ---------- */
.screen--summary .ses-note { gap: 12px; }
.screen--summary .ses-note h3 { font: 700 16px/24px var(--font-sans); }
.screen--summary .ses-note__body { font-size: 16px; line-height: 27px; white-space: pre-line; overflow-wrap: anywhere; }
.screen--summary .ses-empty { padding: 0; }
.screen--summary .rows .row { min-height: 64px; }

/* ---------- session sheet ---------- */
.sheet--session .ses-meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sheet--session .ses-meta__line {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted);
}
.sheet--session .ses-meta__line .ses-when { font-size: 14px; line-height: 21px; }
.sheet--session .ses-meta__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; }

.sheet--session .ses-chip {
  position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 4px;
  min-height: 44px; margin-block: -10px; padding: 0 10px; border: 0; background: transparent;
  font: 600 14px/20px var(--font-sans); cursor: pointer;
}
.sheet--session .ses-chip::before {
  content: ""; position: absolute; inset-inline: 0; top: 50%; height: 24px; margin-top: -12px; z-index: -1;
  border-radius: 999px; background: var(--chip-bg);
}
.sheet--session .ses-chip .ico { width: 16px; height: 16px; }
.sheet--session .ses-chip--ok { --chip-bg: var(--mf-success-soft); color: var(--mf-success-text); }
.sheet--session .ses-chip--ok:hover { --chip-bg: #D6E8D9; }
.sheet--session .ses-chip--off { --chip-bg: var(--mf-surface-sunken); color: var(--mf-text-muted); }
.sheet--session .ses-chip--off:hover { --chip-bg: var(--mf-surface-sunken-hover); }

.sheet--session .ses-scores { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0; }
.sheet--session .ses-score { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; }
.sheet--session .ses-score__v {
  min-width: 32px; height: 32px; padding: 0 8px; border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--mf-primary); color: var(--mf-on-primary); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.sheet--session .ses-score__v.is-empty {
  background: var(--mf-surface); color: var(--mf-text-muted); box-shadow: inset 0 0 0 1px var(--mf-border-control); font-weight: 400;
}

.sheet--session .ses-sum__state { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--session .ses-sum--on .ses-ico { background: var(--mf-success-soft); color: var(--mf-success-text); }
.sheet--session .ses-sum--on .ses-sum__state { color: var(--mf-success-text); font-weight: 600; }

.sheet--session .ses-foot { justify-content: space-between; gap: 8px; padding-block: 8px 12px; }
.sheet--session .ses-foot .switch-row { width: auto; flex: none; gap: 12px; padding: 0; }
.sheet--session .ses-foot .btn { margin-inline-start: auto; }

.sheet--session .ses-actions { display: flex; gap: 12px; }
.sheet--session .ses-actions .btn { flex: 1 1 0; min-width: 0; min-height: 52px; }

.sheet--session .ses-preprow { align-items: center; padding-block: 8px; }
.sheet--session .ses-preprow__text {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  font-size: 16px; line-height: 24px;
}
.sheet--session .ses-preprow__lead { font-weight: 600; }
.sheet--session .ses-preprow .btn { flex: none; margin-inline-end: -8px; }

.sheet--session .ses-status { display: flex; flex-direction: column; gap: 8px; }
.sheet--session .ses-h { font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted); }

/* date + time picker (קביעת מועד / שינוי מועד / נדחה) */
.sheet--session .ses-pick { display: flex; flex-direction: column; gap: 16px; }
.sheet--session .ses-pick__fields { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
.sheet--session .ses-pick .field { gap: 4px; }
.sheet--session .ses-pick .field > label { font: 600 14px/21px var(--font-sans); color: var(--mf-text-muted); }
.sheet--session .ses-pick__bar { display: flex; flex-direction: column; gap: 8px; }
.sheet--session .ses-pick__bar > .btn--primary { width: 100%; min-height: 52px; }
.sheet--session .ses-pick__more { display: flex; gap: 8px; }
.sheet--session .ses-pick__more .btn { flex: 1 1 0; min-width: 0; }

/* notification row: the whole row is the (invisible) native select */
.sheet--session .ses-remind { position: relative; cursor: pointer; transition: background-color var(--mf-dur-fast) var(--mf-ease); }
.sheet--session .ses-remind:hover { background: var(--mf-surface-sunken); }
.sheet--session .ses-remind:has(.ses-remind__sel:focus-visible) { outline: 2px solid var(--mf-focus-ring); outline-offset: -2px; }
.sheet--session .ses-remind__val { flex: none; font-size: 16px; line-height: 24px; color: var(--mf-text-muted); font-variant-numeric: tabular-nums; }
.sheet--session .ses-remind > .ico--chevronDown { width: 18px; height: 18px; color: var(--mf-text-muted); }
.sheet--session .ses-remind__sel option { background: var(--mf-surface); color: var(--mf-text); }
.sheet--session .ses-remind__sel {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; border: 0; background: transparent; appearance: none;
  font: 400 16px var(--font-sans);
}

/* ---------- web ---------- */
@container app (min-width: 900px) {
  .screen.screen--brief, .screen.screen--summary { --screen-gap: 40px; padding-top: 24px; }
}

/* ---- 45-endsession.css ---- */
/* ==========================================================================
   45-endsession.css · screens endSession, sendPage, clientPage
   Scoped under .screen--endSession / .screen--sendPage / .screen--clientPage.
   Type sizes 14 / 16 / 18 / 28 only. Web = @container app (min-width: 900px).
   ========================================================================== */

/* ---------- end of session ---------- */
.screen--endSession .es-progress[data-step="1"] { --p: 0.2; }
.screen--endSession .es-progress[data-step="2"] { --p: 0.4; }
.screen--endSession .es-progress[data-step="3"] { --p: 0.6; }
.screen--endSession .es-progress[data-step="4"] { --p: 0.8; }
.screen--endSession .es-progress[data-step="5"] { --p: 1; }

.screen--endSession .es-titlerow { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 12px; }
.screen--endSession .es-title:focus { outline: none; }
.screen--endSession .es-body { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.screen--endSession .es-block { display: flex; flex-direction: column; gap: 12px; }
.screen--endSession .es-block--lower { gap: 24px; margin-top: 12px; }

.screen--endSession .field textarea { min-height: 64px; resize: none; }
.screen--endSession .field__row { align-items: center; }
.screen--endSession .field__row > label { font: 600 16px/24px var(--font-sans); }
.screen--endSession .field__row--start { justify-content: flex-start; gap: 12px; }

.screen--endSession .es-remind {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 14px; line-height: 21px; color: var(--mf-text-muted);
}
.screen--endSession .es-remind .ico { margin-top: 3px; }
.screen--endSession .es-notebtn { align-self: flex-start; }
.screen--endSession .es-sub { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--endSession .es-sub--strong { font-weight: 600; }
.screen--endSession .es-note { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

/* goals */
.screen--endSession .es-later { align-self: flex-start; }
.screen--endSession .es-later[aria-pressed="true"] { background: var(--mf-primary-tint); }
.screen--endSession .es-add { align-self: flex-start; }
.screen--endSession .es-og { display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--mf-border-subtle); }
.screen--endSession .es-og__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.screen--endSession .es-og__text { font-size: 18px; line-height: 29px; }
.screen--endSession .es-goal { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.screen--endSession .es-goal__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.screen--endSession .es-goal__name { font: 600 16px/24px var(--font-sans); }
.screen--endSession .es-goal__scale { display: flex; flex-direction: column; gap: 8px; }
.screen--endSession .es-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.screen--endSession .es-scale .chip-btn { width: 100%; min-height: 44px; padding: 0; border-radius: var(--radius); font-weight: 400; }
.screen--endSession .es-scale .chip-btn[aria-pressed="true"] { font-weight: 700; }

/* small step */
.screen--endSession .es-steplabel { display: flex; align-items: center; gap: 8px; }
.screen--endSession .es-steplabel .ico { color: var(--mf-highlight); }
.screen--endSession .es-stepfield textarea { min-height: 128px; }

/* payment and report */
.screen--endSession .es-paid { padding: 4px 16px; }
.screen--endSession .es-upload {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 0 16px;
  border: 1px dashed var(--mf-border-control); border-radius: var(--radius); background: transparent;
  color: var(--mf-primary-strong); font: 600 16px/24px var(--font-sans);
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.screen--endSession .es-upload:hover { background: var(--mf-surface-sunken); }
.screen--endSession .es-upload .ico { width: 20px; height: 20px; }
.screen--endSession .es-file {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 16px 4px 4px; padding-inline: 16px 4px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius);
}
.screen--endSession .es-file > .ico { color: var(--mf-text-muted); }
.screen--endSession .es-file__name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

/* next session */
.screen--endSession .es-next {
  display: flex; flex-direction: column; gap: 4px; padding: 20px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-control); border-radius: var(--radius);
}
.screen--endSession .es-next--set { border-color: var(--mf-primary); box-shadow: 0 0 0 1px var(--mf-primary); }
.screen--endSession .es-next__n { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--endSession .es-next__when { font: 700 18px/27px var(--font-sans); }
.screen--endSession .es-toggles { flex-wrap: nowrap; }
.screen--endSession .es-toggles .btn { flex: 1 1 0; min-width: 0; padding-inline: 12px; white-space: normal; }
.screen--endSession .es-toggles .btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--mf-primary); }
.screen--endSession .es-when { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

/* footer (end flow, saved screen, composer): the bar is the shell's .sticky-actions (M8); only its contents are laid out here */
.screen--endSession .es-foot,
.screen--sendPage .sp-foot {
  flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 0;
}
@container app (max-width: 899px) {
  .screen--endSession .es-foot,
  .screen--sendPage .sp-foot { padding-top: 8px; padding-bottom: 8px; }
}
.screen--endSession .es-foot > .btn--primary,
.screen--sendPage .sp-foot > .btn { flex: 0 0 auto; }
.screen--endSession .es-foot__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.screen--endSession .es-foot__row--center { justify-content: center; }
.screen--sendPage .sp-foot > .btn--quiet { align-self: center; }
.screen--sendPage .sp-foot__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* saved */
.screen--endSession .es-saved {
  flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding-block: 40px; text-align: center;
}
.screen--endSession .es-saved__ico {
  width: 76px; height: 76px; border-radius: 50%; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--mf-primary-tint); color: var(--mf-primary);
}

@container app (min-width: 900px) {
  .screen--endSession .es-scale { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .screen--endSession .es-foot,
  .screen--sendPage .sp-foot { flex-direction: row; align-items: center; gap: 16px; }
  .screen--endSession .es-foot > .btn--primary,
  .screen--sendPage .sp-foot > .btn--primary,
  .screen--sendPage .sp-foot > .btn--secondary { width: auto; min-width: 200px; }
  .screen--endSession .es-foot__row { justify-content: flex-start; }
  .screen--endSession .es-foot__row--center { justify-content: flex-start; }
  .screen--sendPage .sp-foot__row { justify-content: flex-start; }
}

/* ---------- send page (composer) ---------- */
.screen--sendPage .sp-body { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

/* the small step: the approved terracotta card with "עריכה" (edit swaps the text for a field) */
.screen--sendPage .sp-step { display: flex; flex-direction: column; gap: 4px; padding: 8px 16px 16px; background: var(--mf-highlight-soft); border-radius: var(--radius); }
.screen--sendPage .sp-step__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.screen--sendPage .sp-step__title { display: flex; align-items: center; gap: 8px; font: 700 14px/21px var(--font-sans); color: var(--mf-highlight-text); }
.screen--sendPage .sp-step__title .ico { color: var(--mf-highlight); }
.screen--sendPage .sp-step__edit { gap: 4px; font-size: 14px; font-weight: 400; color: var(--mf-highlight-text); }
.screen--sendPage .sp-step__edit .ico { width: 16px; height: 16px; }
.screen--sendPage .sp-step__text { font-size: 16px; line-height: 26px; overflow-wrap: anywhere; white-space: pre-line; }
.screen--sendPage .sp-step .field textarea { min-height: 96px; padding: 10px 12px; resize: none; }

.screen--sendPage .sp-word textarea { min-height: 64px; padding: 10px 12px; resize: none; }

.screen--sendPage .sp-upload {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 0 16px;
  border: 1px dashed var(--mf-border-control); border-radius: var(--radius); background: transparent;
  color: var(--mf-primary-strong); font: 600 16px/24px var(--font-sans);
  transition: background-color var(--mf-dur-fast) var(--mf-ease);
}
.screen--sendPage .sp-upload:hover { background: var(--mf-surface-sunken); }
.screen--sendPage .sp-upload .ico { width: 20px; height: 20px; }
.screen--sendPage .sp-file {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 16px 4px 4px; padding-inline: 16px 4px;
  background: var(--mf-surface); border: 1px solid var(--mf-border-subtle); border-radius: var(--radius);
}
.screen--sendPage .sp-file > .ico { color: var(--mf-text-muted); }
.screen--sendPage .sp-file__name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

/* the preview sheet: the message as a calm chat bubble in Maftan colours (not WhatsApp green) */
.sheet--sendPreview .sp-prev { display: flex; flex-direction: column; }
.sheet--sendPreview .sp-bubble {
  align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; gap: 8px;
  background: var(--mf-primary-tint); border: 1px solid var(--mf-primary-tint-pressed);
  border-radius: var(--radius); border-start-end-radius: var(--radius-xs);
  padding: 10px 14px;
}
.sheet--sendPreview .sp-bubble p { white-space: pre-line; overflow-wrap: anywhere; font-size: 16px; line-height: 26px; }
.sheet--sendPreview .sp-bubble .sp-bubble__file { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.sheet--sendPreview .sp-link { color: var(--mf-primary-strong); text-decoration: underline; unicode-bidi: isolate; direction: ltr; }
@container app (min-width: 900px) {
  .sheet--sendPreview .sp-bubble { max-width: 88%; }
  .sheet--sendPreview .sp-bubble p { font-size: 18px; line-height: 30px; }
}

/* ---------- client page (client side) ---------- */
.screen--clientPage .cp-wrap {
  width: 100%; max-width: calc(var(--mf-reading-max) + 2 * var(--mf-gutter)); margin-inline: auto; padding-inline: var(--mf-gutter);
}
.screen--clientPage .cp-toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.screen--clientPage .cp-back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; margin-inline: -8px;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  font: 400 14px/21px var(--font-sans); color: var(--mf-text-muted); text-decoration: none;
}
.screen--clientPage .cp-back:hover { color: var(--mf-text); background: rgb(38 48 42 / 0.06); }
.screen--clientPage .cp-coach { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }
.screen--clientPage .cp-brand { font-size: 14px; line-height: 21px; color: var(--mf-text-muted); text-align: center; }

.screen--clientPage .cp-avatar {
  flex: none; width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--mf-surface); color: var(--coach-strong); font: 700 18px/1 var(--font-sans);
}
.screen--clientPage .cp-avatar--lg { width: 80px; height: 80px; margin-top: -40px; border: 4px solid var(--mf-bg); font-size: 28px; }

/* unlock */
.screen--clientPage .cp-band { background: var(--coach-soft); min-height: 128px; padding-top: 8px; }
.screen--clientPage .cp-unlock__body { display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
.screen--clientPage .cp-form { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
.screen--clientPage .cp-form > label { font-size: 16px; line-height: 24px; }
.screen--clientPage .cp-pin { display: flex; justify-content: center; gap: 12px; }
.screen--clientPage .cp-pin__d {
  width: 56px; height: 64px; padding: 0; text-align: center;
  background: var(--mf-surface); color: var(--mf-text);
  border: 1.5px solid var(--mf-border-control); border-radius: var(--radius);
  font: 700 28px/1 var(--font-sans); font-variant-numeric: tabular-nums;
}
.screen--clientPage .cp-pin__d:focus-visible { border-color: var(--coach); }
.screen--clientPage .cp-pin__d[aria-invalid="true"] { border-color: var(--mf-error); }
.screen--clientPage .cp-form .field__error { text-align: center; }
.screen--clientPage .cp-proto {
  padding-top: 12px; border-top: 1px dashed var(--mf-border-subtle);
  font-size: 14px; line-height: 21px; color: var(--mf-text-muted); text-align: center;
}

/* page */
.screen--clientPage .cp-head { background: var(--coach-soft); padding-block: 8px 28px; }
.screen--clientPage .cp-head__in { display: flex; align-items: center; gap: 16px; padding-top: 12px; }
.screen--clientPage .cp-main { display: flex; flex-direction: column; gap: 32px; padding-block: 28px 8px; min-width: 0; }
.screen--clientPage .cp-foot { padding-block: 24px 40px; }
.screen--clientPage .cp-sec { display: flex; flex-direction: column; gap: 12px; }
.screen--clientPage .cp-next { display: flex; align-items: center; gap: 12px; }

/* contract */

/* client-side accent: the coach's colour instead of the app sage */

/* ---- 50-notebook.css ---- */
/* ==========================================================================
   50-notebook.css: notebook writing page, link sheet, browse sheet.
   Scoped under .screen--notebook / .sheet--noteLink / .sheet--notebookBrowse.
   Sizes 14 / 16 / 18 / 28 (serif title 26-28). Surfaces var(--mf-surface).
   ========================================================================== */

/* ---------- Page: paper surface, one centred column ---------- */
.screen.screen--notebook {
  --screen-gap: 0;
  --screen-pad-bottom: 0;
  gap: 0;
  padding: 0 var(--mf-gutter);
  max-width: none;
  background: var(--mf-surface);
}
.screen--notebook .nb-page {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 720px;
  min-width: 0;
  margin-inline: auto;
}

/* Header: heading + lock, then the side buttons */
.screen--notebook .nb-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  min-height: 56px;
  margin-inline: calc(-1 * var(--mf-gutter));
  padding-inline: var(--mf-gutter) 8px;
  border-bottom: 1px solid var(--mf-border-subtle);
}
.screen--notebook .nb-head__id { display: flex; align-items: center; gap: 12px; min-width: 0; }
.screen--notebook .nb-h1 { font: 600 18px/27px var(--font-sans); font-synthesis: none; white-space: nowrap; }
.screen--notebook .nb-head__actions { display: flex; align-items: center; gap: 4px; min-width: 0; }
.screen--notebook .nb-head__actions .btn { padding: 0 12px; }
.screen--notebook .nb-new { padding: 0; min-width: 44px; }
.screen--notebook .nb-new span { display: none; }
.screen--notebook .nb-new .ico { width: 22px; height: 22px; }
.screen--notebook .nb-save-head { display: none; }

/* Back row (only when the page was opened from another screen) */
.screen--notebook .nb-back { flex: none; margin-top: 4px; margin-inline-start: -12px; }
.screen--notebook .nb-back + .nb-head { margin-top: 0; }

/* Title field (serif) */
.screen--notebook .nb-title {
  flex: none;
  display: block;
  /* 12px inner padding with an equal negative margin: the text keeps the column edge while the focus ring gets room */
  width: calc(100% + 24px);
  height: 56px;
  margin: 12px -12px 0;
  padding: 0 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--mf-text);
  font: 500 26px/38px var(--font-display);
  font-synthesis: none;
}
/* the typed title is the serif page title of the approved design; the empty hint is a small quiet sans line, not a big grey heading */
.screen--notebook .nb-title::placeholder { color: var(--mf-text-muted); opacity: 1; font: 400 16px/24px var(--font-sans); }
.screen--notebook .nb-title:focus-visible { outline-offset: 0; }

/* The one link button / pill */
.screen--notebook .nb-linkrow { flex: none; display: flex; align-items: center; min-height: 44px; margin-top: 12px; min-width: 0; }
.screen--notebook .nb-linkbtn { justify-content: flex-start; }
.screen--notebook .nb-pill {
  position: relative;
  display: inline-flex;
  align-items: stretch;
  max-width: 100%;
  height: 44px;
  border-radius: 999px;
  background: var(--mf-surface);
}
/* the outline is an overlay so both buttons inside keep the full 44px height */
.screen--notebook .nb-pill::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--mf-border-control);
  border-radius: inherit;
  pointer-events: none;
  z-index: 1;
}
.screen--notebook .nb-pill button {
  position: relative;
  display: inline-flex;
  align-items: center;
  border: 0;
  background: transparent;
  color: var(--mf-text);
  border-radius: 999px;
}
.screen--notebook .nb-pill button:hover { background: var(--mf-surface-sunken); }
.screen--notebook .nb-pill button:focus-visible { outline-offset: -3px; }
.screen--notebook .nb-pill__main { gap: 8px; min-width: 0; padding-inline: 16px 8px; font-size: 16px; line-height: 24px; }
.screen--notebook .nb-pill__main .ico { color: var(--mf-text-muted); }
.screen--notebook .nb-pill__main span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen--notebook .nb-pill__x { flex: none; justify-content: center; width: 48px; padding: 0; color: var(--mf-text-muted); }

/* The text window */
.screen--notebook .nb-body {
  flex: 1 1 auto;
  display: block;
  width: 100%;
  min-height: 280px;
  margin: 16px 0 0;
  padding: 0 0 24px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--mf-text);
  font: 400 16px/1.7 var(--font-sans);
  resize: none;
  overflow: hidden;
}
.screen--notebook .nb-body::placeholder { color: var(--mf-text-muted); opacity: 1; }
.screen--notebook .nb-body:focus-visible { outline-offset: 6px; }

/* Phone: the save bar is the sticky one */
.screen--notebook .sticky-actions { flex: none; }

/* ---------- Web ---------- */
@container app (min-width: 900px) {
  .screen.screen--notebook {
    padding: 32px 40px 64px;
    transition: padding-inline-end var(--mf-dur-slow) var(--mf-ease);
  }
  /* the browse / link panel is a drawer without scrim: make room so it never covers the page */
  .app[data-sheet-open="drawer"] .screen.screen--notebook { padding-inline-end: calc(var(--mf-drawer-w) + 40px); }

  .screen--notebook .nb-head { margin-inline: 0; padding-inline: 0; border-bottom: 0; min-height: 44px; }
  .screen--notebook .nb-head__actions { gap: 8px; }
  .screen--notebook .nb-head__actions .btn { padding: 0 16px; }
  .screen--notebook .nb-new { padding: 0 16px; min-width: 0; }
  .screen--notebook .nb-new span { display: inline; }
  .screen--notebook .nb-new .ico { width: 20px; height: 20px; }
  .screen--notebook .nb-save-head { display: inline-flex; min-height: 44px; }
  .screen--notebook .sticky-actions { display: none; }
  .screen--notebook .nb-back { margin-top: 0; margin-bottom: 8px; }

  .screen--notebook .nb-title { margin-top: 32px; height: 56px; font-size: 28px; line-height: 42px; }
  .screen--notebook .nb-body { min-height: 420px; font-size: 18px; margin-top: 20px; }
}

/* ---------- Sheet: link to a client and session ---------- */
/* the shell's sticky footer stops 20px above the sheet edge (the body padding); pin it to the very edge so nothing shows through */
.sheet--noteLink .sheet__foot { bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); }
.sheet--noteLink .nb-search { position: relative; }
.sheet--noteLink .nb-search > .ico {
  position: absolute;
  inset-inline-start: 16px;
  top: 14px;
  width: 20px;
  height: 20px;
  color: var(--mf-text-muted);
  pointer-events: none;
}
.sheet--noteLink .nb-search input[type="search"] { padding-inline-start: 46px; }

.sheet--noteLink .nb-picks { display: flex; flex-direction: column; margin-top: -8px; }
.sheet--noteLink .nb-pick {
  align-items: center;
  min-height: 52px;
  padding: 0;
  border-bottom: 1px solid var(--mf-border-subtle);
}
.sheet--noteLink .nb-pick:last-of-type { border-bottom: 0; }
.sheet--noteLink .nb-pick input { margin: 0; }
.sheet--noteLink .nb-pick:has(input:checked) > span { font-weight: 600; }
.sheet--noteLink .nb-none { margin: 0; font-size: 16px; line-height: 24px; color: var(--mf-text-muted); }

.sheet--noteLink .nb-sessions { display: flex; flex-direction: column; gap: 8px; }
.sheet--noteLink .nb-label { font-size: 14px; line-height: 21px; font-weight: 600; color: var(--mf-text-muted); }
.sheet--noteLink .nb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet--noteLink .nb-chips .chip-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 14px;
  border-radius: var(--radius);
  font-weight: 600;
}
.sheet--noteLink .nb-chips .chip-btn[data-held="0"]:not([aria-pressed="true"]) { border-style: dashed; color: var(--mf-text-muted); }

/* ---------- Sheet: browse ---------- */
.sheet--notebookBrowse .nb-filters { display: flex; flex-direction: column; gap: 12px; }
.sheet--notebookBrowse .nb-filters__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
/* the shell's .field input rule (background shorthand + padding) wins over its .field select rule: restore the chevron and its 44px inset here */
.sheet--notebookBrowse .nb-filters .field select {
  text-overflow: ellipsis;
  padding-inline-end: 44px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%235B655E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat: no-repeat;
  background-size: 20px 20px;
  background-position: left 16px center;
}
.sheet--notebookBrowse .seg > button { min-height: 44px; }
.sheet--notebookBrowse .nb-list { margin-inline: -12px; margin-top: -8px; }
.sheet--notebookBrowse .nb-list .row { min-height: 64px; padding-inline: 12px; }
.sheet--notebookBrowse .nb-list .row[aria-current="true"] { background: var(--mf-surface-sunken); }
.sheet--notebookBrowse .nb-ell { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; }
.sheet--notebookBrowse .empty { padding: 8px 0; }

/* ---- 61-tour.css ---- */
/* ==========================================================================
   61-tour.css · the PRESENTATION layer (only in `node build.js --presentation`)
   Tokens from 00-base.css only; sizes 14/16/18/28, except the opening wordmark.
   ========================================================================== */

/* the prototype's own tools (device toggle, screen map, reset) are not part of the walkthrough */
:root { --proto-bar-h: 0px; }
/* one-screen page inside the viewer's safe-area padding: height 100%, not 100vh */
html, body { height: 100%; }
html { box-sizing: border-box; }
.proto { height: 100%; }
.proto__bar, .screenmap { display: none !important; }

/* the walkthrough bar sits UNDER the app (never over it), so no screen button is ever covered */
.tour-device { display: flex; flex-direction: column; }
.tour-device > .app { flex: 1 1 0; height: auto; min-height: 0; }

.tour-bar {
  flex: none; position: relative; z-index: 30;
  padding: 10px var(--mf-gutter);
  background: var(--mf-surface); border-top: 1px solid var(--mf-border-subtle); box-shadow: var(--mf-shadow-overlay);
}
.tour-bar[hidden], .tour-layer[hidden] { display: none !important; }
.tour-bar__in { display: grid; gap: 6px; max-width: 720px; margin-inline: auto; }
.tour-bar__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tour-bar__main { display: flex; align-items: center; gap: 8px; }
.tour-cap { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 18px; line-height: 27px; font-weight: 700; color: var(--mf-text); }
.tour-prev { flex: none; padding-inline: 8px; }
.tour-next { flex: none; min-width: 88px; }
.tour-extra { margin: 0; font-size: 14px; line-height: 21px; color: var(--mf-text-muted); }

.tour-tag { padding: 0 10px; border-radius: 999px; font-size: 14px; line-height: 24px; font-weight: 600; white-space: nowrap; }
.tour-tag--lead { background: var(--mf-warning-soft); color: var(--mf-warning-text); }
.tour-tag--coach { background: var(--mf-primary-tint); color: var(--mf-primary-strong); }
.tour-tag--client { background: var(--mf-highlight-soft); color: var(--mf-highlight-text); }

.tour-dots { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tour-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--mf-border-hover); }
.tour-dot.is-done { background: var(--mf-primary); }
.tour-dot.is-current { width: 20px; background: var(--mf-primary-strong); }

/* a quiet pulse on the one thing worth tapping (no text) */
.tour-pulse { outline: 3px solid var(--mf-primary); outline-offset: 2px; animation: tour-pulse 1.6s ease-in-out infinite; }
@keyframes tour-pulse {
  0%, 100% { outline-color: var(--mf-primary); outline-offset: 2px; }
  50% { outline-color: transparent; outline-offset: 7px; }
}
@media (prefers-reduced-motion: reduce) { .tour-pulse { animation: none; } }

/* opening and closing: a layer over the whole app */
.proto[data-mode="phone"] .tour-layer, .proto[data-mode="real"] .tour-layer { scrollbar-width: none; }
.proto[data-mode="phone"] .tour-layer::-webkit-scrollbar, .proto[data-mode="real"] .tour-layer::-webkit-scrollbar { display: none; }
.tour-layer { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; overflow-y: auto; background: var(--mf-bg); }
.tour-open { margin: auto; display: grid; justify-items: center; gap: 48px; padding: 32px var(--mf-gutter); text-align: center; }
.tour-open__name { margin: 0; font: 500 56px/1.2 var(--font-display); font-synthesis: none; color: var(--mf-text); }
.tour-open__go { min-width: 200px; }

.tour-close { width: 100%; max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; padding: 8px var(--mf-gutter) 40px; }
.tour-close__top { display: flex; align-items: center; margin-inline: -12px; }
.tour-tile .tc { flex: none; }
.tour-q__list { margin: 0; padding-inline-start: 24px; display: grid; gap: 12px; font-size: 16px; line-height: 24px; }
.tour-sample { margin: 0; }

.tour-shot { margin: 0; display: grid; gap: 8px; }
.tour-shot__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tour-shot__scroll { overflow: auto; border: 1px solid var(--mf-border-subtle); border-radius: var(--radius); background: var(--mf-surface); }
.tour-shot__scroll img { display: block; max-width: none; }
.tour-shot__scroll.is-fit img { width: 100%; height: auto; }

/* things that only help someone who builds the prototype, and the trial note (plans and prices are not part of the walkthrough) */
.cp-proto, .th-coachlink, .cp-back[data-go], .pub-hero__label, .op-trial { display: none !important; }

<div id="proto"></div>
<script>
/* ---- 01-data.js ---- */
/* ===== 01-data.js · window.MD = { seed, helpers } · screen authors: read this block, not the code =====
CALENDAR  Today = Tue 21.10 (MD.TODAY), now = 09:40 (MD.NOW); also in the seed (seed.today, seed.now). Dates are 'D.M' strings, NO leading zeros, no year ('7.10', '16.9'; months >= 6 order as 2025, <= 5 as 2026).
          Times 'HH:MM'. A stamp is 'D.M HH:MM'. Weekday numbers: 0 = Sunday ... 6 = Saturday. MD.seed is plain JSON: null / '' instead of undefined, same keys on every record of a kind.
SEED      MD.seed = { today, now, coach, clients[], leads[], notes[] }   (home tasks are derived: MD.tasks(data); App.state.data is a deep copy of the seed)
coach     { name:'מיכל לוי', gender:'f', email, title, intro, closingNote, pageLink, availability:{open, spots}, contract:{mode:'builtin'|'own', intern, pricePerSession:350, version:'14.10'},
          reviewRhythm, replyDays:3, firstVisit:{login, home, leads, whatsapp, notebook} (true = that first-use tip was not seen yet) }
client    c1..c8 active + c9 finished (אורית שמש). { id, status:'active'|'finished', name, gender:'f'|'m'|'n', phone:'0526481937' (digits; MD.phone formats), pagePin:'1937' (last 4 digits), mode:'zoom'|'inperson', duration:60,
          price:350 (₪ per session), total, schedule:{type:'fixed'|'variable', weekday:0-6|null, time:'10:00', every:1|2|null}, goals:[{id:'c1g1', name}] (c3 has none yet), overarchingGoal:''|null, overarchingSetAt:2|null,
          overarchingShared:false, contract:{status:'signed'|'sent'|null, sentAt:stamp|null, signedAt:stamp|null, typedName:''|null, version:'1.9'|null}, documents:[{id,title,kind:'report'|'summary'|'file',date,meta,sessionN|null}], sessions[] }
session   one per n = 1..total, in order, ALWAYS all keys: { n, date:'D.M'|null, time:'HH:MM'|null, status:'held'|'planned'|'today'|'unscheduled'|'cancelled', paid:bool, topic, feeling, stoppedAt, step (all '' unless held),
          scores:{goalId:1-10|null} (every goal key when held, {} otherwise), summary:'notebook'|'file'|'both'|null, prepNote:'' (+ prepNoteAt:'16.10' or ''), reminded:bool (WhatsApp reminder already sent) }
          'unscheduled' = date/time null (variable schedule: set at the end of the previous session). A 'planned' session dated before today = "awaiting update" (c4 session 4). 'cancelled' = counted, not held (c7 session 2).
          Cards say "מפגש N מתוך total" with N = MD.nextSession(client).n (first session that is not held/cancelled). summary 'notebook'|'both' => a note {clientId, sessionN} exists; 'file'|'both' => a document with that sessionN.
          c1: s1-5 held (s5 unpaid), s6 today 10:00 (prepNote set), s7-10 planned weekly Tue. c2 s7 today 12:30. c3 s1 today 18:00 (first session, no goals), s2 28.10, s3-12 unscheduled. c4 s4 awaiting update.
lead      { id:'l1'..'l15', name (FULL name; MD.shortName -> "הדס פ."), phone:'05..'|null (אסף דגן has none), source:'אינסטגרם'|'פייסבוק'|'וואטסאפ'|'קוד QR'|'הקישור לעמוד'|'ידנית' (card: "דרך "+source), createdAt:stamp,
          stage, answers:{why, mode:'zoom'|'inperson'|'both', times, address:'f'|'m'|'n', how, before}, callAt:stamp|null, callSummary:'' (coach words), returning:bool, priv:'' (private note),
          always-present extras: returningNote:'', invitedAt:'D.M'|null, stageAt:'D.M'|null (entered current stage), reminders:[{id,date,text,done}], waAt:stamp|null (WhatsApp chat opened), clientId:'c3'|null, closedReason:'' }
          stages: new(5, incl. returning ליאת נחום) fit(3) call_booked(1: שירה גל, call today 17:00) after_call(1) thinking(1: אורית לביא, reminder due today) waitlist(2) not_fit(1) started(1, clientId c3).

var tickTimer = null;
