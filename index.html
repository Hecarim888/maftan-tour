function startTick() {
  stopTick();
  var s = lg();
  if (s.step !== 2 || leftSecs(s) <= 0) return;
  tickTimer = setInterval(function () {
    var h = byId('lg-help'), st = lg();
    if (!h || st.step !== 2) { stopTick(); return; }
    var left = leftSecs(st);
    if (left <= 0) { h.innerHTML = resendHTML(0); stopTick(); return; }
    var cd = h.querySelector('[data-cd]');
    if (cd) cd.textContent = fmtCountdown(left);
  }, 1000);
}

}

/* validates, then writes coach.contract; returns false (with a toast) when it cannot save */
function commitContract() {
  var d = contractDraft(), c = coach(), prev = c.contract || {};
  if (d.edit) {
    var n = parsePrice(d.priceInput);
    if (n == null) { App.toast('להזין מחיר תקין למפגש', { error: true }); return false; }
    d.price = n; d.edit = false;
  }
  if (d.mode === 'own' && !d.file) { App.toast('לבחור קובץ חוזה, או לעבור להסכם המובנה', { error: true }); return false; }
  var file = d.mode === 'own' ? d.file : '';
  var changed = prev.mode !== d.mode || !!prev.intern !== d.intern || prev.pricePerSession !== d.price || (prev.fileName || '') !== file;
  c.contract = {
    mode: d.mode, intern: d.intern, pricePerSession: d.price,
    version: changed ? today() : (prev.version || today()),
    fileName: file
  };
  return true;
}

    u.decided[l.id] = 'started';
    App.toast('ההחלטה נשמרה');
    return;
  }
  var added = false;
  if (v === 'thinking' && l.stage !== 'thinking') {
    var text = 'לחזור אל ' + MD.firstName(l.name);
    [3, 10].forEach(function (n) {
      var d = MD.addDays(MD.TODAY, n);
      var has = (l.reminders || []).some(function (r) { return r.date === d && r.text === text; });
      if (!has) { l.reminders.push({ id: MD.id('r'), date: d, text: text, done: false }); added = true; }
    });
  }
  Actions.setLeadStage({ id: l.id, stage: v, reason: v === 'not_fit' ? String(u.reason[l.id] || '').trim() : undefined });
  delete u.decision[l.id];
  delete u.decided[l.id];
  App.toast(added ? 'ההחלטה נשמרה · נוספו 2 תזכורות' : 'ההחלטה נשמרה');
};

Actions.leadUndecide = function (ds) {

};

Actions.leadSetCall = function (ds, el) {
  var l = getLead(ds.id);

};

Actions.leadAddReminder = function (ds) {
  var l = getLead(ds.id);
  if (!l) return false;
  var u = U(), text = String(u.newRem.text || '').trim();
  if (!text) { App.toast('צריך לכתוב תזכורת', { error: true }); return false; }
  var when = u.newRem.when || MD.addDays(MD.TODAY, 1);
  l.reminders.push({ id: MD.id('r'), date: when, text: text, done: false });
  u.newRem = {};
};

Actions.leadReminder = function (ds, el) {

/* ================================================================ SCREEN */

function isOpen(l, key) {

}

function stageIndex(stage) {
  if (stage === 'new' || stage === 'fit') return 1;

  return 4;
}

function pathHTML(l) {
  var g = gOf(l), cur = stageIndex(l.stage);

  var subs = [
    dayLabel(sdate(l.createdAt)),
    cur > 1 ? dayLabel(l.invitedAt) : cur === 1 ? 'עכשיו' : '',
    cur > 2 ? dayLabel(sdate(l.callAt)) : cur === 2 ? 'עכשיו' : '',

      '<span class="lead-path__label">' + esc(labels[i]) + (state === 'done' ? '<span class="sr-only"> (הושלם)</span>' : '') + '</span>' +

/* ---- wide layout: the leads board is the page, the details are a 480px drawer (no scrim) on the inline-end side ----
   Both are always rendered when window.LeadsBoard exists; CSS (container query on `app`) decides: on a phone the board is
   hidden and the details are the full screen, so toggling phone/desktop in the chrome needs no re-render. */
var drawerKeep = { id: '', top: 0 };   /* drawer scroll to restore after a re-render of the same lead */
var pageKeep = null;                    /* board scroll to keep when moving between leads / lead */
var revealed = '';                      /* lead whose board card was already scrolled into view */

    '<div class="screen screen--lead screen--lead-drawer">' + backLink() + headHTML(l, true) + focusHTML(l) + knownHTML(l) + '</div></aside></div>';

function scrollerOf(main) { return main && main.parentElement; }

Screens.add('lead', {
  title: 'פרטי פנייה',
  group: GROUP,
  order: 410,
  nav: 'leads',
  side: 'coach',
  params: { id: 'l9' },
  render: function (params) {
    var l = getLead(params.id);
    if (!l) return notFoundHTML();
    var board = window.LeadsBoard && typeof window.LeadsBoard.html === 'function';
    if (!board) {
      return '<div class="screen screen--lead">' + backLink() + headHTML(l) + focusHTML(l) + knownHTML(l) + '</div>';
    }
    /* remember what the user was looking at, before the DOM is replaced */
    var old = document.querySelector('.lead-drawer'), sc = scrollerOf(document.querySelector('.app__main'));
    drawerKeep = { id: l.id, top: old && old.getAttribute('data-lead') === l.id ? old.scrollTop : 0 };
    var prev = document.querySelector('.app') && document.querySelector('.app').getAttribute('data-screen');
    pageKeep = sc && (prev === 'lead' || prev === 'leads') ? sc.scrollTop : null;
    if (prev !== 'lead') revealed = '';
    var markup = '';
    try { markup = window.LeadsBoard.html({ selectedId: l.id }); } catch (e) { markup = ''; }
    if (!markup) return '<div class="screen screen--lead">' + backLink() + headHTML(l) + focusHTML(l) + knownHTML(l) + '</div>';
    return '<div class="lead-split">' + drawerHTML(l) + '<div class="lead-split__board">' + markup + '</div></div>';
  },
  after: function (params, main) {
    var l = getLead(params.id);
    if (!l) return;
    var drawer = main.querySelector('.lead-drawer');
    if (drawer) {
      drawer.scrollTop = drawerKeep.id === l.id ? drawerKeep.top : 0;

      return '<button type="button" role="radio" aria-checked="' + (String(curVal) === String(o[0])) + '" data-act="processSet" data-k="' + key + '" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>' + (hint || '') + '</div>';
}

function stepOne(S) {
  var err = S.err || {};
  var lead = S.leadId ? MD.lead(App.data, S.leadId) : null;
  var hint = '';
  if (lead && S.formMode) {
    hint = '<p class="field__hint">' + esc(MD.firstName(lead.name) + ' ' + MD.byGender(S.address, 'כתבה', 'כתב', 'כתב/ה') + ' בטופס: ' + MD.modeLabel(S.formMode)) + '</p>';
  }
  return '<h1 class="page-title" tabindex="-1">למי פותחים את התהליך?</h1>' +
    '<div class="op-fields">' +
    '<div class="field"><label for="op-name">שם מלא</label>' +
    '<input id="op-name" type="text" autocomplete="off" value="' + esc(S.name) + '" data-bind="openProcess.name"' + (err.name ? ' aria-invalid="true" aria-describedby="op-name-err"' : '') + '>' +
    (err.name ? '<p class="field__error" id="op-name-err">' + esc(err.name) + '</p>' : '') + '</div>' +
    '<div class="field"><label for="op-phone">טלפון</label>' +
    '<input id="op-phone" type="tel" inputmode="tel" autocomplete="off" dir="ltr" value="' + esc(S.phone) + '" data-bind="openProcess.phone"></div>' +
    segHTML('לשון פנייה', 'address', ADDRESS, S.address) +
    segHTML('איך נפגשים?', 'mode', MODES, S.mode, hint) +
    '</div>';
}

function stepTwo(S) {
  return '<h1 class="page-title" tabindex="-1">איך ייראה התהליך?</h1>' +
    '<div class="op-fields">' +
    '<div class="field"><label for="op-total">מספר מפגשים</label>' +
    '<div class="op-stepper">' +
    '<button type="button" class="op-stepper__btn" aria-label="מפגש אחד פחות" data-act="processStep" data-d="-1">' + icon('minus') + '</button>' +
    '<input id="op-total" type="text" inputmode="numeric" autocomplete="off" value="' + esc(S.total) + '" data-bind="openProcess.total">' +
    '<button type="button" class="op-stepper__btn" aria-label="מפגש אחד יותר" data-act="processStep" data-d="1">' + icon('plus') + '</button>' +
    '</div></div>' +
    segHTML('משך מפגש', 'duration', DURATIONS, S.duration) +
    '<div class="field"><label for="op-price">מחיר למפגש</label>' +
    '<div class="op-money"><input id="op-price" type="text" inputmode="numeric" autocomplete="off" value="' + esc(S.price) + '" data-bind="openProcess.price">' +
    '<span aria-hidden="true">₪</span></div></div>' +
    '</div>';
}

/* the ONE live preview of the flow: home-card circles on a draft sessions array */
function previewHTML(S) {
  var ss = makeSessions(S), n = ss.length, line;
  var first = ss[0] && ss[0].date;
  var last = ss[n - 1] && ss[n - 1].date;
  if (S.type === 'variable') line = sessionsWord(n) + (first ? ' · מ-' + first : '');
  else line = sessionsWord(n) + ' · ' + first + (n > 1 && last ? '–' + last : '');
  var track = App.track(ss, {
    client: { id: '', name: S.name, total: n }, key: 'op-draft', current: 1, total: n, compact: true,
    label: 'המפגשים של ' + (MD.firstName(S.name) || 'התהליך')
  });
  /* the draft circles are not links */
  track = track.replace(/<button type="button" class="track__btn" data-sheet="session" data-client="[^"]*" data-n="\d+" aria-label="([^"]*)">([\s\S]*?)<\/button>/g,
    '<span class="track__btn" role="img" aria-label="$1">$2</span>');
  return '<div class="card op-preview"><p class="op-preview__line">' + esc(line) + '</p>' + track + '</div>';
}

function stepThree(S) {
  var err = S.err || {};
  var h = '<h1 class="page-title" tabindex="-1">מתי נפגשים?</h1><div class="op-fields">' +
    segHTML('איך קובעים מועדים?', 'type', [['fixed', 'מועד קבוע'], ['variable', 'מועדים משתנים']], S.type);
  if (S.type === 'fixed') {
    var first = fixedFirst(S);
    h += '<div class="op-pair">' +
      '<div class="field"><label for="op-day">יום בשבוע</label><select id="op-day" data-act="processWeekday">' +
      [0, 1, 2, 3, 4, 5, 6].map(function (w) {
        return '<option value="' + w + '"' + (w === Number(S.weekday) ? ' selected' : '') + '>' + esc(MD.weekdayName(w)) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label for="op-time">שעה</label><input id="op-time" type="time" dir="ltr" value="' + esc(S.time) + '" data-bind="openProcess.time" data-rerender></div>' +
      '</div>' +
      segHTML('תדירות', 'every', [[1, 'כל שבוע'], [2, 'כל שבועיים']], S.every);
    if (S.editFirst) {
      h += '<div class="field"><label for="op-first">המפגש הראשון</label>' +
        '<input id="op-first" type="date" dir="ltr" value="' + esc(isoOf(first)) + '" min="' + esc(isoOf(MD.TODAY)) + '" data-act="processFirstDate"></div>';
    } else {
      h += '<div class="op-first"><span class="op-first__ico" aria-hidden="true">' + icon('calendar') + '</span>' +
        '<div class="op-first__text"><p class="op-first__k">המפגש הראשון</p><p class="op-first__v">' + esc(MD.dayName(first) + ' ' + first + ' · ' + S.time) + '</p></div>' +
        '<button type="button" class="btn btn--quiet btn--sm" data-act="processEditFirst" aria-label="שינוי המפגש הראשון">שינוי</button></div>';
    }
  } else {
    var rows = S.rows || [];
    h += '<div class="op-dates">';
    rows.forEach(function (r, i) {
      var word = ROW_WORD[i] || String(i + 1);
      var bad = i === 0 && err.date;
      h += '<div class="op-date-row">' +
        '<div class="field op-date-row__d"><label for="op-d' + i + '">המפגש ' + word + '</label>' +
        '<input id="op-d' + i + '" type="date" dir="ltr" value="' + esc(r.iso) + '" min="' + esc(isoOf(MD.TODAY)) + '" data-bind="openProcess.rows.' + i + '.iso" data-rerender' +
        (bad ? ' aria-invalid="true" aria-describedby="op-d0-err"' : '') + '>' +
        (bad ? '<p class="field__error" id="op-d0-err">' + esc(err.date) + '</p>' : '') + '</div>' +
        '<div class="field op-date-row__t"><label for="op-t' + i + '">שעה</label>' +
        '<input id="op-t' + i + '" type="time" dir="ltr" value="' + esc(r.time) + '" data-bind="openProcess.rows.' + i + '.time" data-rerender></div>' +
        (i > 0
          ? '<button type="button" class="icon-btn op-date-row__x" aria-label="הסרת המפגש ' + word + '" data-act="processRemoveRow" data-i="' + i + '">' + icon('close') + '</button>'
          : '<span class="op-date-row__x" aria-hidden="true"></span>') +
        '</div>';
    });
    if (rows.length < Math.min(MAX_ROWS, totalOf(S))) {
      h += '<button type="button" class="btn btn--quiet op-add" data-act="processAddRow">' + icon('plus') + 'עוד מועד</button>';
    }
    h += '</div><p class="op-note">את המפגשים הבאים קובעים בסוף כל מפגש.</p>';
  }
  return h + previewHTML(S) + '</div>';
}

function trialInfo() {
  var count = MD.activeClients(App.data).length;
  if (count < TRIAL_AT) return null;
  var n = count + 1;
  return { n: n, name: ORDINAL[n] ? 'התהליך ' + ORDINAL[n] : 'התהליך ה-' + n };
}

function summaryRow(label, value, sub, step) {
  return '<div class="row op-sum"><span class="row__main"><span class="row__meta">' + esc(label) + '</span>' +
    '<span class="row__title">' + value + '</span>' + (sub ? '<span class="row__meta">' + esc(sub) + '</span>' : '') + '</span>' +
    '<button type="button" class="btn btn--quiet btn--sm" data-act="processGoStep" data-step="' + step + '" aria-label="עריכה: ' + esc(label) + '">עריכה</button></div>';
}

function stepFour(S) {
  var n = totalOf(S), trial = trialInfo(), sched = schedText(S);
  var who = esc(S.name.trim()) + (digits(S.phone) ? ' · <bdi dir="ltr">' + esc(MD.phone(digits(S.phone))) + '</bdi>' : '');
  return '<h1 class="page-title" tabindex="-1">הכול מוכן לפתיחה</h1>' +
    '<div class="rows">' +
    summaryRow('פרטים', who, 'לשון ' + labelOf(ADDRESS, S.address) + ' · ' + labelOf(MODES, S.mode), 1) +
    summaryRow('התהליך', esc(sessionsWord(n) + ' · ' + MD.price(priceOf(S)) + ' למפגש'), S.duration + ' דקות', 2) +
    summaryRow('מועדים', esc(sched[0]), sched[1], 3) +
    '</div>' +
    (trial
      ? '<p class="op-trial"><span>' + esc(trial.name + ': ניסיון חינם ל-14 יום ·') + '</span>' +
        '<button type="button" class="link-btn" data-sheet="processTrial">פרטים</button></p>'
      : '');
}

/* ---------- success ---------- */
function doneHTML(S) {
  var c = getClient(S.clientId);
  if (!c) return '<div class="screen screen--openProcess"><div class="empty"><h2 class="empty__title">התהליך לא נמצא</h2>' +
    '<div class="empty__actions"><button type="button" class="btn btn--secondary" data-go="clients">למתאמנים</button></div></div></div>';
  var nx = MD.nextSession(c), first = nx && nx.date ? nx : null;
  var fn = MD.firstName(c.name);
  var sub = first
    ? 'המפגש הראשון ' + (MD.diffDays(first.date, MD.TODAY) === 0 ? 'היום' : 'ב' + MD.dayName(first.date) + ', ' + first.date) + ' בשעה ' + first.time + '.'
    : 'מועדי המפגשים ייקבעו בסוף כל מפגש.';
  var when = nx && nx.date ? MD.fmtWhen(nx.date, nx.time).replace(' · ', ' ') : 'טרם נקבע';
  var on = !!(c.contract && c.contract.status);
  var priceLine = on ? contractTitle() + ' · ' + MD.price(c.price) + ' למפגש' : MD.price(c.price) + ' למפגש';
  var priceRow = S.editPrice
    ? '<form class="op-contract__edit" id="op-pform"><div class="field"><label for="op-pedit">מחיר למפגש</label>' +
      '<div class="op-money"><input id="op-pedit" type="text" inputmode="numeric" autocomplete="off" value="' + esc(S.priceEdit) + '" data-bind="openProcess.priceEdit"><span aria-hidden="true">₪</span></div></div>' +
      '<button type="submit" class="btn btn--secondary btn--sm" data-act="processPriceSave">שמירה</button></form>'
    : '<div class="op-contract__line"><span>' + esc(priceLine) + '</span>' +
      '<button type="button" class="btn btn--quiet btn--sm" data-act="processPriceEdit" aria-label="עריכה של המחיר למפגש">עריכה</button></div>';
  return '<div class="screen screen--openProcess screen--done">' +
    '<div class="op-bar op-bar--end"><button type="button" class="icon-btn" aria-label="סגירה" data-go="home">' + icon('close') + '</button></div>' +
    '<div class="op-done">' +
    '<span class="op-done__badge" aria-hidden="true">' + icon('check', 28) + '</span>' +
    '<h1 class="page-title" tabindex="-1">התהליך של ' + esc(fn) + ' נפתח</h1>' +
    '<p class="page-sub">' + esc(sub) + '</p></div>' +
    '<article class="card card--stack op-card" aria-label="הכרטיס של ' + esc(fn) + '">' +
    '<div class="op-card__head"><h2>' + esc(c.name) + '</h2>' +
    '<p class="op-card__meta">' + esc('מפגש ' + (nx ? nx.n : 1) + ' מתוך ' + c.total + ' · ' + when) + '</p></div>' +
    App.track(c.sessions, { client: c, compact: true }) + '</article>' +
    '<div class="card op-contract">' +
    '<div class="switch-row"><label class="switch-row__title" for="op-contract">לצרף את החוזה לחתימה</label>' +
    '<button type="button" class="switch" id="op-contract" role="switch" aria-label="לצרף את החוזה לחתימה" aria-checked="' + on + '" data-act="processContract"></button></div>' +
    priceRow + '</div>' +
    '<div class="sticky-actions op-done__actions">' +
    '<button type="button" class="btn btn--primary btn--block" data-sheet="whatsapp" data-client="' + esc(c.id) + '" data-kind="opening">' + icon('whatsapp') + 'וואטסאפ: הודעת פתיחה</button>' +
    '<button type="button" class="op-done__link" data-go="client" data-id="' + esc(c.id) + '">לתיק של ' + esc(fn) + '</button>' +
    '</div></div>';
}

function renderOpenProcess(params) {
  var S = stateFor(params);
  if (S.done) return doneHTML(S);
  var body = S.step === 1 ? stepOne(S) : S.step === 2 ? stepTwo(S) : S.step === 3 ? stepThree(S) : stepFour(S);
  var go = S.step === 4
    ? '<button type="submit" form="op-form" class="btn btn--primary btn--block" data-act="processCreate">פתיחת התהליך</button>'
    : '<button type="submit" form="op-form" class="btn btn--primary btn--block" data-act="processNext">המשך</button>';
  /* web only (CSS): "חזרה" sits next to the primary button, as in the approved web dialog; the phone uses the arrow in the bar */
  var backBtn = S.step > 1 ? '<button type="button" class="btn btn--quiet op-foot-back" data-act="processPrev">חזרה</button>' : '';
  return '<div class="screen screen--openProcess">' + barHTML(S) +
    '<form class="op-body" id="op-form" novalidate aria-labelledby="op-title">' + body + '</form>' +
    '<div class="sticky-actions">' + backBtn + go + '</div></div>';
}

Screens.add('openProcess', {
  title: 'פתיחת תהליך', group: GROUP, order: 500, nav: null, side: 'coach',
  render: renderOpenProcess,
  after: function () {
    var S = App.ui.openProcess;
    if (!S || !S.focusErr) return;
    S.focusErr = false;
    setTimeout(function () {
      var bad = document.querySelector('.screen--openProcess [aria-invalid="true"]');
      if (bad) { try { bad.focus(); } catch (e) { /* ignore */ } }
    }, 0);
  }
});

/* ---------- wizard actions ---------- */
Actions.processSet = function (ds) {
  var S = cur(), k = ds.k, v = ds.v;
  if (['address', 'mode', 'type'].indexOf(k) >= 0) S[k] = v;
  else if (k === 'duration') S.duration = Number(v) || 60;
  else if (k === 'every') S.every = Number(v) === 2 ? 2 : 1;
  S.err = {};
};
Actions.processStep = function (ds) {
  var S = cur();
  S.total = String(clampInt(clampInt(S.total, 1, 30, 10) + (Number(ds.d) || 0), 1, 30, 10));
};
Actions.processWeekday = function (ds, el) {
  var S = cur();
  S.weekday = Number(el.value);
  S.firstDate = null;
};
Actions.processEditFirst = function () { cur().editFirst = true; };
Actions.processFirstDate = function (ds, el) {
  var S = cur(), d = dmOf(el.value);
  if (d) { S.firstDate = d; S.weekday = MD.weekdayOf(d); }
  S.editFirst = false;
};
Actions.processAddRow = function () {
  var S = cur();
  if (S.rows.length >= Math.min(MAX_ROWS, totalOf(S))) return;
  var last = S.rows[S.rows.length - 1];
  S.rows.push({ iso: '', time: (last && last.time) || S.time });
};
Actions.processRemoveRow = function (ds) {
  var S = cur(), i = Number(ds.i);
  if (i > 0 && i < S.rows.length) S.rows.splice(i, 1);
};
Actions.processPrev = function () {
  var S = cur();
  S.err = {};
  S.step = Math.max(1, S.step - 1);
  toTop();
};
Actions.processGoStep = function (ds) {
  var S = cur();
  S.err = {};
  S.step = Math.max(1, Math.min(3, Number(ds.step) || 1));
  toTop();
};
Actions.processNext = function () {
  var S = cur();
  S.err = {};
  if (S.step === 1) {
    if (!String(S.name).trim()) { S.err.name = 'חסר שם'; S.focusErr = true; return; }
  } else if (S.step === 2) {
    S.total = String(totalOf(S));
    S.price = String(priceOf(S));
  } else if (S.step === 3) {
    if (S.type === 'variable' && !varRows(S).length) { S.err.date = 'חסר תאריך למפגש הראשון'; S.focusErr = true; return; }
  }
  S.step = Math.min(4, S.step + 1);
  toTop();
};

Actions.processCreate = function () {
  var S = cur(), data = App.data;
  if (S.clientId) return;
  if (!String(S.name).trim()) { S.step = 1; S.err = { name: 'חסר שם' }; S.focusErr = true; return; }
  var co = data.coach || (data.coach = {});
  var id = MD.id('c');
  var ss = makeSessions(S);
  var fixed = S.type === 'fixed';
  var firstRow = varRows(S)[0];
  var ph = digits(S.phone);
  var pin = ph.length >= 4 ? ph.slice(-4) : String(1000 + (Math.abs(parseInt(digits(id) || '7', 10)) % 9000));
  var client = {
    id: id, status: 'active', name: String(S.name).trim(), gender: S.address, phone: ph, pagePin: pin,
    mode: S.mode, duration: Number(S.duration) || 60, price: priceOf(S), total: ss.length,
    schedule: {
      type: fixed ? 'fixed' : 'variable',
      weekday: fixed ? Number(S.weekday) : null,
      time: fixed ? S.time : (firstRow ? firstRow.time : S.time),
      every: fixed ? (Number(S.every) === 2 ? 2 : 1) : null
    },
    goals: [], overarchingGoal: null, overarchingSetAt: null, overarchingShared: false,
    contract: sentContract(), documents: [], sessions: ss
  };
  data.clients.push(client);
  var lead = S.leadId ? MD.lead(data, S.leadId) : null;
  if (lead) { lead.stage = 'started'; lead.stageAt = MD.TODAY; lead.clientId = id; }
  var av = co.availability || (co.availability = { open: true, spots: 0 });
  av.spots = Math.max(0, (Number(av.spots) || 0) - 1);
  if (av.spots === 0) av.open = false;
  S.done = true;
  S.clientId = id;
  S.editPrice = false;
  App.replace('openProcess', S.leadId ? { lead: S.leadId, client: id } : { client: id });
  toTop();
};

Actions.processContract = function () {
  var S = cur(), c = getClient(S.clientId);
  if (!c) return;
  if (c.contract && c.contract.status) {
    if (c.contract.status === 'signed') return;
    c.contract = emptyContract();
  } else {
    c.contract = sentContract();
  }
};
Actions.processPriceEdit = function () {
  var S = cur(), c = getClient(S.clientId);
  if (!c) return;
  S.editPrice = true;
  S.priceEdit = String(c.price);
};
Actions.processPriceSave = function () {
  var S = cur(), c = getClient(S.clientId);
  if (!c) return;
  var p = parseInt(digits(S.priceEdit), 10);
  if (p > 0) { c.price = p; App.toast('המחיר עודכן'); }
  S.editPrice = false;
};

/* ---------- private sheet: trial note ---------- */
Sheets.add('processTrial', {
  web: 'dialog',
  title: 'ניסיון חינם ל-14 יום',
  render: function () {
    var t = trialInfo();
    return '<div class="stack">' +
      '<p>' + esc((t ? t.name : 'התהליך הבא') + ' מתחיל ניסיון של 14 יום במסלול המקצועי, בלי כרטיס אשראי.') + '</p>' +
      '<p>בסוף הניסיון אפשר לשדרג. בלי שדרוג, כל המתאמנים נשארים זמינים, ורק פתיחת תהליך חדש תיחסם.</p></div>' +
      '<div class="sheet__foot"><button type="button" class="btn btn--primary" data-close-sheet>הבנתי</button></div>';
  }
});

/* ====================================================================
   client: the client file
   ==================================================================== */
var TABS = [['process', 'תהליך'], ['docs', 'מסמכים'], ['page', 'הדף האישי'], ['details', 'פרטים']];

function normTab(t) {
  for (var i = 0; i < TABS.length; i++) if (TABS[i][0] === t) return t;
  return 'process';
}

function headLine(c) {
  if (c.status === 'finished') return 'התהליך הסתיים · ' + sessionsWord(MD.heldCount(c));
  var nx = MD.nextSession(c);
  if (!nx) return 'כל ' + c.total + ' המפגשים התקיימו';
  var base = 'מפגש ' + nx.n + ' מתוך ' + c.total;
  if (!nx.date) return base + ' · הבא טרם נקבע';
  var dd = MD.diffDays(nx.date, MD.TODAY);
  if (nx.status === 'planned' && dd < 0) return base + ' · ממתין לעדכון';
  var when = dd === 0 ? 'היום' : dd === 1 ? 'מחר' : (dd > 1 && dd < 7) ? 'ב' + MD.dayName(nx.date) : 'ב-' + nx.date;
  return base + ' · הבא ' + when + (nx.time ? ' ב-' + nx.time : '');
}

function goalsHTML(c) {
  var og = c.overarchingGoal;
  var h = '<section class="pc-goals" aria-label="מטרות"><div class="pc-og"><div class="pc-og__head"><h2 class="pc-kicker">מטרת על</h2>' +
    '<button type="button" class="pc-edit" data-act="processEditGoal" data-sheet="processGoal" data-client="' + esc(c.id) + '" aria-label="' + (og ? 'עריכה של מטרת העל' : 'הוספת מטרת על') + '">' + (og ? 'עריכה' : 'הוספה') + '</button></div>';
  if (og) {
    h += '<p class="pc-og__text" dir="auto">' + esc(og) + '</p>';
    if (c.overarchingSetAt) h += '<p class="pc-og__meta">נקבעה במפגש ' + esc(c.overarchingSetAt) + '</p>';
  } else {
    h += '<p class="pc-og__empty">עוד לא נקבעה</p>';
  }
  h += '</div>';
  if (c.goals && c.goals.length) {
    h += '<ul class="pc-goals__list" aria-label="מטרות אימוניות">' + c.goals.map(function (g) {

  circleCheck: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  circleX: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
  userX: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/>',
  calClock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4M8 2v4M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
  calBack: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M15 16H9M11 14l-2 2 2 2"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'
};
function svg(name, size) {
  var s = size || 20;
  return '<svg class="ico ico--' + name + '" aria-hidden="true" focusable="false" width="' + s + '" height="' + s +
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + SVG[name] + '</svg>';
}

/* dates: MD keeps 'D.M' without a year (months 6-12 = 2025, 1-5 = 2026); the date input needs an ISO value */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function toIso(d) {
  var m = /^(\d{1,2})\.(\d{1,2})/.exec(String(d || ''));
  return m ? (+m[2] >= 6 ? 2025 : 2026) + '-' + pad2(+m[2]) + '-' + pad2(+m[1]) : '';
}
function fromIso(v) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
  if (!m) return '';
  var mo = +m[2];
  return +m[1] === (mo >= 6 ? 2025 : 2026) ? (+m[3]) + '.' + mo : '';
}
var MAX_ISO = '2026-05-31';

/* time + mode line: terracotta chip only for today */
function whenHTML(c, s) {
  if (!s.date) return '<span class="ses-when">טרם נקבע מועד</span>';
  var t = MD.fmtWhen(s.date, s.time);
  var mode = modeText(c);
  var first = isToday(s) ? '<span class="chip chip--today">' + esc(t) + '</span>' : '<span class="ses-when">' + esc(t) + '</span>';
  var second = isLive(c, s.n) ? 'מתקיים עכשיו' + (mode ? ' · ' + mode : '') : mode;
  return first + (second ? '<span class="ses-when ses-when--muted">' + esc(second) + '</span>' : '');
}

function topBar(title) {
  return '<div class="ses-top">' +
    '<button type="button" class="icon-btn" data-back aria-label="חזרה">' + ic('back') + '</button>' +
    '<p class="ses-top__title">' + esc(title) + '</p>' +
    App.lock('פרטי') +
    '</div>';
}

function missing(cls) {
  return '<div class="screen ' + cls + ' screen--reading">' +
    '<div class="ses-top"><button type="button" class="icon-btn" data-back aria-label="חזרה">' + ic('back') + '</button></div>' +
    '<div class="empty"><span class="empty__icon">' + ic('file') + '</span><h2 class="empty__title">המפגש לא נמצא</h2></div></div>';
}

/* ---------------------------------------------------------------- thread (shared) */
function threadHTML(s, cls) {
  var rows = [['הנושא המרכזי', s.topic], ['איך זה הרגיש', s.feeling], ['איפה עצרנו', s.stoppedAt]];
  var h = '';
  rows.forEach(function (r) {
    if (!r[1]) return;
    h += '<div class="ses-item"><dt class="ses-label">' + r[0] + '</dt><dd class="ses-text" dir="auto">' + esc(r[1]) + '</dd></div>';
  });
  if (s.step) {
    h += '<div class="ses-item"><dt class="sr-only">הצעד הקטן</dt><dd class="ses-step"><div class="step-line">' +
      ic('step', 16) + '<p dir="auto">' + esc(s.step) + '</p></div></dd></div>';
  }
  return h ? '<dl class="ses-thread' + (cls ? ' ' + cls : '') + '">' + h + '</dl>' : '';
}

/* ---------------------------------------------------------------- prep note editing (shared) */
function editing(c, s, where) {
  var e = st().edit;
  return !!(e && e.where === where && e.client === c.id && String(e.n) === String(s.n));
}
function editBlock(c, s, labelId, where, withHead) {
  var d = st().draft || '';
  var h = '<div class="ses-edit">';
  if (withHead) h += '<div class="ses-edit__head"><h3 id="' + labelId + '">לזכור במפגש הזה</h3>' + App.lock('פרטי') + '</div>';
  h += '<textarea class="input ses-edit__ta" id="ses-ta-' + where + '" data-bind="sessions.draft" maxlength="' + MAX_NOTE + '" rows="3" dir="auto" aria-labelledby="' + labelId +
    '" placeholder="מה חשוב לי לזכור במפגש הזה?">' + esc(d) + '</textarea>' +
    '<div class="ses-edit__bar">' +
    '<button type="button" class="btn btn--primary btn--sm" data-act="sesPrepSave" ' + at(c, s) + '>שמירה</button>' +
    '<button type="button" class="btn btn--quiet btn--sm" data-act="sesPrepCancel">ביטול</button>' +
    '<span class="ses-count">' + d.length + '/' + MAX_NOTE + '</span></div></div>';
  return h;
}
/* after every render: focus a freshly opened editor and keep the counter live */
function afterEdit(root) {
  if (!root) return;
  var ta = root.querySelector('textarea[data-bind="sessions.draft"]');
  if (!ta) return;
  var out = root.querySelector('.ses-count');
  if (out) {
    var upd = function () { out.textContent = ta.value.length + '/' + MAX_NOTE; };
    ta.addEventListener('input', upd);
    upd();
  }
  var s = st();
  if (s.focus) {
    s.focus = false;
    setTimeout(function () {
      if (!ta.isConnected) return;
      try { ta.focus(); var l = ta.value.length; ta.setSelectionRange(l, l); } catch (e) { /* ignore */ }
    }, 0);
  }
}

/* ================================================================== BRIEF */
function unpaidChip(c) {
  var list = c.sessions.filter(function (x) { return x.status === 'held' && !x.paid; });
  if (!list.length) return '';
  var label = list.length === 1 ? 'מפגש ' + list[0].n + ' לא שולם' : list.length + ' מפגשים לא שולמו';
  return '<button type="button" class="chip chip--warn ses-chipbtn" data-sheet="session" data-client="' + esc(c.id) + '" data-n="' + list[0].n + '">' + esc(label) + '</button>';
}

function briefPrep(c, s) {
  var id = 'ses-prep-brief';
  var e = editing(c, s, 'brief');
  var h = '<section class="ses-sec" aria-labelledby="' + id + '"><div class="ses-sec__head"><h2 id="' + id + '">לזכור במפגש הזה</h2>';
  if (!e && s.prepNote) {
    h += '<button type="button" class="btn btn--quiet btn--sm" data-act="sesPrepEdit" data-where="brief" ' + at(c, s) + '>' + ic('edit', 16) + 'עריכה</button>';
  }
  h += '</div>';
  if (e) {
    h += editBlock(c, s, id, 'brief', false);
  } else if (s.prepNote) {
    h += '<p class="ses-text ses-text--note" dir="auto">' + esc(s.prepNote) + '</p>';
    if (s.prepNoteAt) h += '<p class="ses-sm">נכתב ' + esc(MD.fmtDate(s.prepNoteAt)) + '</p>';
  } else {
    h += '<div><button type="button" class="btn btn--secondary btn--sm" data-act="sesPrepEdit" data-where="brief" ' + at(c, s) + '>' + ic('plus', 16) + 'הוספת הערה</button></div>';
  }
  return h + '</section>';
}

function progText(c, g) {
  var p = MD.goalProgress(c, g.id);
  if (p.from == null) return '';
  if (p.scores.length < 2 || p.from === p.to) return 'ציון ' + p.to;
  return 'מ-' + p.from + ' ל-' + p.to;
}
function briefGoals(c) {
  if (!c.overarchingGoal && !(c.goals && c.goals.length)) return '';
  var h = '<section class="ses-sec ses-sec--list" aria-label="מטרות">';
  if (c.overarchingGoal) {
    h += '<div class="ses-item"><p class="ses-label">מטרת על</p><p class="ses-text" dir="auto">' + esc(c.overarchingGoal) + '</p></div>';
  }
  if (c.goals && c.goals.length) {
    h += '<div class="ses-item"><p class="ses-label">מטרות אימוניות</p><ul class="ses-goals" role="list">';
    c.goals.forEach(function (g) {
      var pt = progText(c, g);
      h += '<li class="ses-goal"><span class="ses-goal__name">' + esc(g.name) + '</span>' + (pt ? '<span class="ses-goal__prog"> · ' + esc(pt) + '</span>' : '') + '</li>';
    });
    h += '</ul></div>';
  }
  return h + '</section>';
}

function briefPrev(c, s, prev) {
  var h = '<section class="ses-sec ses-sec--list" aria-labelledby="ses-prev-h"><div class="ses-sec__head"><h2 id="ses-prev-h">מהמפגש הקודם</h2>' +
    (prev.date ? '<span class="ses-sm">' + esc(prev.date) + '</span>' : '') + '</div>';
  h += threadHTML(prev, '');
  h += '<div class="ses-links">' +
    '<button type="button" class="btn btn--quiet btn--sm" data-go="summary" ' + at(c, prev) + '>' + ic('notebook', 20) + 'סיכום מפגש ' + prev.n + '</button>' +
    '<button type="button" class="btn btn--quiet btn--sm" data-go="client" data-id="' + esc(c.id) + '">לכל ההיסטוריה</button></div>';
  return h + '</section>';
}

function briefFirst(c) {
  var lead = (App.data.leads || []).filter(function (l) { return l.clientId === c.id; })[0];
  var h = '<section class="ses-sec ses-sec--list" aria-label="מפגש ראשון">';
  if (lead && lead.callSummary) {
    h += '<div class="ses-item"><p class="ses-label">משיחת ההתאמה</p><p class="ses-text" dir="auto">' + esc(lead.callSummary) + '</p></div>';
  }
  h += '<p class="ses-first">מפגש ראשון · המטרות והצעד הקטן ייקבעו בסופו</p></section>';
  return h;
}

function briefBar(c, s) {
  if (s.status === 'held' || s.status === 'cancelled') return '';
  var a = at(c, s);
  var wa = '<button type="button" class="icon-btn ses-wa" aria-label="וואטסאפ: תזכורת למפגש" data-sheet="whatsapp" data-client="' + esc(c.id) +
    '" data-kind="reminder" data-n="' + s.n + '">' + ic('whatsapp') + '</button>';
  var end = '<button type="button" class="btn btn--primary" data-go="endSession" ' + a + '>סיום מפגש</button>';
  var h = '<div class="sticky-actions">';
  if (isLive(c, s.n)) {
    h += end;
    if (c.mode === 'zoom') h += '<button type="button" class="btn btn--secondary" data-act="sesZoomBack">' + ic('zoom') + 'חזרה לזום</button>';
  } else if (isAwaiting(s)) {
    h += end;
  } else if (c.mode === 'zoom') {
    h += '<button type="button" class="btn btn--primary" data-act="startLive" ' + a + '>' + ic('zoom') + 'כניסה לזום</button>' + (s.date ? wa : '');
  } else {
    h += end + (hasStarted(c, s) || !s.date ? '' : wa);
  }
  return h + '</div>';
}

function briefHTML(p) {
  var c = getClient(p.client);
  if (!c) return missing('screen--brief');
  var n = p.n ? +p.n : nextN(c);
  var s = getSession(c, n);
  if (!s) return missing('screen--brief');
  var e = st().edit;
  if (e && e.where === 'brief' && e.seq !== App._seq) st().edit = null;
  var prev = prevHeld(c, s.n);

  var h = '<div class="screen screen--brief screen--reading">';
  h += topBar('הכנה למפגש');
  h += '<header class="ses-head"><h1 class="page-title">' + esc(c.name) + '</h1>' +
    '<p class="ses-head__sub">מפגש ' + s.n + ' מתוך ' + c.total + '</p>' +
    App.track(c.sessions, { client: c.id, current: s.n }) +
    '<div class="ses-whenrow">' + whenHTML(c, s) + unpaidChip(c) + '</div></header>';
  h += briefPrep(c, s);
  if (prev) {
    h += briefGoals(c);
    h += briefPrev(c, s, prev);
  } else {
    h += briefFirst(c);
  }
  h += briefBar(c, s);
  return h + '</div>';
}

/* ================================================================== SUMMARY */
function summaryHTML(p) {
  var c = getClient(p.client);
  var s = getSession(c, p.n);
  if (!c || !s) return missing('screen--summary');
  var h = '<div class="screen screen--summary screen--reading">';
  h += topBar(c.name);
  h += '<header class="page-head"><h1 class="page-title">סיכום מפגש ' + s.n + '</h1>' +
    (s.date ? '<p class="page-sub">' + esc(MD.fmtDate(s.date)) + '</p>' : '') + '</header>';

  var thread = threadHTML(s, '');
  if (thread) h += '<section class="ses-sec ses-sec--first ses-sec--list" aria-label="החוט מהמפגש">' + thread + '</section>';

  var notes = MD.notesOf(App.data, c.id).filter(function (x) { return x.sessionN != null && +x.sessionN === s.n; });
  h += '<section class="ses-sec ses-sec--list' + (thread ? '' : ' ses-sec--first') + '" aria-labelledby="ses-nb-h"><h2 id="ses-nb-h">במחברת</h2>';
  if (notes.length) {
    notes.forEach(function (nt) {
      h += '<article class="card card--stack ses-note">' + (nt.title && nt.title !== 'סיכום מפגש ' + s.n ? '<h3>' + esc(nt.title) + '</h3>' : '') + '<p class="ses-note__body" dir="auto">' + esc(nt.body) + '</p>' +
        '<div><button type="button" class="btn btn--secondary" data-go="notebook" data-note="' + esc(nt.id) + '">' + ic('notebook') + 'לפתיחה במחברת</button></div></article>';
    });
  } else {
    h += '<div class="empty ses-empty"><span class="empty__icon">' + ic('notebook') + '</span><p class="empty__title">עוד לא נכתב סיכום</p>' +
      '<div class="empty__actions"><button type="button" class="btn btn--secondary" data-go="notebook" ' + at(c, s) + '>' + ic('plus') + 'סיכום במחברת</button></div></div>';
  }
  h += '</section>';

  /* QA: a receipt (kind 'file', added by end of session) is not the session's summary file */
  var docs = (c.documents || []).filter(function (d) { return d.sessionN != null && +d.sessionN === s.n && d.kind !== 'file'; });
  if (docs.length) {
    h += '<div class="rows">';
    docs.forEach(function (d) {
      h += '<button type="button" class="row" data-act="sesFile" data-doc="' + esc(d.id) + '" ' + at(c, s) + '>' +
        '<span class="ses-ico">' + ic('file') + '</span>' +
        '<span class="row__main"><span class="row__title">קובץ סיכום</span>' + (d.meta ? '<span class="row__meta">' + esc(d.meta) + '</span>' : '') + '</span>' +
        '<span class="row__chev">' + ic('download') + '</span></button>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

/* ================================================================== SHEET */
function sheetTitle(p) {
  var c = getClient(p.client);
  return c ? 'מפגש ' + p.n + ' מתוך ' + c.total : 'מפגש';
}

function summaryRow(c, s) {
  var m = s.summary;
  var on = m === 'notebook' || m === 'file' || m === 'both';
  var state = m === 'both' ? 'סוכם במחברת · הועלה קובץ' : m === 'notebook' ? 'סוכם במחברת' : m === 'file' ? 'הועלה קובץ' : 'טרם סוכם';
  return '<div class="rows"><button type="button" class="row ses-sum' + (on ? ' ses-sum--on' : '') + '" data-go="summary" ' + at(c, s) + '>' +
    '<span class="ses-ico">' + ic(on ? 'check' : 'notebook') + '</span>' +
    '<span class="row__main"><span class="row__title">סיכום מפגש ' + s.n + '</span><span class="ses-sum__state">' + state + '</span></span>' +
    '<span class="row__chev">' + ic('chevron') + '</span></button></div>';
}

function scoresHTML(c, s) {
  if (!(c.goals && c.goals.length) || !s.scores) return '';
  var any = c.goals.some(function (g) { return s.scores[g.id] != null; });
  if (!any) return '';
  var h = '<div class="ses-item"><p class="ses-label">מטרות אימוניות</p><ul class="ses-scores" role="list">';
  c.goals.forEach(function (g) {
    var v = s.scores[g.id];
    h += '<li class="ses-score"><span>' + esc(g.name) + '</span>' +
      (v == null ? '<span class="ses-score__v is-empty"><span class="sr-only">ללא ציון</span><span aria-hidden="true">–</span></span>' : '<span class="ses-score__v">' + v + '</span>') + '</li>';
  });
  return h + '</ul></div>';
}

function metaLine(c, s) {
  var parts = [];
  if (s.date) parts.push(MD.fmtDate(s.date));
  if (s.time) parts.push(s.time);
  var m = modeText(c);
  if (m) parts.push(m);
  return parts.join(' · ');
}

function heldSheet(c, s) {
  var a = at(c, s);
  var thread = threadHTML(s, 'ses-thread--sheet');
  var scores = scoresHTML(c, s);
  var h = '<div class="ses-meta"><p class="ses-meta__line">' + esc(metaLine(c, s)) + '</p>' +
    '<div class="ses-meta__row"><button type="button" class="ses-chip ses-chip--ok" data-act="sesStatus" data-to="reopen" ' + a +
    ' aria-label="התקיים. לחיצה מבטלת את הסימון">' + ic('check', 16) + 'התקיים</button>' + (thread || scores ? App.lock('פרטי') : '') + '</div></div>';
  h += thread + scores;
  h += summaryRow(c, s);
  h += '<div class="sheet__foot ses-foot"><div class="switch-row"><span class="switch-row__title">שולם</span>' +
    '<button type="button" class="switch" role="switch" aria-checked="' + (s.paid ? 'true' : 'false') + '" aria-label="שולם" data-act="sesPaid" ' + a + '></button></div>' +
    '<button type="button" class="btn btn--quiet" data-go="client" data-id="' + esc(c.id) + '">לכל ההיסטוריה</button></div>';
  return h;
}

function cancelledSheet(c, s) {
  var a = at(c, s);
  var label = s.noShow ? noShowLabel(c) : 'בוטל';
  return '<div class="ses-meta"><p class="ses-meta__line">' + esc(metaLine(c, s)) + '</p>' +
    '<div class="ses-meta__row"><button type="button" class="ses-chip ses-chip--off" data-act="sesStatus" data-to="reopen" ' + a +
    ' aria-label="' + label + '. לחיצה מבטלת את הסימון">' + label + '</button></div></div>' +
    '<div class="sheet__foot ses-foot"><button type="button" class="btn btn--quiet" data-go="client" data-id="' + esc(c.id) + '">לכל ההיסטוריה</button></div>';
}

function sheetPrepEdit(c, s) {
  return editBlock(c, s, 'ses-prep-sheet', 'sheet', true);
}
function sheetPrepRow(c, s) {
  var a = at(c, s);
  if (s.prepNote) {
    return '<div class="row ses-preprow"><span class="row__main"><span class="ses-preprow__text" dir="auto"><span class="ses-preprow__lead">לזכור במפגש הזה:</span> ' +
      esc(s.prepNote) + '</span></span><button type="button" class="btn btn--quiet btn--sm" data-act="sesPrepEdit" data-where="sheet" ' + a + '>עריכה</button></div>';
  }
  return '<button type="button" class="row" data-act="sesPrepEdit" data-where="sheet" ' + a + '><span class="ses-ico ses-ico--bare">' + ic('plus') +
    '</span><span class="row__main"><span class="row__title">הוספת הערה למפגש הבא</span></span></button>';
}

/* ---- date + time picker (קביעת מועד / שינוי מועד / נדחה) ----
   mode 'set' = an unscheduled session (inline, the main action); 'change' / 'postpone' replace the planned list.
   Draft lives in App.ui.sessions.pick = { client, n, mode, date (ISO), time }, written by data-bind. */
function pickDefaults(c, s, mode) {
  var base = MD.TODAY, prevTime = '';
  c.sessions.forEach(function (x) {
    if (x.n < s.n && x.date) {
      prevTime = x.time || prevTime;
      if (MD.diffDays(x.date, base) > 0) base = x.date;
    }
  });
  var time = s.time || prevTime || (c.schedule && c.schedule.time) || '10:00';
  if (mode === 'change' && s.date) return { date: s.date, time: time };
  if (s.date && MD.diffDays(s.date, base) > 0) base = s.date;
  var used = {};
  c.sessions.forEach(function (x) { if (x !== s && x.date) used[x.date] = true; });
  var d = MD.addDays(base, 7), guard = 0;
  while (used[d] && guard++ < 60) d = MD.addDays(d, 7);
  if (MD.diffDays(d, MD.TODAY) < 1) d = MD.addDays(MD.TODAY, 1);
  return { date: d, time: time };
}
function pickIs(c, s, mode) {
  var p = st().pick;
  return !!(p && p.client === c.id && String(p.n) === String(s.n) && (!mode || p.mode === mode));
}
function ensurePick(c, s, mode) {
  var u = st();
  if (pickIs(c, s, mode)) return u.pick;
  var d = pickDefaults(c, s, mode);
  u.pick = { client: c.id, n: s.n, mode: mode, date: toIso(d.date), time: d.time };
  return u.pick;
}
function pickerHTML(c, s, mode) {
  var p = ensurePick(c, s, mode);
  var a = at(c, s);
  var h = '<div class="ses-pick">';
  if (mode !== 'set') h += '<h3 class="ses-h">' + (mode === 'postpone' ? 'מועד חדש' : 'שינוי מועד') + '</h3>';
  h += '<div class="ses-pick__fields">' +
    '<div class="field"><label for="ses-pk-date">תאריך</label><input type="date" id="ses-pk-date" data-bind="sessions.pick.date" value="' + esc(p.date) +
    '" min="' + toIso(MD.TODAY) + '" max="' + MAX_ISO + '"></div>' +
    '<div class="field"><label for="ses-pk-time">שעה</label><input type="time" id="ses-pk-time" data-bind="sessions.pick.time" value="' + esc(p.time) + '" step="300"></div></div>' +

      ${taField('es-og', 'מטרת על', 'endSession.og', d.og, 'המטרה הגדולה של התהליך', { disabled: d.ogLater })}

}
function step2Update(c, d) {
  const og = d.editOg
    ? taField('es-og', '<span class="sr-only">מטרת על</span>', 'endSession.og', d.og, 'המטרה הגדולה של התהליך')

/* ---- step 3: the small step ---- */
function step3(c, d) {
  return `<div class="field es-stepfield">

${E(d.smallStep)}</textarea>

/* ---- step 4: payment and report ---- */

${E(d.selfNote)}</textarea>

      ${attach('report', 'דוח מפגש ' + d.n, 'העלאת דוח מפגש אימון ' + d.n)}

/* ---- step 5: the next session ---- */
function step5(c, d) {
  const nx = nextAfter(c, d.n);
  if (!nx) return '<p class="t-lg">זה המפגש האחרון בתהליך</p>';
  const m = d.next.mode;
  let when;
  if (m === 'later') when = 'נקבע בהמשך';
  else if (m === 'custom' && d.next.iso) when = whenLine(fromIso(d.next.iso), d.next.time);
  else if (m === 'keep') when = whenLine(nx.date, nx.time);
  else when = 'טרם נקבע';
  const dated = when !== 'נקבע בהמשך' && when !== 'טרם נקבע';
  const hasDate = !!(nx.date && nx.status !== 'unscheduled');
  const changeLabel = (hasDate || (m === 'custom' && d.next.iso)) ? 'שינוי מועד' : 'קביעת מועד';
  const inputs = m === 'custom'
    ? `<div class="es-when">
        <div class="field"><label for="es-date">תאריך</label><input id="es-date" type="date" min="${toIso(MD.TODAY)}" max="2026-05-31" value="${E(d.next.iso)}" data-bind="endSession.next.iso" data-rerender></div>
        <div class="field"><label for="es-time">שעה</label><input id="es-time" type="time" value="${E(d.next.time)}" data-bind="endSession.next.time" data-rerender></div>
      </div>`
    : '';
  const note = m === 'later'
    ? `<p class="es-remind">${ico('clock', 16)}<span>אם המפגש לא ייקבע תוך 24 שעות, תופיע תזכורת לקבוע מפגש עם ${E(MD.firstName(c.name))}</span></p>`
    : '';
  return `<div class="es-next${dated ? ' es-next--set' : ''}" role="group" aria-label="המפגש הבא">
      <p class="es-next__n">מפגש ${nx.n} מתוך ${c.total}</p>
      <p class="es-next__when">${E(when)}</p>
    </div>
    <div class="btn-group es-toggles">
      <button type="button" class="btn btn--secondary" aria-pressed="${m === 'custom'}" data-act="esNextChange">${changeLabel}</button>
      <button type="button" class="btn btn--secondary" aria-pressed="${m === 'later'}" data-act="esNextLater">נקבע בהמשך</button>
    </div>
    ${inputs}${note}`;
}

/* ---- saved ---- */
function savedHTML(c, n, sv) {
  return `<div class="screen screen--reading screen--endSession es-savedscreen">
    <div class="es-saved">
      <span class="es-saved__ico" aria-hidden="true">${ico('check', 36)}</span>
      <h1 class="page-title es-title" tabindex="-1">מפגש ${n} נשמר</h1>
      ${sv.hasStep ? '<p class="page-sub">הצעד הקטן מוכן לשליחה</p>' : ''}
    </div>
    <div class="sticky-actions es-foot">
      <button type="button" class="btn btn--primary btn--block" data-go="sendPage" data-client="${E(c.id)}">שליחה לדף של ${E(MD.firstName(c.name))}</button>
      <div class="es-foot__row es-foot__row--center"><button type="button" class="btn btn--quiet btn--sm" data-act="esClose" data-go="home">חזרה להיום</button></div>
    </div>
  </div>`;
}

function renderEnd(params) {
  const c = clientOf(params.client);
  if (!c) return missingHTML();
  const n = parseInt(params.n, 10) || (MD.nextSession(c) || {}).n || 1;
  const s = MD.session(c, n);
  if (!s) return missingHTML();
  const sv = App.ui.esSaved;
  if (sv && sv.client === c.id && sv.n === n) return savedHTML(c, n, sv);
  const d = draftFor(c, s);
  let title, lock = '', body;
  switch (d.step) {
    case 1: title = 'חוט מהמפגש'; lock = App.lock('פרטי'); body = step1(c, s, d); break;
    case 2:
      title = d.first ? 'מטרות התהליך' : 'עדכון מטרות';
      body = d.first ? step2First(c, d) : step2Update(c, d);
      break;
    case 3: title = 'צעד אחד קטן'; body = step3(c, d); break;
    case 4: title = 'תשלום ודוח'; body = step4(c, d); break;
    default: title = 'המפגש הבא'; body = step5(c, d);
  }
  return frame(c, d, title, lock, body);
}
function afterEnd(params, main) {
  if (!App.ui.esTop) return;
  App.ui.esTop = false;
  const sc = main.closest('.app__scroll');
  if (sc) sc.scrollTop = 0;
  const h = main.querySelector('.es-title');
  if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}

/* ---- actions: end of session ---- */
function endCtx() {
  const d = App.ui.endSession;
  if (!d) return null;
  const c = clientOf(d.client);
  const s = c && MD.session(c, d.n);
  return s ? { d: d, c: c, s: s } : null;
}
/* a step change re-renders different content: drop focus so the shell does not restore it by position (afterEnd focuses the heading) */
function dropFocus() {
  const a = document.activeElement;
  if (a && a !== document.body && a.blur) a.blur();
}
Actions.esNext = function () {
  dropFocus();
  const x = endCtx(); if (!x) return false;
  if (x.d.step < STEPS) { x.d.step++; App.ui.esTop = true; }
};
Actions.esPrev = function () {
  dropFocus();
  const x = endCtx(); if (!x) return false;
  if (x.d.step > 1) { x.d.step--; App.ui.esTop = true; }
};
/* "דילוג": drop what was entered on this step (back to the saved state) and move on */
Actions.esSkip = function () {
  dropFocus();
  const x = endCtx(); if (!x) return false;
  const fresh = initDraft(x.c, x.s);
  (STEP_KEYS[x.d.step] || []).forEach((k) => { x.d[k] = fresh[k]; });
  if (x.d.step < STEPS) { x.d.step++; App.ui.esTop = true; }
};
Actions.esEditOg = function () {
  const x = endCtx(); if (!x) return false;
  x.d.editOg = !x.d.editOg;
};
Actions.esOgLater = function () {
  const x = endCtx(); if (!x) return false;
  x.d.ogLater = !x.d.ogLater;
};
Actions.esScore = function (ds) {
  const x = endCtx(); if (!x) return false;
  const v = +ds.v;
  if (ds.i !== undefined) {
    const g = x.d.goals[+ds.i];
    if (g) g.score = g.score === v ? null : v;
  } else if (ds.goal) {
    x.d.scores[ds.goal] = x.d.scores[ds.goal] === v ? null : v;
  }
};
Actions.esGoalAdd = function () {
  const x = endCtx(); if (!x) return false;
  if (x.d.goals.length < MAX_GOALS) x.d.goals.push({ id: null, name: '', score: null });
};
Actions.esGoalDel = function (ds) {
  const x = endCtx(); if (!x) return false;
  if (x.d.goals.length > 1) x.d.goals.splice(+ds.i, 1);
};
Actions.esPaid = function () {
  const x = endCtx(); if (!x) return false;
  x.d.paid = !x.d.paid;
};
/* the prototype has no real upload: attaching simply records a file name */
Actions.esAttach = function (ds) {
  const x = endCtx(); if (!x) return false;
  if (ds.kind === 'receipt' || ds.kind === 'report') x.d[ds.kind] = ds.name || 'קובץ.pdf';
};
Actions.esDetach = function (ds) {
  const x = endCtx(); if (!x) return false;
  if (ds.kind === 'receipt' || ds.kind === 'report') x.d[ds.kind] = '';
};
Actions.esNextChange = function () {
  const x = endCtx(); if (!x) return false;
  const n = x.d.next;
  if (n.mode === 'custom') {
    const nx = nextAfter(x.c, x.d.n);
    n.mode = nx && nx.date && nx.status !== 'unscheduled' ? 'keep' : 'unset';
  } else {
    n.mode = 'custom';
  }
};
Actions.esNextLater = function () {
  const x = endCtx(); if (!x) return false;
  const n = x.d.next;
  if (n.mode === 'later') {
    const nx = nextAfter(x.c, x.d.n);
    n.mode = nx && nx.date && nx.status !== 'unscheduled' ? 'keep' : 'unset';
  } else {
    n.mode = 'later';
  }
};
Actions.esClose = function () {
  App.ui.esSaved = null;
};

/* The data rules of ROUTES.md "Marking a session held" */
Actions.esFinish = function () {
  dropFocus();
  const x = endCtx(); if (!x) return false;
  const d = x.d, c = x.c, s = x.s, n = d.n;
  const scores = {};

  if (d.first) {
    let max = 0;
    c.goals.forEach((g) => { const m = /g(\d+)$/.exec(g.id); if (m) max = Math.max(max, +m[1]); });
    const kept = [];
    d.goals.forEach((g) => {
      const name = (g.name || '').trim();
      if (!name) return;
      const id = g.id || (c.id + 'g' + (++max));
      kept.push({ id: id, name: name });
      scores[id] = g.score == null ? null : g.score;
    });
    c.goals = kept;
    const og = (d.og || '').trim();
    if (og && !d.ogLater) {
      c.overarchingGoal = og;
      if (c.overarchingSetAt == null) c.overarchingSetAt = n;
    }
  } else {
    c.goals.forEach((g) => { scores[g.id] = d.scores[g.id] == null ? null : d.scores[g.id]; });
    const og = (d.og || '').trim();
    if (og && og !== (c.overarchingGoal || '')) {
      c.overarchingGoal = og;
      if (c.overarchingSetAt == null) c.overarchingSetAt = n;
    }
  }
  c.sessions.forEach((o) => {
    if (o.status === 'held' && o.n !== n) {
      o.scores = o.scores || {};
      c.goals.forEach((g) => { if (!(g.id in o.scores)) o.scores[g.id] = null; });
    }
  });

  s.status = 'held';
  if (!s.date) s.date = MD.TODAY;
  if (!s.time) s.time = MD.NOW;
  s.topic = (d.topic || '').trim();
  s.feeling = (d.feeling || '').trim();
  s.stoppedAt = (d.stoppedAt || '').trim();
  s.step = (d.smallStep || '').trim();
  s.scores = scores;
  s.paid = !!d.paid;
  if ((d.selfNote || '').trim()) s.selfNote = d.selfNote.trim();

  c.documents = c.documents || [];
  const addDoc = (title, kind) => {
    if (!c.documents.some((o) => o.title === title && o.sessionN === n)) {
      c.documents.push({ id: MD.id('d'), title: title, kind: kind, date: MD.TODAY, meta: 'PDF', sessionN: n });
    }
  };
  if (d.report) {
    addDoc('דוח מפגש אימון ' + n, 'report');
    s.summary = s.summary === 'notebook' || s.summary === 'both' ? 'both' : 'file';
  }
  if (d.receipt) addDoc('קבלה · מפגש ' + n, 'file');

  const nx = nextAfter(c, n);
  if (nx) {
    const m = d.next.mode;
    if (m === 'later') {
      nx.status = 'unscheduled'; nx.date = null; nx.time = null;
    } else if (m === 'custom' && d.next.iso) {
      nx.date = fromIso(d.next.iso);
      nx.time = d.next.time || (c.schedule && c.schedule.time) || '10:00';
      nx.status = nx.date === MD.TODAY ? 'today' : 'planned';
    }
  }

  if (App.ui.live && App.ui.live.client === c.id) App.ui.live = null;
  App.ui.endSession = null;
  App.ui.esSaved = { client: c.id, n: n, hasStep: !!s.step };
  App.ui.esTop = true;
  /* L10: no toast here, the saved screen's heading ("מפגש N נשמר") is the confirmation */
};

/* ================================================================
   SEND PAGE (the composer)
   The approved Composer: the small step (editable), "מילה ממני" (a short
   personal line), "צירוף מסמך או תמונה" (simulated pick), the primary
   "שליחה בוואטסאפ" and the quiet actions "תצוגה מקדימה" / "העתקת הטקסט".
   The message the client gets is built by sendMessage().
   ================================================================ */
/* file name with the extension isolated LTR, so "name.pdf" does not flip inside RTL text */
function fileNameHTML(name) {
  const s = String(name || ''), i = s.lastIndexOf('.');
  return i > 0 ? '<bdi>' + E(s.slice(0, i)) + '</bdi><bdi dir="ltr">' + E(s.slice(i)) + '</bdi>' : '<bdi>' + E(s) + '</bdi>';
}
function clientLink(c) {
  const co = App.data.coach || {};
  return typeof window.mfClientPageLink === 'function' ? window.mfClientPageLink(c) : (co.pageLink || 'maftan.co.il') + '/p/' + c.id;
}
function sendState(c, lh) {
  let st = App.ui.sendPage;
  if (!st || st.client !== c.id || st.n !== lh.n) {
    const text = lh.step || '';
    st = App.ui.sendPage = { client: c.id, n: lh.n, text: text, word: '', file: '', edit: !text.trim(), sent: false };
  }
  return st;
}
/* the text the client receives (client-facing, neutral address) */
function sendMessage(c, st) {
  const first = MD.firstName(c.name);
  const step = (st.text || '').trim();
  const word = (st.word || '').trim();
  const parts = [];
  parts.push('היי ' + first + ', הצעד הקטן שלך עד המפגש הבא:' + (step ? '\n' + step : ''));
  if (word) parts.push(word);
  parts.push('הדף האישי שלך: https://' + clientLink(c));
  return parts.join('\n\n');
}
function bubbleHTML(c, st) {
  const h = E(sendMessage(c, st)).replace(/https?:\/\/[^\s<]+/g, (u) => '<span class="sp-link" dir="ltr">' + u + '</span>');
  const file = st.file ? `<p class="sp-bubble__file">${ico('file', 16)}<span>${fileNameHTML(st.file)}</span></p>` : '';
  return `<div class="sp-bubble" role="group" aria-label="ההודעה"><p dir="auto">${h}</p>${file}</div>`;
}

function renderSend(params) {
  const c = clientOf(params.client);
  if (!c) return missingHTML();
  const lh = MD.lastHeld(c);
  if (!lh) {
    return `<div class="screen screen--reading screen--sendPage"><div class="empty">
      <h2 class="empty__title">עוד אין מפגש שהתקיים</h2>

    </div></div>`;
  }

  const has = !!(st.text || '').trim();
  const edit = st.edit || !has;
  const stepBody = edit
    ? `<div class="field sp-field">
        <label for="sp-text" class="sr-only">הצעד הקטן</label>
        <textarea id="sp-text" rows="4" data-bind="sendPage.text" placeholder="מה הצעד הקטן עד המפגש הבא?">
${E(st.text)}</textarea>
      </div>`
    : `<p class="sp-step__text">${E(st.text)}</p>`;
  const stepCard = `<section class="sp-step" aria-labelledby="sp-step-h">
      <div class="sp-step__head">
        <h2 class="sp-step__title" id="sp-step-h">${ico('step', 16)}<span>צעד אחד קטן</span></h2>
        ${has ? `<button type="button" class="link-btn sp-step__edit" data-act="spEdit">${ico(edit ? 'check' : 'edit', 16)}${edit ? 'אישור' : 'עריכה'}</button>` : ''}
      </div>
      ${stepBody}
    </section>`;
  const word = `<div class="field sp-word">
      <label for="sp-word">מילה ממני</label>
      <textarea id="sp-word" rows="2" data-bind="sendPage.word" placeholder="למשל: נתראה ביום שלישי">
${E(st.word)}</textarea>
    </div>`;
  const attach = st.file
    ? `<div class="sp-file">${ico('file')}<span class="sp-file__name">${fileNameHTML(st.file)}</span><button type="button" class="btn btn--quiet btn--sm" data-act="spDetach" aria-label="הסרת הקובץ ${E(st.file)}">הסרה</button></div>`
    : `<button type="button" class="sp-upload" data-act="spAttach">${ico('plus')}צירוף מסמך או תמונה</button>`;
  const actions = st.sent
    ? `<button type="button" class="btn btn--secondary btn--block" data-go="clientPage" data-client="${E(c.id)}">${ico('eye')}תצוגת המתאמן/ת</button>
       <button type="button" class="btn btn--quiet btn--sm" data-act="spSkip" data-go="home">חזרה להיום</button>`
    : `<button type="button" class="btn btn--primary btn--block" id="sp-send" data-act="spSend" data-client="${E(c.id)}"${has ? '' : ' disabled'}>${ico('whatsapp')}שליחה בוואטסאפ</button>
       <div class="sp-foot__row">
         <button type="button" class="btn btn--quiet btn--sm" data-sheet="sendPreview">תצוגה מקדימה</button>
         <button type="button" class="btn btn--quiet btn--sm" data-act="spCopy">העתקת הטקסט</button>
         <button type="button" class="btn btn--quiet btn--sm" data-act="spSkip" data-go="home">דילוג</button>
       </div>`;
  return `<div class="screen screen--reading screen--sendPage">
    <header class="page-head">
      <h1 class="page-title">שליחה לדף</h1>
      <p class="page-sub">${E(c.name)} · מפגש ${lh.n}</p>
    </header>
    <div class="sp-body">
      ${stepCard}

      ${attach}
    </div>
    <div class="sticky-actions sp-foot">${actions}</div>
  </div>`;
}
function afterSend() {

}

Actions.spCopy = function () {
  const st = App.ui.sendPage;
  const c = st && clientOf(st.client);
  if (!c) return false;
  const text = sendMessage(c, st);
  const ok = () => App.toast('הטקסט הועתק');
  const fallback = () => {
    const ta = document.createElement('textarea');
    let done = false;
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else App.toast('לא הצלחנו להעתיק', { error: true });
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  } catch (e) { fallback(); }
  return false;
};
Actions.spSend = function (ds) {
  const st = App.ui.sendPage;
  const c = clientOf(ds.client);
  if (!st || !c) return false;
  const text = (st.text || '').trim();
  if (!text) return false;
  const s = MD.session(c, st.n);
  if (s) s.step = text;
  st.text = text;
  st.sent = true;
  App.toast('נשלח לדף של ' + MD.firstName(c.name));
};
Actions.spSkip = function () {
  App.ui.esSaved = null;
  return false;
};

function accent() {

function coachInitial() {

function genderOf(c) { return (f, m, n) => MD.byGender(c.gender, f, m, n); }

/* ---- the contract (an original sample text, filled from the client and the coach) ---- */
function contractSections(c) {

  const N = c.total, P = c.price;
  const coachM = co.gender === 'm';
  const coachN = coachM ? 'המאמן' : 'המאמנת';
  const coachL = coachM ? 'למאמן' : 'למאמנת';
  const clientN = G('המתאמנת', 'המתאמן', 'המתאמן/ת');
  const where = c.mode === 'inperson' ? 'המפגשים מתקיימים פרונטלית' : 'המפגשים מתקיימים בזום';
  const sections = [
    ['התהליך', [
      `תהליך האימון כולל ${N} מפגשים של כשעה כל אחד. ${where}, במועדים שנקבעים בתיאום ביניהם.`,
      `אפשר להמשיך מעבר ל-${N} המפגשים בהסכמה של שני הצדדים.`
    ]],
    ['אחריות אישית', [

      'הכלים והתרגילים בתהליך הם המלצה בלבד, ואין הבטחה לתוצאה מסוימת.'
    ]],
    ['אימון אינו טיפול', [
      'אימון אינו טיפול פסיכולוגי או רפואי ואינו מחליף אותם. אם יש טיפול מקביל, מומלץ להתייעץ עם הגורם המטפל לפני כל שינוי בו.'
    ]],
    ['סודיות', [
      `מה שנאמר במפגשים נשאר בין ${coachN} לבין ${clientN}, גם אחרי סיום התהליך. החריג היחיד הוא מקרה שבו החוק מחייב אחרת.`
    ]],
    ['ביטול ושינוי מועד', [
      'שינוי או ביטול של מפגש מודיעים לפחות 24 שעות מראש, וקובעים מועד חדש בהקדם האפשרי.',
      'ביטול מאוחר יותר נחשב כמפגש שהתקיים, פרט למקרה אחד במהלך התהליך.'
    ]],
    ['איחור', [
      `מפגש שמתחיל באיחור מסתיים בזמן המתוכנן. ${coachN} ${coachM ? 'ינסה' : 'תנסה'} להאריך אותו כשאפשר.`
    ]],
    ['עלות ותשלום', [
      `${MD.price(N * P)} לתהליך של ${N} מפגשים (${MD.price(P)} למפגש). התשלום על כל מפגש מתבצע בסיומו.`,
      `מפגש נוסף מעבר ל-${N} עולה ${MD.price(P)}.`
    ]],
    ['פרטיות ושמירת מידע', [
      `הפרטים שלך נשמרים במערכת מפתן, וגישה אליהם יש רק ${coachL}. אפשר לבקש את מחיקתם בכל שלב.`
    ]]

      `${coachN} ${coachM ? 'נמצא' : 'נמצאת'} בהכשרה, ולכן מפגשים עשויים להיות מוקלטים ולהיות נדונים בהדרכה, בסודיות מלאה ובהסכמתך.`

/* M10: on the page the unsigned contract is ONE row; it opens the reading view (S12 frames 3-4) */

function pageHTML(c, st) {
  const co = App.data.coach || {};
  const ct = c.contract || {};
  if (st.reading && ct.status === 'sent') return contractView(c, st);
  let contract = '';
  if (ct.status === 'sent') contract = contractRow();
  else if (ct.status === 'signed') {
    contract = `<div class="cp-signed" role="status">
      <span class="cp-signed__ico" aria-hidden="true">${ico('check', 16)}</span>
      <p>החוזה נחתם · ${E(dateOf(ct.signedAt))}</p>
    </div>`;
  }
  const nx = MD.nextSession(c);
  const next = nx && nx.date && nx.status !== 'unscheduled'
    ? `<div class="cp-next">${ico('calendar')}<p><span class="muted">המפגש הבא</span> · <strong>${E(whenLine(nx.date, nx.time))}</strong></p></div>`
    : '';
  const stepText = MD.lastStep(c);
  const step = stepText
    ? `<section class="cp-sec" aria-labelledby="cp-step-h">
        <h2 id="cp-step-h">הצעד הקטן שלך</h2>
        <div class="step-line cp-stepline">${ico('step', 16)}<p>${E(stepText)}</p></div>
      </section>`
    : '';
  const og = c.overarchingShared && c.overarchingGoal
    ? `<section class="cp-sec" aria-labelledby="cp-og-h">
        <h2 id="cp-og-h">מטרת העל</h2>
        <p class="cp-og">${E(c.overarchingGoal)}</p>
      </section>`
    : '';
  const held = c.sessions.filter((s) => s.status === 'held').slice().reverse();
  const sessions = held.length
    ? `<section class="cp-sec" aria-labelledby="cp-s-h">
        <h2 id="cp-s-h">המפגשים</h2>
        <ul class="rows rows--flat" role="list">${held.map((s) =>
          `<li class="row cp-sess"><span class="row__main"><span class="row__title">מפגש ${s.n}</span></span><span class="row__end">${E(s.date || '')}</span></li>`).join('')}</ul>
      </section>`
    : '';
  const empty = !contract && !next && !step && !og && !sessions
    ? '<p class="muted">אחרי כל מפגש יופיע כאן דף חדש.</p>'
    : '';
  return `<div class="screen screen--bleed screen--clientPage cp-page" data-coach-accent="${E(accent())}">
    <header class="cp-head">
      <div class="cp-wrap">
        ${cpTopLinks(c, true)}
        <div class="cp-head__in">
          <div class="cp-avatar" role="img" aria-label="התמונה של ${E(co.name || '')}"><span aria-hidden="true">${E(coachInitial())}</span></div>
          <div class="grow">
            <h1 class="page-title" tabindex="-1">הדף שלי</h1>
            <p class="cp-coach">${E(co.name || '')} · אימון הוליסטי</p>
          </div>
        </div>
      </div>
    </header>
    <div class="cp-wrap cp-main">
      ${contract}${next}${step}${og}${sessions}${empty}
    </div>
    <footer class="cp-wrap cp-foot"><p class="cp-brand">נבנה עם מפתן</p></footer>
  </div>`;
}

function renderClient(params) {
  const c = clientOf(params.client);
  if (!c) return missingHTML();
  const st = cpState();
  if (st.for !== c.id) { st.for = c.id; st.err = ''; st.signName = ''; st.consent = false; st.reading = false; }
  return st.unlocked[c.id] ? pageHTML(c, st) : unlockHTML(c, st);
}
function afterClient(params, main) {
  const st = cpState();
  if (st.top) {
    st.top = false;
    const sc = main.closest('.app__scroll');
    if (sc) sc.scrollTop = 0;
    const h = main.querySelector('h1[tabindex="-1"]');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }
  if (st.focus) {
    st.focus = false;
    const d1 = main.querySelector('#cp-d1');
    if (d1) { try { d1.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }
}

/* ---- actions: client page ---- */
Actions.cpUnlock = function (ds, el) {
  const c = clientOf(ds.client);
  if (!c) return false;
  const st = cpState();
  const form = el.closest('form');
  const code = Array.prototype.map.call(form.querySelectorAll('.cp-pin__d'), (i) => i.value).join('');
  dropFocus();
  if (code.length < 4) { st.err = 'short'; st.focus = true; return; }
  if (code === String(c.pagePin)) { st.unlocked[c.id] = true; st.err = ''; return; }
  st.err = 'wrong';
  st.focus = true;
};
Actions.cpLock = function () {
  const st = cpState();
  if (st.for) st.unlocked[st.for] = false;
  st.err = '';
  st.reading = false;
};
Actions.cpReadContract = function () {
  dropFocus();
  const st = cpState();
  st.reading = true;
  st.top = true;
};
Actions.cpCloseContract = function () {
  dropFocus();
  const st = cpState();
  st.reading = false;
  st.top = true;
};
Actions.cpSign = function (ds, el) {
  const c = clientOf(ds.client);
  if (!c || !c.contract || c.contract.status !== 'sent') return false;
  const form = el.closest('form');
  const name = ((form.querySelector('.cp-name') || {}).value || '').trim();
  const agreed = !!(form.querySelector('.cp-consent') || {}).checked;
  if (name.length < 2 || !agreed) return false;
  c.contract.status = 'signed';
  c.contract.signedAt = MD.stamp(MD.TODAY, MD.NOW);
  c.contract.typedName = name;
  const st = cpState();
  st.signName = '';
  st.consent = false;
  /* back to the page, where the contract is now the one row "החוזה נחתם" (no toast: it would repeat the row) */
  st.reading = false;
  st.top = true;
};

/* ---- live behaviour that a re-render must not interrupt (pin digits, sign button, send button) ---- */
function syncSign(form) {
  if (!form) return;
  const name = form.querySelector('.cp-name'), cb = form.querySelector('.cp-consent'), btn = form.querySelector('.cp-signbtn');
  if (name && cb && btn) btn.disabled = !(name.value.trim().length >= 2 && cb.checked);
}
function pinInputs(el) {
  return Array.prototype.slice.call(el.closest('.cp-pin').querySelectorAll('.cp-pin__d'));
}
function maybeOpen(el) {
  const all = pinInputs(el);
  if (all.every((i) => i.value)) {
    const btn = el.closest('form').querySelector('.cp-open');
    setTimeout(() => { if (btn && btn.isConnected) btn.click(); }, 120);
  }
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || !t.classList) return;
  if (t.classList.contains('cp-pin__d')) {
    const v = t.value.replace(/\D/g, '');
    t.value = v.slice(-1);
    if (t.value) {
      const all = pinInputs(t), i = all.indexOf(t);
      if (all[i + 1]) all[i + 1].focus();
      maybeOpen(t);
    }
  } else if (t.classList.contains('cp-name')) {
    syncSign(t.form);
  } else if (t.id === 'sp-text') {
    const b = document.getElementById('sp-send');
    if (b) b.disabled = !t.value.trim();
  }
}, true);
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('cp-consent')) syncSign(t.form);
}, true);
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (!t || !t.classList || !t.classList.contains('cp-pin__d')) return;
  const all = pinInputs(t), i = all.indexOf(t);
  if (e.key === 'Backspace' && !t.value && all[i - 1]) {
    e.preventDefault();
    all[i - 1].value = '';
    all[i - 1].focus();
  }
}, true);
document.addEventListener('paste', (e) => {
  const t = e.target;
  if (!t || !t.classList || !t.classList.contains('cp-pin__d')) return;
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd ? String(cd.getData('text') || '').replace(/\D/g, '') : '';
  if (!txt) return;
  e.preventDefault();
  const all = pinInputs(t);
  all.forEach((inp, i) => { inp.value = txt.charAt(i) || ''; });
  const last = all[Math.min(txt.length, 4) - 1];
  if (last) last.focus();
  maybeOpen(t);
}, true);

   Run before the shell starts (this file loads before DOMContentLoaded), so the seed signature includes them. */
(function patchSeed() {
  var seed = MD.seed;
  seed.leads.forEach(function (l) { if (l.source === 'קוד QR') l.source = 'קוד סריקה'; });
  seed.clients.forEach(function (c) {
    (c.documents || []).forEach(function (d) { if (d.meta === 'PDF') d.meta = 'קובץ'; });
  });
})();

/* --------------------------------------------------------------- story data */
var PHASE = { none: 0, fresh: 1, fit: 2, called: 3, opened: 4, signed: 5, held: 6 };

function storyLead(p) {
  var l = {
    id: LEAD, name: PERSONA.name, phone: PERSONA.phone, source: 'הקישור לעמוד', createdAt: MD.stamp(MD.TODAY, MD.NOW), stage: 'new',
    answers: { why: PERSONA.why, mode: 'zoom', times: 'ערב', address: 'f', how: 'דרך הקישור לעמוד שלך', before: 'לא' },
    callAt: null, callSummary: '', returning: false, priv: '', returningNote: '', invitedAt: null, stageAt: null,
    reminders: [], waAt: null, clientId: null, closedReason: ''
  };
  if (p >= PHASE.fit) { l.stage = 'fit'; l.stageAt = MD.TODAY; }
  if (p >= PHASE.called) {
    l.stage = 'after_call'; l.createdAt = '15.10 21:10'; l.invitedAt = '16.10'; l.callAt = '17.10 19:00';
    l.callSummary = PERSONA.callSummary; l.stageAt = '17.10';
  }
  if (p >= PHASE.opened) { l.stage = 'started'; l.stageAt = MD.TODAY; l.clientId = CLIENT; }
  return l;
}

/* the same shape as Actions.processCreate (35-process.js): a fixed weekly process, 10 sessions, the contract sent */
function storyClient(p) {
  var first = MD.addDays(MD.TODAY, 7), sessions = [], i, stamp = MD.stamp(MD.TODAY, MD.NOW);
  for (i = 0; i < 10; i++) {
    sessions.push({
      n: i + 1, date: MD.addDays(first, 7 * i), time: '17:00', status: 'planned', paid: false, topic: '', feeling: '', stoppedAt: '', step: '',
      scores: {}, summary: null, prepNote: '', prepNoteAt: '', reminded: false
    });
  }
  return {
    id: CLIENT, status: 'active', name: PERSONA.name, gender: 'f', phone: PERSONA.phone, pagePin: PERSONA.phone.slice(-4), mode: 'zoom', duration: 60,
    price: 350, total: 10, schedule: { type: 'fixed', weekday: MD.weekdayOf(first), time: '17:00', every: 1 },
    goals: [], overarchingGoal: null, overarchingSetAt: null, overarchingShared: false,
    contract: p >= PHASE.signed
      ? { status: 'signed', sentAt: stamp, signedAt: stamp, typedName: PERSONA.name, version: '14.10' }
      : { status: 'sent', sentAt: stamp, signedAt: null, typedName: null, version: '14.10' },
    documents: [], sessions: sessions
  };
}

/* the coach finished session 6 with the sample client: the thread, the scores, the small step, the notebook entry */
function holdSession6(data) {
  var c = MD.client(data, COACH_CLIENT), s = MD.session(c, 6);
  s.status = 'held'; s.topic = S6.topic; s.feeling = S6.feeling; s.stoppedAt = S6.stoppedAt; s.step = S6.step;
  s.scores = clone(S6.scores); s.paid = true; s.summary = 'notebook';
  c.overarchingShared = true;
  data.notes.push({
    id: 'nT', title: 'סיכום מפגש 6', body: S6.note, clientId: COACH_CLIENT, sessionN: 6,
    createdAt: MD.stamp(MD.TODAY, MD.NOW), updatedAt: MD.stamp(MD.TODAY, MD.NOW)
  });
}

function reset() {
  if (App.sheet) App.closeSheet({ restore: false });
  App.state.data = clone(MD.seed);
  App.state.ui = {};
  App.state.history = [];
  try { localStorage.removeItem('maftan-proto/state'); localStorage.removeItem('maftan.blur'); } catch (e) { /* storage blocked */ }
}

function build(phase) {
  var p = PHASE[phase], data = App.state.data;
  if (p >= PHASE.fresh) data.leads.push(storyLead(p));
  if (p >= PHASE.opened) {
    data.clients.push(storyClient(p));
    data.coach.availability.spots = 1;
  }
  if (p >= PHASE.held) holdSession6(data);
}

/* ------------------------------------------------------------------ scenes */
function endDraft() {
  /* the end-of-session screen creates its own draft on first render; then it is filled in */
  App.replace('endSession', { client: COACH_CLIENT, n: '6' });
  var d = App.ui.endSession;
  d.topic = S6.topic; d.feeling = S6.feeling; d.stoppedAt = S6.stoppedAt; d.smallStep = S6.step;
  d.scores = clone(S6.scores); d.paid = true;
  return d;
}
function goalsExtra() {
  var c = MD.client(App.data, COACH_CLIENT), g = c && c.goals[0], p = g && MD.goalProgress(c, g.id);
  return p && p.from != null ? 'מעקב מטרות: ' + g.name + ' מ-' + p.from + ' ל-' + p.to : 'מעקב מטרות';
}
